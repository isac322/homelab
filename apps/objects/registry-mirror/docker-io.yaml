apiVersion: v1
kind: ConfigMap
metadata:
  name: registry-docker-io
  namespace: arc-systems
data:
  config.yml: |
    version: 0.1
    log:
      fields:
        service: registry
    storage:
      filesystem:
        rootdirectory: /var/lib/registry
      delete:
        enabled: true
    http:
      addr: :5000
    proxy:
      remoteurl: https://registry-1.docker.io
---
# Cache volume on pillar-csi (non-replicated SSD). A pull-through cache can
# be refetched, so it does not need a replicated pool, and thin is fine.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: registry-docker-io-pillar
  namespace: arc-systems
  annotations:
    pillar-csi.bhyoo.com/backend: |
      zfs: {properties: {refreservation: none}}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ssd-single
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry-docker-io
  namespace: arc-systems
  labels:
    app: registry-docker-io
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: registry-docker-io
  template:
    metadata:
      labels:
        app: registry-docker-io
    spec:
      enableServiceLinks: false
      # pillar-csi volumes attach only where its node plugin is registered.
      nodeSelector:
        pillar-csi.bhyoo.com/nvmeof: "true"
      containers:
        - name: registry
          image: docker.io/library/registry:3.1.2@sha256:ddf754342cfc8acc51a56d5d0ab6af06826461864460636d8bd5c546dab2a7b8
          ports:
            - name: registry
              containerPort: 5000
          resources:
            requests:
              cpu: 10m
              memory: 40Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: config
              mountPath: /etc/distribution
              readOnly: true
            - name: data
              mountPath: /var/lib/registry
          readinessProbe:
            tcpSocket:
              port: 5000
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 5000
            periodSeconds: 15
      volumes:
        - name: config
          configMap:
            name: registry-docker-io
        - name: data
          persistentVolumeClaim:
            claimName: registry-docker-io-pillar
---
apiVersion: v1
kind: Service
metadata:
  name: registry-docker-io
  namespace: arc-systems
  labels:
    app: registry-docker-io
spec:
  type: NodePort
  selector:
    app: registry-docker-io
  ports:
    - name: registry
      port: 5000
      targetPort: 5000
      nodePort: 30500
