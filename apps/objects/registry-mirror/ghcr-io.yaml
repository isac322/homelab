apiVersion: v1
kind: ConfigMap
metadata:
  name: registry-ghcr-io
  namespace: arc-systems
data:
  config.yml: |
    version: 0.1
    log:
      fields:
        service: registry
    storage:
      filesystem:
        rootdirectory: /var/lib/registry
      delete:
        enabled: true
    http:
      addr: :5000
    proxy:
      remoteurl: https://ghcr.io
---
# Cache volume on pillar-csi. The zvol was created by democratic-csi and
# imported in place on 2026-10-01, so the cache kept its contents.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: registry-ghcr-io
  namespace: arc-systems
  annotations:
    pillar-csi.bhyoo.com/import-zvol: hot-data/k8s/pvc-d50eedcd-2708-4ea2-88d4-e8419273342b
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ssd-ha
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry-ghcr-io
  namespace: arc-systems
  labels:
    app: registry-ghcr-io
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: registry-ghcr-io
  template:
    metadata:
      labels:
        app: registry-ghcr-io
    spec:
      enableServiceLinks: false
      containers:
        - name: registry
          image: docker.io/library/registry:3.1.2@sha256:ddf754342cfc8acc51a56d5d0ab6af06826461864460636d8bd5c546dab2a7b8
          ports:
            - name: registry
              containerPort: 5000
          # Sized like registry-docker-io: 14-day P50 18Mi, P99 50Mi, and an
          # OOM-truncated peak of ~97Mi (anon 44Mi + unreclaimed file 53Mi).
          env:
            - name: GOMEMLIMIT
              value: 128MiB
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              memory: 192Mi
          volumeMounts:
            - name: config
              mountPath: /etc/distribution
              readOnly: true
            - name: data
              mountPath: /var/lib/registry
          readinessProbe:
            tcpSocket:
              port: 5000
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 5000
            periodSeconds: 15
      volumes:
        - name: config
          configMap:
            name: registry-ghcr-io
        - name: data
          persistentVolumeClaim:
            claimName: registry-ghcr-io
---
apiVersion: v1
kind: Service
metadata:
  name: registry-ghcr-io
  namespace: arc-systems
  labels:
    app: registry-ghcr-io
spec:
  type: NodePort
  selector:
    app: registry-ghcr-io
  ports:
    - name: registry
      port: 5000
      targetPort: 5000
      nodePort: 30501
