      "chat_id": "5286349319",
      "text": "Agent Vault personal vault setup\n\nOpen this link within 48 hours and set your password:\n{{ .invite.inviteLink }}\n\nLogin email: {{ .invite.email }}\nVault: bhyoo",
      "disable_web_page_preview": true
    }
  secrets:
    - name: telegram
      secretRef:
        name: isacmes-credentials
    - name: invite
      secretRef:
        name: agent-vault-bhyoo-invite
