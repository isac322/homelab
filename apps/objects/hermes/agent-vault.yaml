apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-vault-skill
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  SKILL.md: |
    ---
    name: agent-vault
    description: Use Agent Vault for authenticated third-party API and CLI requests without exposing credentials.
    ---

    # Agent Vault

    Before reporting that credentials are unavailable, call the Agent Vault
    discovery endpoint using `AGENT_VAULT_ADDR`, `AGENT_VAULT_TOKEN`, and
    `AGENT_VAULT_VAULT`.

    ```bash
    curl -fsS "$AGENT_VAULT_ADDR/discover" \
      -H "Authorization: Bearer $AGENT_VAULT_TOKEN" \
      -H "X-Vault: $AGENT_VAULT_VAULT"
    ```

    Calls to configured upstream hosts are already routed through the Agent
    Vault proxy. Call the real upstream API without reading or printing its
    credential. If access is missing, create a proposal through
    `POST $AGENT_VAULT_ADDR/v1/proposals`, send the returned `approval_url` to
    the user in Telegram, and wait for approval before retrying.

    Never print, log, decode, or transmit `AGENT_VAULT_TOKEN`.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-vault-egress
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: isacmes
      app.kubernetes.io/name: hermes-agent
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agent-vault
          podSelector:
            matchLabels:
              app.kubernetes.io/name: agent-vault
      ports:
        - protocol: TCP
          port: 14321
        - protocol: TCP
          port: 14322
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: agent-vault-owner-password
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  length: 64
  digits: 16
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent-vault-owner-credentials
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: Prune=false
spec:
  refreshPolicy: CreatedOnce
  target:
    name: agent-vault-owner-credentials
    creationPolicy: Orphan
    deletionPolicy: Retain
    immutable: true
    template:
      engineVersion: v2
      metadata:
        labels:
          external-secrets.io/type: webhook
      data:
        email: owner@agent-vault.local
        password: '{{ .password }}'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: agent-vault-owner-password
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Webhook
metadata:
  name: agent-vault-register-owner
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  method: POST
  url: http://agent-vault.agent-vault.svc.cluster.local:14321/v1/auth/register
  timeout: 10s
  headers:
    Content-Type: application/json
  body: |
    {
      "email": "{{ .owner.email }}",
      "password": "{{ .owner.password }}",
      "device_label": "external-secrets-operator"
    }
  secrets:
    - name: owner
      secretRef:
        name: agent-vault-owner-credentials
  result:
    jsonPath: "$"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent-vault-register-owner
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: Prune=false
spec:
  refreshPolicy: CreatedOnce
  target:
    name: agent-vault-register-owner
    creationPolicy: Orphan
    deletionPolicy: Retain
    immutable: true
    template:
      engineVersion: v2
      data:
        status: complete
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Webhook
          name: agent-vault-register-owner
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Webhook
metadata:
  name: agent-vault-owner-login
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  method: POST
  url: http://agent-vault.agent-vault.svc.cluster.local:14321/v1/auth/login
  timeout: 10s
  headers:
    Content-Type: application/json
  body: |
    {
      "email": "{{ .owner.email }}",
      "password": "{{ .owner.password }}",
      "device_label": "external-secrets-operator"
    }
  secrets:
    - name: owner
      secretRef:
        name: agent-vault-owner-credentials
  result:
    jsonPath: "$"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent-vault-owner-session
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: Prune=false
spec:
  refreshPolicy: CreatedOnce
  target:
    name: agent-vault-owner-session
    creationPolicy: Orphan
    deletionPolicy: Retain
    immutable: true
    template:
      engineVersion: v2
      metadata:
        labels:
          external-secrets.io/type: webhook
      data:
        token: '{{ .token }}'
        expiresAt: '{{ .expires_at }}'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Webhook
          name: agent-vault-owner-login
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Webhook
metadata:
  name: agent-vault-invite-owner
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  method: POST
  url: http://agent-vault.agent-vault.svc.cluster.local:14321/v1/users/invites
  timeout: 10s
  headers:
    Content-Type: application/json
    Authorization: Bearer {{ .auth.token }}
  body: |
    {
      "email": "bhyoo@agent-vault.local",
      "role": "owner",
      "vaults": [
        {
          "vault_name": "default",
          "vault_role": "admin"
        }
      ]
    }
  secrets:
    - name: auth
      secretRef:
        name: agent-vault-owner-session
  result:
    jsonPath: "$"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent-vault-owner-invite
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: Prune=false
spec:
  refreshPolicy: CreatedOnce
  target:
    name: agent-vault-owner-invite
    creationPolicy: Orphan
    deletionPolicy: Retain
    immutable: true
    template:
      engineVersion: v2
      metadata:
        labels:
          external-secrets.io/type: webhook
      data:
        email: '{{ .email }}'
        expiresAt: '{{ .expires_at }}'
        inviteLink: '{{ .invite_link }}'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Webhook
          name: agent-vault-invite-owner
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Webhook
metadata:
  name: agent-vault-create-isacmes
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  method: POST
  url: http://agent-vault.agent-vault.svc.cluster.local:14321/v1/agents
  timeout: 10s
  headers:
    Content-Type: application/json
    Authorization: Bearer {{ .auth.token }}
  body: |
    {
      "name": "hermes-isacmes",
      "role": "no-access",
      "vaults": [
        {
          "vault_name": "default",
          "vault_role": "proxy"
        }
      ]
    }
  secrets:
    - name: auth
      secretRef:
        name: agent-vault-owner-session
  result:
    jsonPath: "$"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent-vault-isacmes-token
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: Prune=false
spec:
  refreshPolicy: CreatedOnce
  target:
    name: agent-vault-isacmes-token
    creationPolicy: Orphan
    deletionPolicy: Retain
    immutable: true
    template:
      engineVersion: v2
      data:
        token: '{{ .av_agent_token }}'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Webhook
          name: agent-vault-create-isacmes
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Webhook
metadata:
  name: agent-vault-notify-owner-invite
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  method: POST
  url: https://api.telegram.org/bot{{ .telegram.token }}/sendMessage
  timeout: 10s
  headers:
    Content-Type: application/json
  body: |
    {
      "chat_id": "5286349319",
      "text": "Agent Vault owner setup\n\nOpen this link within 48 hours and set your password:\n{{ .invite.inviteLink }}\n\nLogin email: {{ .invite.email }}",
      "disable_web_page_preview": true
    }
  secrets:
    - name: telegram
      secretRef:
        name: isacmes-credentials
    - name: invite
      secretRef:
        name: agent-vault-owner-invite
  result:
    jsonPath: "$"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent-vault-owner-invite-notification
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/sync-options: Prune=false
spec:
  refreshPolicy: CreatedOnce
  target:
    name: agent-vault-owner-invite-notification
    creationPolicy: Orphan
    deletionPolicy: Retain
    immutable: true
    template:
      engineVersion: v2
      data:
        status: sent
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Webhook
          name: agent-vault-notify-owner-invite
