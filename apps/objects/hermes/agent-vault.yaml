apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-vault-skill
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  .curlrc: |
    proxy-cacert = "/etc/agent-vault/ca.pem"
  .gitconfig: |
    [http]
      proxySSLCAInfo = /etc/agent-vault/ca.pem
      sslCAInfo = /etc/agent-vault/ca.pem
  SKILL.md: |
    ---
    name: agent-vault
    description: Use Agent Vault for authenticated third-party API and CLI requests without exposing credentials.
    ---

    # Agent Vault

    Before reporting that credentials are unavailable, call the Agent Vault
    discovery endpoint using `AGENT_VAULT_ADDR`, `AGENT_VAULT_TOKEN`, and
    `AGENT_VAULT_VAULT`.

    ```bash
    curl -fsS "$AGENT_VAULT_ADDR/discover" \
      -H "Authorization: Bearer $AGENT_VAULT_TOKEN" \
      -H "X-Vault: $AGENT_VAULT_VAULT"
    ```

    Calls to configured upstream hosts are already routed through the Agent
    Vault proxy. Call the real upstream API without reading or printing its
    credential. If access is missing, create a proposal through
    `POST $AGENT_VAULT_ADDR/v1/proposals`, send the returned `approval_url` to
    the user in Telegram, and wait for approval before retrying.

    Never print, log, decode, or transmit `AGENT_VAULT_TOKEN`.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-vault-camofox
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  camofox.config.json: |
    {
      "id": "camofox-browser",
      "name": "Camofox Browser",
      "version": "1.6.0",
      "newPageTimeoutMs": 10000,
      "plugins": {
        "youtube": { "enabled": true },
        "persistence": { "enabled": true },
        "vnc": { "enabled": false, "resolution": "1920x1080" },
        "interactive": { "enabled": true },
        "agent-vault": { "enabled": true }
      }
    }
  interactive.js: |
    export default async function register(_app, ctx) {
      const userId = process.env.CAMOFOX_INTERACTIVE_USER_ID;
      const accessKey = process.env.CAMOFOX_ACCESS_KEY || process.env.CAMOFOX_API_KEY;
      if (!userId || !accessKey) {
        ctx.log('warn', 'interactive browser disabled: identity or access key is not configured');
        return;
      }

      ctx.events.on('server:started', () => {
        void (async () => {
          try {
            const response = await fetch(`http://127.0.0.1:${ctx.config.port}/tabs`, {
              method: 'POST',
              headers: {
                Authorization: `Bearer ${accessKey}`,
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({
                userId,
                sessionKey: 'interactive',
                url: 'about:blank',
              }),
            });
            if (!response.ok) {
              throw new Error(`Camofox returned HTTP ${response.status}`);
            }
            const tab = await response.json();
            ctx.log('info', 'interactive browser window ready', {
              userId,
              tabId: tab.tabId,
            });
          } catch (error) {
            ctx.log('error', 'interactive browser window failed', {
              error: error.message,
            });
          }
        })();
      });
    }
  index.js: |
    import fs from 'fs';
    import net from 'net';
    import tls from 'tls';

    const LISTEN_HOST = '127.0.0.1';
    const LISTEN_PORT = 14323;
    const UPSTREAM_HOST = 'agent-vault.agent-vault.svc.cluster.local';
    const UPSTREAM_PORT = 14322;
    const CA_PATH = '/etc/agent-vault/ca.pem';

    function proxyOptions() {
      const username = process.env.PROXY_USERNAME;
      const password = process.env.PROXY_PASSWORD;
      if (!username || !password) {
        throw new Error('Agent Vault proxy credentials are not configured');
      }
      return {
        server: `http://${LISTEN_HOST}:${LISTEN_PORT}`,
        username,
        password,
      };
    }

    export default async function register(_app, ctx) {
      const ca = fs.readFileSync(CA_PATH);
      const bridge = net.createServer((client) => {
        const upstream = tls.connect({
          host: UPSTREAM_HOST,
          port: UPSTREAM_PORT,
          servername: UPSTREAM_HOST,
          ca,
          minVersion: 'TLSv1.2',
          rejectUnauthorized: true,
        });

        client.on('error', () => upstream.destroy());
        upstream.on('error', (error) => {
          ctx.log('error', 'Agent Vault TLS bridge connection failed', {
            error: error.message,
          });
          client.destroy();
        });
        client.pipe(upstream);
        upstream.pipe(client);
      });

      await new Promise((resolve, reject) => {
        bridge.once('error', reject);
        bridge.listen(LISTEN_PORT, LISTEN_HOST, () => {
          bridge.off('error', reject);
          resolve();
        });
      });

      // Injecting the proxy here avoids Camofox's public-proxy GeoIP lookup,
      // which is not applicable to the cluster-local Agent Vault proxy.
      ctx.events.on('browser:launching', ({ options }) => {
        options.proxy = proxyOptions();
      });

      // Agent Vault validates the real upstream certificate. The browser-facing
      // certificate is minted by Agent Vault's private CA for TLS inspection.
      ctx.events.on('session:creating', ({ contextOptions }) => {
        contextOptions.proxy = proxyOptions();
        contextOptions.ignoreHTTPSErrors = true;
      });
      ctx.events.on('server:shutdown', () => bridge.close());
      ctx.log('info', 'Agent Vault TLS bridge listening', {
        host: LISTEN_HOST,
        port: LISTEN_PORT,
      });
    }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-vault-egress
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: isacmes
      app.kubernetes.io/name: hermes-agent
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agent-vault
          podSelector:
            matchLabels:
              app.kubernetes.io/name: agent-vault
      ports:
        - protocol: TCP
          port: 14321
        - protocol: TCP
          port: 14322
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: agent-vault-owner-password
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  length: 64
  digits: 16
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent-vault-owner-credentials
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: Prune=false
spec:
  refreshPolicy: CreatedOnce
  target:
    name: agent-vault-owner-credentials
    creationPolicy: Orphan
    deletionPolicy: Retain
    immutable: true
    template:
      engineVersion: v2
      metadata:
        labels:
          external-secrets.io/type: webhook
      data:
        email: owner@agent-vault.local
        password: '{{ .password }}'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: agent-vault-owner-password
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Webhook
metadata:
  name: agent-vault-register-owner
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  method: POST
  url: http://agent-vault.agent-vault.svc.cluster.local:14321/v1/auth/register
  timeout: 10s
  headers:
    Content-Type: application/json
  body: |
    {
      "email": "{{ .owner.email }}",
      "password": "{{ .owner.password }}",
      "device_label": "external-secrets-operator"
    }
  secrets:
    - name: owner
      secretRef:
        name: agent-vault-owner-credentials
  result:
    jsonPath: "$"
---
