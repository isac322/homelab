apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hermes-hindsight-egress
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/instance
        operator: In
        values:
          - isacmes
          - isacmes-jay
      - key: app.kubernetes.io/name
        operator: In
        values:
          - hermes-agent
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: hindsight
          podSelector:
            matchLabels:
              app.kubernetes.io/component: api
      ports:
        - protocol: TCP
          port: 8888
