apiVersion: hermes.agent/v1
kind: HermesInstance
metadata:
  name: isacmes-jay
spec:
  image:
    repository: nousresearch/hermes-agent
    tag: v2026.8.3
  config:
    raw:
      _config_version: 33
      model:
        default: gpt-5.6-terra
        provider: openai-api
      auxiliary:
        vision:
          provider: main
          model: gpt-5.4-mini
        web_extract:
          provider: main
          model: gpt-5.4-mini
        title_generation:
          provider: main
          model: gpt-5.4-mini
        session_search:
          provider: main
          model: gpt-5.4-mini
        compression:
          provider: main
          model: gpt-5.4-mini
  env:
    - name: TELEGRAM_ALLOWED_USERS
      value: "5286349319"
    - name: OPENAI_API_KEY
      valueFrom:
        secretKeyRef:
          name: isacmes-jay-credentials
          key: apiKey
    - name: OPENAI_BASE_URL
      valueFrom:
        secretKeyRef:
          name: isacmes-jay-credentials
          key: baseUrl
  storage:
    persistence:
      enabled: true
      size: 10Gi
      storageClassName: ssd-ha-xfs
  gateways:
    telegram:
      enabled: true
      allowedUserIDs:
        - 5286349319
      botTokenSecretRef:
        name: isacmes-jay-credentials
        key: token
