apiVersion: hermes.agent/v1
kind: HermesInstance
metadata:
  name: isacmes-jay
spec:
  image:
    repository: nousresearch/hermes-agent
    tag: v2026.8.3
  initContainers:
    - name: install-hermes-lcm
      image: nousresearch/hermes-agent:v2026.8.3
      command:
        - /bin/sh
        - -ec
      args:
        - |
          git clone --depth 1 --branch v0.21.0-rc2 \
            https://github.com/stephenschoettler/hermes-lcm.git /lcm/plugin
          test "$(git -C /lcm/plugin rev-parse HEAD)" = \
            "10cbb78347ec86f3004153b24767324ded9e37b4"
          rm -rf /lcm/plugin/.git
      volumeMounts:
        - name: hermes-lcm
          mountPath: /lcm
    - name: prepare-camofox-home
      image: ghcr.io/isac322/camofox-browser@sha256:74a240dbbe404c6ae23cb5e3deb3d7236596491738a3985602ac18ebed4bd834
      command:
        - /bin/sh
        - -ec
      args:
        - |
          mkdir -p /home/node/.cache
          cp -a /root/.cache/camoufox /home/node/.cache/
          chown -R 1000:1000 /home/node
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
          add:
            - CHOWN
        readOnlyRootFilesystem: true
        runAsUser: 0
      volumeMounts:
        - name: camofox-home
          mountPath: /home/node
  extraVolumes:
    - name: hermes-lcm
      emptyDir: {}
    - name: camofox-home
      emptyDir: {}
    - name: camofox-tmp
      emptyDir:
        medium: Memory
        sizeLimit: 512Mi
    - name: camofox-shm
      emptyDir:
        medium: Memory
        sizeLimit: 512Mi
    - name: camofox-data
      persistentVolumeClaim:
        claimName: isacmes-jay-camofox-data
  extraVolumeMounts:
    - name: hermes-lcm
      mountPath: /opt/data/plugins/hermes-lcm
      subPath: plugin
      readOnly: true
  sidecars:
    - name: camofox
      image: ghcr.io/isac322/camofox-browser@sha256:74a240dbbe404c6ae23cb5e3deb3d7236596491738a3985602ac18ebed4bd834
      imagePullPolicy: IfNotPresent
      env:
        - name: HOME
          value: /home/node
        - name: CAMOFOX_BIND_HOST
          value: 127.0.0.1
        - name: CAMOFOX_API_KEY
          valueFrom:
            secretKeyRef:
              name: isacmes-jay-camofox-credentials
              key: camofoxApiKey
        - name: CAMOFOX_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: isacmes-jay-camofox-credentials
              key: camofoxApiKey
        - name: CAMOFOX_CRASH_REPORT_ENABLED
          value: "false"
        - name: CAMOFOX_DISABLE_DEFAULT_ADDONS
          value: "true"
        - name: CAMOFOX_PROFILE_DIR
          value: /data/profiles
        - name: CAMOFOX_COOKIES_DIR
          value: /data/cookies
        - name: CAMOFOX_TRACES_DIR
          value: /data/traces
        - name: ENABLE_VNC
          value: "1"
        - name: VNC_BIND
          value: 0.0.0.0
        - name: VNC_PASSWORD
          valueFrom:
            secretKeyRef:
              name: isacmes-jay-camofox-credentials
              key: vncPassword
        - name: VNC_RESOLUTION
          value: 1920x1080
        - name: VNC_PORT
          value: "5900"
        - name: NOVNC_PORT
          value: "6080"
      ports:
        - name: browser-api
          containerPort: 9377
        - name: novnc
          containerPort: 6080
      startupProbe:
        exec:
          command:
            - node
            - -e
            - fetch('http://127.0.0.1:9377/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
        failureThreshold: 60
        periodSeconds: 2
      readinessProbe:
        exec:
          command:
            - node
            - -e
            - fetch('http://127.0.0.1:9377/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
        periodSeconds: 10
      livenessProbe:
        exec:
          command:
            - node
            - -e
            - fetch('http://127.0.0.1:9377/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
        periodSeconds: 30
      resources:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          cpu: "2"
          memory: 2Gi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      volumeMounts:
        - name: camofox-home
          mountPath: /home/node
        - name: camofox-tmp
          mountPath: /tmp
        - name: camofox-shm
          mountPath: /dev/shm
        - name: camofox-data
          mountPath: /data
  config:
    raw:
      _config_version: 33
      approvals:
        mode: "off"
      model:
        default: gpt-5.6-terra
        provider: openai-api
      plugins:
        enabled:
          - hermes-lcm
          - security-guidance
          - disk-cleanup
      context:
        engine: lcm
      memory:
        provider: hindsight
      auxiliary:
        vision:
          provider: main
          model: gpt-5.4-mini
        web_extract:
          provider: main
          model: gpt-5.4-mini
        title_generation:
          provider: main
          model: gpt-5.4-mini
        session_search:
          provider: main
          model: gpt-5.4-mini
        compression:
          provider: main
          model: gpt-5.4-mini
  env:
    - name: TELEGRAM_ALLOWED_USERS
      value: "8501631874"
    - name: OPENAI_API_KEY
      valueFrom:
        secretKeyRef:
          name: isacmes-jay-credentials
          key: apiKey
    - name: OPENAI_BASE_URL
      valueFrom:
        secretKeyRef:
          name: isacmes-jay-credentials
          key: baseUrl
    - name: CAMOFOX_URL
      value: http://127.0.0.1:9377
    - name: CAMOFOX_API_KEY
      valueFrom:
        secretKeyRef:
          name: isacmes-jay-camofox-credentials
          key: camofoxApiKey
    - name: HINDSIGHT_MODE
      value: local_external
    - name: HINDSIGHT_API_URL
      value: http://hindsight-api.hindsight.svc:8888
    - name: HINDSIGHT_BANK_ID
      value: isacmes-jay
  storage:
    persistence:
      enabled: true
      size: 10Gi
      storageClassName: ssd-ha-xfs
  gateways:
    telegram:
      enabled: true
      allowedUserIDs:
        - 8501631874
      botTokenSecretRef:
        name: isacmes-jay-credentials
        key: token
