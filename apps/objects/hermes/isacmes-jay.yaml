apiVersion: hermes.agent/v1
kind: HermesInstance
metadata:
  name: isacmes-jay
spec:
  image:
    repository: nousresearch/hermes-agent
    tag: v2026.8.3
  initContainers:
    - name: install-hermes-lcm
      image: nousresearch/hermes-agent:v2026.8.3
      command:
        - /bin/sh
        - -ec
      args:
        - |
          git clone --depth 1 --branch v0.21.0-rc2 \
            https://github.com/stephenschoettler/hermes-lcm.git /lcm/plugin
          test "$(git -C /lcm/plugin rev-parse HEAD)" = \
            "10cbb78347ec86f3004153b24767324ded9e37b4"
          rm -rf /lcm/plugin/.git
      volumeMounts:
        - name: hermes-lcm
          mountPath: /lcm
  extraVolumes:
    - name: hermes-lcm
      emptyDir: {}
  extraVolumeMounts:
    - name: hermes-lcm
      mountPath: /opt/data/plugins/hermes-lcm
      subPath: plugin
      readOnly: true
  config:
    raw:
      _config_version: 33
      model:
        default: gpt-5.6-terra
        provider: openai-api
      plugins:
        enabled:
          - hermes-lcm
          - security-guidance
          - disk-cleanup
      context:
        engine: lcm
      memory:
        provider: hindsight
      auxiliary:
        vision:
          provider: main
          model: gpt-5.4-mini
        web_extract:
          provider: main
          model: gpt-5.4-mini
        title_generation:
          provider: main
          model: gpt-5.4-mini
        session_search:
          provider: main
          model: gpt-5.4-mini
        compression:
          provider: main
          model: gpt-5.4-mini
  env:
    - name: TELEGRAM_ALLOWED_USERS
      value: "8501631874"
    - name: OPENAI_API_KEY
      valueFrom:
        secretKeyRef:
          name: isacmes-jay-credentials
          key: apiKey
    - name: OPENAI_BASE_URL
      valueFrom:
        secretKeyRef:
          name: isacmes-jay-credentials
          key: baseUrl
    - name: HINDSIGHT_MODE
      value: local_external
    - name: HINDSIGHT_API_URL
      value: http://hindsight-api.hindsight.svc:8888
    - name: HINDSIGHT_BANK_ID
      value: isacmes-jay
  storage:
    persistence:
      enabled: true
      size: 10Gi
      storageClassName: ssd-ha-xfs
  gateways:
    telegram:
      enabled: true
      allowedUserIDs:
        - 8501631874
      botTokenSecretRef:
        name: isacmes-jay-credentials
        key: token
