apiVersion: hermes.agent/v1
kind: HermesInstance
metadata:
  name: isacmes
spec:
  image:
    repository: ghcr.io/paperclipinc/hermes-agent
    tag: v0.16.0
  config:
    raw:
      model:
        default: gpt-5.6-terra
        provider: openai-api
      model_aliases:
        gemini:
          model: gemini-3.6-flash
          provider: gemini
      auxiliary:
        vision:
          provider: gemini
          model: gemini-3.6-flash
        web_extract:
          provider: gemini
          model: gemini-3.6-flash
        title_generation:
          provider: gemini
          model: gemini-3.6-flash
        session_search:
          provider: gemini
          model: gemini-3.6-flash
        compression:
          provider: gemini
          model: gemini-3.6-flash
  env:
    - name: OPENAI_API_KEY
      valueFrom:
        secretKeyRef:
          name: isacmes-credentials
          key: apiKey
    - name: OPENAI_BASE_URL
      valueFrom:
        secretKeyRef:
          name: isacmes-credentials
          key: baseUrl
    - name: GEMINI_API_KEY
      valueFrom:
        secretKeyRef:
          name: isacmes-credentials
          key: apiKey
    - name: GEMINI_BASE_URL
      valueFrom:
        secretKeyRef:
          name: isacmes-credentials
          key: geminiBaseUrl
  storage:
    persistence:
      enabled: true
      size: 10Gi
      storageClassName: ssd-ha-xfs
  gateways:
    telegram:
      enabled: true
      botTokenSecretRef:
        name: isacmes-credentials
        key: token
