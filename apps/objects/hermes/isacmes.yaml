apiVersion: hermes.agent/v1
kind: HermesInstance
metadata:
  name: isacmes
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  image:
    repository: nousresearch/hermes-agent
    tag: v2026.8.13
  initContainers:
    - name: install-hermes-lcm
      image: nousresearch/hermes-agent:v2026.8.13
      command:
        - /bin/sh
        - -ec
      args:
        - |
          git clone --depth 1 --branch v0.21.0-rc2 \
            https://github.com/stephenschoettler/hermes-lcm.git /lcm/plugin
          test "$(git -C /lcm/plugin rev-parse HEAD)" = \
            "10cbb78347ec86f3004153b24767324ded9e37b4"
          rm -rf /lcm/plugin/.git
      volumeMounts:
        - name: hermes-lcm
          mountPath: /lcm
    - name: patch-openai-native-web-search
      image: nousresearch/hermes-agent:v2026.8.13
      command:
        - /opt/hermes/.venv/bin/python
        - /patch/patch.py
        - /opt/hermes/agent/transports/codex.py
        - /patched/codex.py
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      volumeMounts:
        - name: hermes-native-web-search-patch
          mountPath: /patch
          readOnly: true
        - name: hermes-patched-files
          mountPath: /patched
    - name: fetch-agent-vault-ca
      image: infisical/agent-vault:0.22.0
      command:
        - /bin/sh
        - -ec
      args:
        - |
          until wget -q -O /ca/agent-vault-ca.pem \
            http://agent-vault.agent-vault.svc.cluster.local:14321/v1/mitm/ca.pem; do
            sleep 2
          done
          test -s /ca/agent-vault-ca.pem
          test -s /etc/ssl/certs/ca-certificates.crt
          cat /etc/ssl/certs/ca-certificates.crt /ca/agent-vault-ca.pem \
            > /ca/ca.pem
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
      volumeMounts:
        - name: agent-vault-ca
          mountPath: /ca
    - name: prepare-camofox-home
      image: ghcr.io/jo-inc/camofox-browser:1.13.0
      command:
        - /bin/sh
        - -ec
      args:
        - |
          mkdir -p /home/node/.cache
          cp -a /root/.cache/camoufox /home/node/.cache/
          chown -R 1000:1000 /home/node
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
          add:
            - CHOWN
        readOnlyRootFilesystem: true
        runAsUser: 0
      volumeMounts:
        - name: camofox-home
          mountPath: /home/node
  extraVolumes:
    - name: hermes-lcm
      emptyDir: {}
    - name: hermes-patched-files
      emptyDir: {}
    - name: hermes-native-web-search-patch
      configMap:
        name: hermes-native-web-search-patch
    - name: agent-vault-ca
      emptyDir: {}
    - name: agent-vault-skill
      configMap:
        name: agent-vault-skill
    - name: camofox-runtime
      configMap:
        name: camofox-runtime
    - name: camofox-home
      emptyDir: {}
    - name: camofox-tmp
      emptyDir:
        medium: Memory
        sizeLimit: 512Mi
    - name: camofox-shm
      emptyDir:
        medium: Memory
        sizeLimit: 512Mi
    - name: camofox-data
      persistentVolumeClaim:
        claimName: isacmes-camofox-data
  extraVolumeMounts:
    - name: hermes-lcm
      mountPath: /opt/data/plugins/hermes-lcm
      subPath: plugin
      readOnly: true
    - name: hermes-patched-files
      mountPath: /opt/hermes/agent/transports/codex.py
      subPath: codex.py
      readOnly: true
    - name: agent-vault-ca
      mountPath: /etc/agent-vault
      readOnly: true
    - name: agent-vault-skill
      mountPath: /opt/data/skills/agent-vault
      readOnly: true
    - name: agent-vault-skill
      mountPath: /etc/agent-vault-client
      readOnly: true
  sidecars:
    - name: camofox
      image: ghcr.io/jo-inc/camofox-browser:1.13.0
      imagePullPolicy: IfNotPresent
      env:
        - name: HOME
          value: /home/node
        - name: CAMOFOX_BIND_HOST
          value: 127.0.0.1
        - name: BROWSER_IDLE_TIMEOUT_MS
          value: "2147483647"
        - name: CAMOFOX_API_KEY
          valueFrom:
            secretKeyRef:
              name: isacmes-camofox-credentials
              key: camofoxApiKey
        - name: CAMOFOX_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: isacmes-camofox-credentials
              key: camofoxApiKey
        - name: CAMOFOX_CRASH_REPORT_ENABLED
          value: "false"
        - name: CAMOFOX_DISABLE_DEFAULT_ADDONS
          value: "true"
        - name: CAMOFOX_PROFILE_DIR
          value: /data/profiles
        - name: CAMOFOX_COOKIES_DIR
          value: /data/cookies
        - name: CAMOFOX_TRACES_DIR
          value: /data/traces
        - name: CAMOFOX_INTERACTIVE_USER_ID
          value: interactive
        - name: ENABLE_VNC
          value: "1"
        - name: VNC_BIND
          value: 0.0.0.0
        - name: VNC_PASSWORD
          valueFrom:
            secretKeyRef:
              name: isacmes-camofox-credentials
              key: vncPassword
        - name: VNC_RESOLUTION
          value: 1920x1080
        - name: VNC_PORT
          value: "5900"
        - name: NOVNC_PORT
          value: "6080"
      ports:
        - name: browser-api
          containerPort: 9377
        - name: novnc
          containerPort: 6080
      startupProbe:
        exec:
          command:
            - node
            - -e
            - fetch('http://127.0.0.1:9377/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
        failureThreshold: 60
        periodSeconds: 2
      readinessProbe:
        exec:
          command:
            - node
            - -e
            - fetch('http://127.0.0.1:9377/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
        periodSeconds: 10
      livenessProbe:
        exec:
          command:
            - node
            - -e
            - fetch('http://127.0.0.1:9377/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
        periodSeconds: 30
      resources:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          cpu: "2"
          memory: 2Gi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      volumeMounts:
        - name: camofox-home
          mountPath: /home/node
        - name: camofox-tmp
          mountPath: /tmp
        - name: camofox-shm
          mountPath: /dev/shm
        - name: camofox-data
          mountPath: /data
        - name: camofox-runtime
          mountPath: /app/camofox.config.json
          subPath: camofox.config.json
          readOnly: true
        - name: camofox-runtime
          mountPath: /app/plugins/interactive/index.js
          subPath: interactive.js
          readOnly: true
  config:
    raw:
      _config_version: 34
      approvals:
        mode: "off"
      agent:
        disabled_toolsets:
          - computer_use
      model:
        default: gpt-5.6-terra
        provider: openai-api
      plugins:
        enabled:
          - hermes-lcm
          - security-guidance
          - disk-cleanup
      context:
        engine: lcm
      browser:
        camofox:
          managed_persistence: true
          adopt_existing_tab: true
          user_id: interactive
      platforms:
        telegram:
          enabled: true
          home_channel:
            platform: telegram
            chat_id: "5286349319"
            name: bhyoo
            user_id: "5286349319"
      platform_hints:
        telegram:
          append: |
            Never ask for or accept credential values in Telegram chat. Direct
            the user to the Agent Vault approval page returned by a proposal;
            the value must be submitted there without passing through Hermes.
            If a credential is pasted into chat, do not repeat or use it and
            advise the user to rotate it. Browser API authentication is
            brokered transparently; do not retrieve or type credential values.
            Interactive website logins reuse the persistent Camofox profile.
            Do not change whether or when a VNC URL is presented. If a Camofox
            VNC URL would otherwise be included in a response, replace only its
            origin with https://isacmes-vnc.bhyoo.com while preserving its path,
            query, and fragment; never expose the internal VNC origin. Install
            user-requested CLI tools and libraries only in the persistent
            user/XDG locations, never in system prefixes.
      terminal:
        env_passthrough:
          - AGENT_VAULT_ADDR
          - AGENT_VAULT_TOKEN
          - AGENT_VAULT_VAULT
          - HTTPS_PROXY
          - HTTP_PROXY
          - NO_PROXY
          - NODE_USE_ENV_PROXY
          - SSL_CERT_FILE
          - NODE_EXTRA_CA_CERTS
          - REQUESTS_CA_BUNDLE
          - CURL_CA_BUNDLE
          - CURL_HOME
          - GIT_SSL_CAINFO
          - GIT_CONFIG_GLOBAL
          - DENO_CERT
      memory:
        provider: hindsight
      auxiliary:
        vision:
          provider: main
          model: gpt-5.4-mini
        web_extract:
          provider: main
          model: gpt-5.4-mini
        title_generation:
          provider: main
          model: gpt-5.4-mini
        session_search:
          provider: main
          model: gpt-5.4-mini
        compression:
          provider: main
          model: gpt-5.4-mini
  env:
    - name: HOME
      value: /opt/data
    - name: XDG_CONFIG_HOME
      value: /opt/data/.config
    - name: XDG_CACHE_HOME
      value: /opt/data/.cache
    - name: XDG_DATA_HOME
      value: /opt/data/.local/share
    - name: XDG_STATE_HOME
      value: /opt/data/.local/state
    - name: PATH
      value: /command:/opt/hermes/bin:/opt/hermes/.venv/bin:/opt/data/.local/bin:/opt/data/.local/share/pnpm:/opt/data/.local/share/bun/bin:/opt/data/.local/share/cargo/bin:/opt/data/.local/share/gem/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    - name: NPM_CONFIG_PREFIX
      value: /opt/data/.local
    - name: NPM_CONFIG_CACHE
      value: /opt/data/.cache/npm
    - name: NPM_CONFIG_USERCONFIG
      value: /opt/data/.config/npm/npmrc
    - name: PNPM_HOME
      value: /opt/data/.local/share/pnpm
    - name: BUN_INSTALL
      value: /opt/data/.local/share/bun
    - name: BUN_INSTALL_CACHE_DIR
      value: /opt/data/.cache/bun
    - name: UV_TOOL_BIN_DIR
      value: /opt/data/.local/bin
    - name: UV_TOOL_DIR
      value: /opt/data/.local/share/uv/tools
    - name: UV_CACHE_DIR
      value: /opt/data/.cache/uv
    - name: PIPX_HOME
      value: /opt/data/.local/share/pipx
    - name: PIPX_BIN_DIR
      value: /opt/data/.local/bin
    - name: PIP_CACHE_DIR
      value: /opt/data/.cache/pip
    - name: PYTHONUSERBASE
      value: /opt/data/.local
    - name: CARGO_HOME
      value: /opt/data/.local/share/cargo
    - name: RUSTUP_HOME
      value: /opt/data/.local/share/rustup
    - name: GOPATH
      value: /opt/data/.local/share/go
    - name: GOBIN
      value: /opt/data/.local/bin
    - name: GOCACHE
      value: /opt/data/.cache/go-build
    - name: GEM_HOME
      value: /opt/data/.local/share/gem
    - name: GEM_SPEC_CACHE
      value: /opt/data/.cache/gem
    - name: DENO_DIR
      value: /opt/data/.cache/deno
    - name: DENO_INSTALL
      value: /opt/data/.local
    - name: TELEGRAM_ALLOWED_USERS
      value: "5286349319"
    - name: OPENAI_API_KEY
      valueFrom:
        secretKeyRef:
          name: isacmes-credentials
          key: apiKey
    - name: OPENAI_BASE_URL
      valueFrom:
        secretKeyRef:
          name: isacmes-credentials
          key: baseUrl
    - name: HERMES_OPENAI_NATIVE_WEB_SEARCH
      value: "true"
    - name: CAMOFOX_URL
      value: http://127.0.0.1:9377
    - name: CAMOFOX_API_KEY
      valueFrom:
        secretKeyRef:
          name: isacmes-camofox-credentials
          key: camofoxApiKey
    - name: AGENT_VAULT_ADDR
      value: http://agent-vault.agent-vault.svc.cluster.local:14321
    - name: AGENT_VAULT_TOKEN
      valueFrom:
        secretKeyRef:
          name: agent-vault-isacmes-bhyoo-token
          key: token
    - name: AGENT_VAULT_VAULT
      value: bhyoo
    - name: HTTPS_PROXY
      value: https://$(AGENT_VAULT_TOKEN):bhyoo@agent-vault.agent-vault.svc.cluster.local:14322
    - name: HTTP_PROXY
      value: https://$(AGENT_VAULT_TOKEN):bhyoo@agent-vault.agent-vault.svc.cluster.local:14322
    - name: NO_PROXY
      value: localhost,127.0.0.1,::1,.svc,.svc.cluster.local,api.telegram.org,cliproxyapi.runbear.io
    - name: NODE_USE_ENV_PROXY
      value: "1"
    - name: SSL_CERT_FILE
      value: /etc/agent-vault/ca.pem
    - name: NODE_EXTRA_CA_CERTS
      value: /etc/agent-vault/ca.pem
    - name: REQUESTS_CA_BUNDLE
      value: /etc/agent-vault/ca.pem
    - name: CURL_CA_BUNDLE
      value: /etc/agent-vault/ca.pem
    - name: CURL_HOME
      value: /etc/agent-vault-client
    - name: GIT_SSL_CAINFO
      value: /etc/agent-vault/ca.pem
    - name: GIT_CONFIG_GLOBAL
      value: /etc/agent-vault-client/.gitconfig
    - name: DENO_CERT
      value: /etc/agent-vault/ca.pem
    - name: HINDSIGHT_MODE
      value: local_external
    - name: HINDSIGHT_API_URL
      value: http://hindsight-api.hindsight.svc:8888
    - name: HINDSIGHT_BANK_ID
      value: isacmes
  storage:
    persistence:
      enabled: true
      size: 10Gi
      storageClassName: ssd-ha-xfs
  gateways:
    telegram:
      enabled: true
      allowedUserIDs:
        - 5286349319
      botTokenSecretRef:
        name: isacmes-credentials
        key: token
