apiVersion: v1
kind: ConfigMap
metadata:
  name: camofox-hermes-session-scope
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  patch.py: |
    from __future__ import annotations

    import shutil
    import sys
    from pathlib import Path


    def replace_once(source: str, old: str, new: str, label: str) -> str:
        count = source.count(old)
        if count != 1:
            raise RuntimeError(f"expected one {label} block, found {count}")
        return source.replace(old, new, 1)


    source_tools = Path(sys.argv[1])
    target_tools = Path(sys.argv[2])
    source_gateway = Path(sys.argv[3])
    target_gateway = Path(sys.argv[4])
    replacement_state = Path("/patch/browser_camofox_state.py")

    for source_dir, target_dir in (
        (source_tools, target_tools),
        (source_gateway, target_gateway),
    ):
        if target_dir.exists():
            shutil.rmtree(target_dir)
        shutil.copytree(source_dir, target_dir)

    shutil.copyfile(replacement_state, target_tools / "browser_camofox_state.py")

    browser_path = target_tools / "browser_camofox.py"
    browser = browser_path.read_text()
    browser = replace_once(
        browser,
        "from tools.browser_camofox_state import get_camofox_identity",
        "from tools.browser_camofox_state import get_camofox_cache_key, get_camofox_identity",
        "identity import",
    )
    browser = replace_once(
        browser,
        '''    task_id = task_id or "default"
        with _sessions_lock:
            if task_id in _sessions:
                return _adopt_existing_tab(_sessions[task_id])''',
        '''    task_id = task_id or "default"
        cache_key = get_camofox_cache_key(task_id)
        with _sessions_lock:
            if cache_key in _sessions:
                return _adopt_existing_tab(_sessions[cache_key])''',
        "session lookup",
    )
    browser = replace_once(
        browser,
        "        _sessions[task_id] = session",
        "        _sessions[cache_key] = session",
        "session store",
    )
    browser = replace_once(
        browser,
        '''    task_id = task_id or "default"
        with _sessions_lock:
            return _sessions.pop(task_id, None)''',
        '''    task_id = task_id or "default"
        cache_key = get_camofox_cache_key(task_id)
        with _sessions_lock:
            return _sessions.pop(cache_key, None)''',
        "session removal",
    )
    old_vnc_probe = "\n".join(
        (
            "def check_camofox_available() -> bool:",
            '    """Verify the Camofox server is reachable."""',
            "    global _vnc_url, _vnc_url_checked",
            "    url = get_camofox_url()",
            "    if not url:",
            "        return False",
            "    try:",
            '        resp = requests.get(f"{url}/health", timeout=5)',
            "        if resp.status_code == 200 and not _vnc_url_checked:",
            "            try:",
            "                data = resp.json()",
            '                vnc_port = data.get("vncPort")',
            "                if isinstance(vnc_port, int) and 1 <= vnc_port <= 65535:",
            "                    from urllib.parse import urlparse",
            "                    parsed = urlparse(url)",
            '                    host = parsed.hostname or "localhost"',
            '                    _vnc_url = f"http://{host}:{vnc_port}"',
            "            except (ValueError, KeyError):",
            "                pass",
            "            _vnc_url_checked = True",
            "        return resp.status_code == 200",
            "    except Exception:",
            "        return False",
        )
    )
    new_vnc_probe = "\n".join(
        (
            "def check_camofox_available() -> bool:",
            '    """Verify the Camofox server is reachable."""',
            "    global _vnc_url, _vnc_url_checked",
            "    url = get_camofox_url()",
            "    if not url:",
            "        return False",
            "    try:",
            '        resp = requests.get(f"{url}/health", timeout=5)',
            "        if resp.status_code == 200 and not _vnc_url_checked:",
            "            try:",
            "                vnc_resp = requests.get(",
            '                    f"{url}/vnc/status",',
            "                    headers=_auth_headers(),",
            "                    timeout=5,",
            "                )",
            "                if vnc_resp.status_code == 200:",
            "                    data = vnc_resp.json()",
            '                    novnc_port = data.get("novncPort")',
            '                    path = data.get("path") or "/vnc.html"',
            "                    if (",
            "                        isinstance(novnc_port, int)",
            "                        and 1 <= novnc_port <= 65535",
            "                        and isinstance(path, str)",
            '                        and path.startswith("/")',
            "                    ):",
            "                        from urllib.parse import urlparse",
            "                        parsed = urlparse(url)",
            '                        host = parsed.hostname or "localhost"',
            "                        scheme = parsed.scheme or \"http\"",
            '                        _vnc_url = f"{scheme}://{host}:{novnc_port}{path}"',
            "                    _vnc_url_checked = True",
            "            except (ValueError, KeyError, requests.RequestException):",
            "                pass",
            "        return resp.status_code == 200",
            "    except Exception:",
            "        return False",
        )
    )
    browser = replace_once(
        browser,
        old_vnc_probe,
        new_vnc_probe,
        "upstream noVNC status probe",
    )
    browser = replace_once(
        browser,
        '''def get_vnc_url() -> Optional[str]:
        """Return the VNC URL if the Camofox server exposes one, or None."""
        if not _vnc_url_checked:
            check_camofox_available()
        return _vnc_url''',
        '''def _user_facing_vnc_url(internal_url: str) -> str:
        """Replace only the origin of a VNC URL before exposing it to a user."""
        from urllib.parse import urlsplit, urlunsplit

        public_origin = os.getenv("CAMOFOX_PUBLIC_VNC_ORIGIN", "").strip().rstrip("/")
        public = urlsplit(public_origin)
        if not public.scheme or not public.netloc:
            logger.error("CAMOFOX_PUBLIC_VNC_ORIGIN is missing or invalid; refusing to expose an internal VNC URL")
            raise RuntimeError("Public VNC origin is not configured")

        internal = urlsplit(internal_url)
        return urlunsplit(
            (
                public.scheme,
                public.netloc,
                internal.path or "/vnc.html",
                internal.query,
                internal.fragment,
            )
        )


    def get_vnc_url() -> Optional[str]:
        """Return the internal VNC URL for internal Camofox use, or None."""
        if not _vnc_url_checked:
            check_camofox_available()
        return _vnc_url''',
        "public VNC URL helper",
    )
    browser = replace_once(
        browser,
        '            result["vnc_url"] = vnc',
        '            result["vnc_url"] = _user_facing_vnc_url(vnc)',
        "user-facing VNC URL",
    )
    browser_path.write_text(browser)

    gateway_path = target_gateway / "run.py"
    gateway = gateway_path.read_text()
    gateway = replace_once(
        gateway,
        '''            session_key=context.session_key,
                message_id=str(context.source.message_id) if context.source.message_id else "",''',
        '''            session_key=context.session_key,
                session_id=context.session_id,
                message_id=str(context.source.message_id) if context.source.message_id else "",''',
        "gateway session id propagation",
    )
    gateway_path.write_text(gateway)

    for path in (
        target_tools / "browser_camofox_state.py",
        browser_path,
        gateway_path,
    ):
        compile(path.read_text(), str(path), "exec")

    print("patched Camofox conversation identity, gateway session propagation, and public VNC URL")
  browser_camofox_state.py: |
    """Hermes-managed Camofox state helpers.

    Camofox browser contexts are scoped to the active Hermes conversation.
    Tabs within that context remain scoped to the logical browser task.
    """

    from __future__ import annotations

    import logging
    import uuid
    from pathlib import Path
    from typing import Dict, Optional

    from gateway.session_context import get_session_env
    from hermes_constants import get_hermes_home

    logger = logging.getLogger(__name__)

    CAMOFOX_STATE_DIR_NAME = "browser_auth"
    CAMOFOX_STATE_SUBDIR = "camofox"


    def get_camofox_state_dir() -> Path:
        """Return the profile-scoped root directory for Camofox persistence."""
        return get_hermes_home() / CAMOFOX_STATE_DIR_NAME / CAMOFOX_STATE_SUBDIR


    def _conversation_scope() -> str:
        """Return the required task-local Hermes conversation identity."""
        session_id = get_session_env("HERMES_SESSION_ID", "").strip()
        if session_id:
            return f"session:{session_id}"

        platform = get_session_env("HERMES_SESSION_PLATFORM", "").strip()
        session_key = get_session_env("HERMES_SESSION_KEY", "").strip()
        logger.error(
            "Camofox session isolation unavailable: HERMES_SESSION_ID is empty "
            "(platform=%s, session_key_present=%s); refusing shared fallback",
            platform or "unknown",
            bool(session_key),
        )
        raise RuntimeError(
            "Camofox requires a bound Hermes conversation session ID"
        )


    def get_camofox_cache_key(task_id: Optional[str] = None) -> str:
        """Return a process-local cache key isolated by conversation and task."""
        logical_scope = task_id or "default"
        return uuid.uuid5(
            uuid.NAMESPACE_URL,
            f"camofox-cache:{get_camofox_state_dir()}:{_conversation_scope()}:{logical_scope}",
        ).hex


    def get_camofox_identity(task_id: Optional[str] = None) -> Dict[str, str]:
        """Return stable Camofox identities for the current Hermes conversation."""
        scope_root = str(get_camofox_state_dir())
        conversation_scope = _conversation_scope()
        logical_scope = task_id or "default"
        user_digest = uuid.uuid5(
            uuid.NAMESPACE_URL,
            f"camofox-user:{scope_root}:{conversation_scope}",
        ).hex[:16]
        session_digest = uuid.uuid5(
            uuid.NAMESPACE_URL,
            f"camofox-session:{scope_root}:{conversation_scope}:{logical_scope}",
        ).hex[:16]
        return {
            "user_id": f"hermes_{user_digest}",
            "session_key": f"task_{session_digest}",
        }
