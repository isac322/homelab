apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-native-web-search-patch
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  patch.py: |
    from __future__ import annotations

    import shutil
    import sys
    from pathlib import Path


    def replace_once(source: str, old: str, new: str, label: str) -> str:
        count = source.count(old)
        if count != 1:
            raise RuntimeError(f"expected one {label} block, found {count}")
        return source.replace(old, new, 1)


    source_codex = Path(sys.argv[1])
    target_codex = Path(sys.argv[2])
    shutil.copyfile(source_codex, target_codex)
    codex = target_codex.read_text()
    codex = replace_once(
        codex,
        "import json\nimport re",
        "import json\nimport os\nimport re",
        "native web search os import",
    )
    native_web_search = "\n".join(
        (
            "        native_web_search_enabled = (",
            '            os.getenv("HERMES_OPENAI_NATIVE_WEB_SEARCH", "").strip().lower()',
            '            in {"1", "true", "yes", "on"}',
            "        )",
            '        provider_name = str(params.get("provider") or "").strip().lower()',
            '        model_name = str(model or "").rsplit("/", 1)[-1].lower()',
            '        model_match = re.match(r"^gpt-(\\d+)", model_name)',
            "        if (",
            "            native_web_search_enabled",
            '            and provider_name == "openai-api"',
            "            and model_match is not None",
            "            and int(model_match.group(1)) >= 5",
            "        ):",
            "            response_tools = [",
            "                tool",
            "                for tool in list(response_tools or [])",
            "                if not (",
            "                    isinstance(tool, dict)",
            '                    and tool.get("type") == "function"',
            '                    and tool.get("name") == "web_search"',
            "                )",
            "            ]",
            "            if not any(",
            '                isinstance(tool, dict) and tool.get("type") == "web_search"',
            "                for tool in response_tools",
            "            ):",
            '                response_tools.append({"type": "web_search"})',
            "",
            "",
        )
    )
    codex = replace_once(
        codex,
        '''        # ``tools`` MUST be omitted entirely when there are no functions to''',
        native_web_search
        + '''        # ``tools`` MUST be omitted entirely when there are no functions to''',
        "OpenAI native web search injection",
    )
    target_codex.write_text(codex)

    compile(target_codex.read_text(), str(target_codex), "exec")

    print("patched OpenAI native web search")
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: camofox-runtime
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  camofox.config.json: |
    {
      "id": "camofox-browser",
      "name": "Camofox Browser",
      "version": "1.6.0",
      "newPageTimeoutMs": 10000,
      "plugins": {
        "youtube": { "enabled": true },
        "persistence": { "enabled": true },
        "vnc": { "enabled": false, "resolution": "1920x1080" },
        "interactive": { "enabled": true }
      }
    }
  interactive.js: |
    export default async function register(_app, ctx) {
      const userId = process.env.CAMOFOX_INTERACTIVE_USER_ID;
      const accessKey = process.env.CAMOFOX_ACCESS_KEY || process.env.CAMOFOX_API_KEY;
      if (!userId || !accessKey) {
        ctx.log('warn', 'interactive browser disabled: identity or access key is not configured');
        return;
      }

      ctx.events.on('server:started', () => {
        void (async () => {
          try {
            const response = await fetch(`http://127.0.0.1:${ctx.config.port}/tabs`, {
              method: 'POST',
              headers: {
                Authorization: `Bearer ${accessKey}`,
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({
                userId,
                sessionKey: 'interactive',
                url: 'https://example.com/',
              }),
            });
            if (!response.ok) {
              throw new Error(`Camofox returned HTTP ${response.status}`);
            }
            const tab = await response.json();
            ctx.log('info', 'interactive browser window ready', {
              userId,
              tabId: tab.tabId,
            });
          } catch (error) {
            ctx.log('error', 'interactive browser window failed', {
              error: error.message,
            });
          }
        })();
      });
    }
