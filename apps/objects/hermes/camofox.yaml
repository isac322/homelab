---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: hermes-camofox-vnc
spec:
  endpointSelector:
    matchExpressions:
      - key: app.kubernetes.io/instance
        operator: In
        values:
          - isacmes
          - isacmes-jay
          - yjyou
      - key: app.kubernetes.io/name
        operator: In
        values:
          - hermes-agent
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "6080"
              protocol: TCP
