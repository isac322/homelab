---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: isacmes-vnc
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: bhyoo-gateway
      namespace: ingress-ctrl
  hostnames:
    - isacmes-vnc.bhyoo.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: isacmes-vnc
          port: 6080
          weight: 1
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: isacmes-jay-vnc
spec:
