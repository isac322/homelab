apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: isacmes-camofox-data
  annotations:
    # Created by democratic-csi and imported into pillar-csi in place on
    # 2026-10-02, so the browser profile kept its contents.
    pillar-csi.bhyoo.com/import-zvol: hot-data/k8s/pvc-acaac284-bfa8-4e60-807a-0569460693ec
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ssd-ha
  resources:
    requests:
      storage: 5Gi
---
