apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: isacmes-camofox-data
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ssd-ha-xfs
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: isacmes-jay-camofox-data
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ssd-ha-xfs
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: isacmes-vnc
spec:
  selector:
    app.kubernetes.io/instance: isacmes
    app.kubernetes.io/name: hermes-agent
  ports:
    - name: novnc
      port: 6080
      targetPort: novnc
---
apiVersion: v1
kind: Service
metadata:
  name: isacmes-jay-vnc
spec:
  selector:
    app.kubernetes.io/instance: isacmes-jay
    app.kubernetes.io/name: hermes-agent
  ports:
    - name: novnc
      port: 6080
      targetPort: novnc
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: isacmes-vnc
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: bhyoo-gateway
      namespace: ingress-ctrl
  hostnames:
    - isacmes-vnc.bhyoo.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: isacmes-vnc
          port: 6080
          weight: 1
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: isacmes-jay-vnc
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: bhyoo-gateway
      namespace: ingress-ctrl
  hostnames:
    - isacmes-jay-vnc.bhyoo.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: isacmes-jay-vnc
          port: 6080
          weight: 1
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: hermes-camofox-vnc
spec:
  endpointSelector:
    matchExpressions:
      - key: app.kubernetes.io/instance
        operator: In
        values:
          - isacmes
          - isacmes-jay
      - key: app.kubernetes.io/name
        operator: In
        values:
          - hermes-agent
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "6080"
              protocol: TCP
