apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: rknpu-device-plugin-daemonset
  namespace: kube-system
spec:
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      name: rknpu-dp-ds
  template:
    metadata:
      labels:
        name: rknpu-dp-ds
    spec:
      nodeSelector:
        homelab.bhyoo.com/npu: rknn
      priorityClassName: system-node-critical
      tolerations:
        - key: CriticalAddonsOnly
          operator: Exists
      containers:
        - name: rknpu-dp-cntr
          image: ghcr.io/elct9620/rknpu-device-plugin:33f7c5f@sha256:f56fc4e87ec4adffd3d49add0330d6560b7450406a1bb1b0d018845556c0eb74
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 24Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: dp
              mountPath: /var/lib/kubelet/device-plugins
            - name: sys
              mountPath: /sys
            - name: dev
              mountPath: /dev
      volumes:
        - name: dp
          hostPath:
            path: /var/lib/kubelet/device-plugins
        - name: sys
          hostPath:
            path: /sys
        - name: dev
          hostPath:
            path: /dev
