apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hindsight-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: kubernetes
    kind: SecretStore
  target:
    name: hindsight-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        postgres-password: "{{ .pg_password }}"
        HINDSIGHT_API_EMBEDDINGS_OPENAI_API_KEY: "{{ .openai_key }}"
        HINDSIGHT_API_LLM_API_KEY: "{{ .openai_key }}"
        HINDSIGHT_API_TENANT_API_KEY: "{{ .api_token }}"
        HINDSIGHT_CP_ACCESS_KEY: "{{ .api_token }}"
        HINDSIGHT_CP_DATAPLANE_API_KEY: "{{ .api_token }}"
  data:
    # PG password from CNPG-generated superuser secret
    - secretKey: pg_password
      remoteRef:
        key: cnpg-hindsight-app
        property: password
    # OpenAI key from ClusterSecretStore (AWS SSM), shared by the LLM and embeddings
    - secretKey: openai_key
      sourceRef:
        storeRef:
          name: cluster-secrets
          kind: ClusterSecretStore
      remoteRef:
        key: /homelab/cluster/backbone/token/openai/hindsight-embeddings
    # Hindsight API and control-plane access key from Terraform-generated SSM.
    - secretKey: api_token
      sourceRef:
        storeRef:
          name: cluster-secrets
          kind: ClusterSecretStore
      remoteRef:
        key: /homelab/cluster/backbone/token/hindsight/api
