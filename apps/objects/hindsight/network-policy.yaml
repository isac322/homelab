apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: hindsight-api-ingress
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: hindsight
      app.kubernetes.io/component: api
  ingress:
    # Cilium Gateway API upstream traffic carries the reserved ingress identity,
    # not the host-network Envoy pod's namespace identity.
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8888"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: hindsight
            app.kubernetes.io/name: hindsight
            app.kubernetes.io/component: control-plane
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: hermes
            app.kubernetes.io/name: hermes-agent
          matchExpressions:
            - key: app.kubernetes.io/instance
              operator: In
              values: [isacmes, isacmes-jay, yjyou]
      toPorts:
        - ports:
            - port: "8888"
              protocol: TCP
