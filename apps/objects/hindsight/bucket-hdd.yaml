apiVersion: objectstorage.k8s.io/v1alpha1
kind: Bucket
metadata:
  name: cnpg-hindsight-backup-hdd
spec:
  bucketClaim:
    name: cnpg-hindsight-backup-hdd
    namespace: hindsight
  bucketClassName: versitygw-hdd-cosi-driver
  driverName: versitygw-hdd.cosi.dev
  deletionPolicy: Retain
  protocols:
    - S3
