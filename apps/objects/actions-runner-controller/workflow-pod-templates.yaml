# Pod templates for the ARC kubernetes-mode container hook.
# Each runner scale set mounts this ConfigMap and points
# ACTIONS_RUNNER_CONTAINER_HOOK_TEMPLATE at its own key; the hook merges it
# into every `<runner>-workflow` job pod and `-step-*` pod it creates.
# `$<name>` containers are merged into the hook-generated container of the
# same base name (`$job` = job container, `$postgres` = the postgres service);
# non-prefixed containers would be appended as extra containers.
#
# Keep CI compute on macmini or rock5bp: n2p*/rpi* lack the RAM (3.7-8Gi
# allocatable) for these jobs. This list must match each scale set's runner
# affinity because job pods share the runner's ReadWriteOnce work volume.
# cpu limits bound the worst case (2026-10-04 an unbounded cargo clippy pod
# drove rock5bp to load 48). Requests are explicitly zero: the hook pins job
# pods to the runner's node via nodeName, bypassing the scheduler, and the
# runner pod's own requests already reserve the job's budget. Non-zero
# requests were double-counted and made kubelet reject the pod with
# OutOfmemory on a fully reserved node (2026-10-09).
# Add a `$<service>` entry here whenever a cc-lb workflow adds a service.
# The hook never copies the runner container's env into the job container, so
# every `$job` entry must load the same sccache-s3 Secret the runner uses;
# otherwise sccache in `container:` jobs falls back to an empty local cache.
apiVersion: v1
kind: ConfigMap
metadata:
  name: workflow-pod-templates
  namespace: arc-runners
data:
  cc-lb-4.yaml: |
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - macmini
                      - rock5bp
      containers:
        - name: $job
          envFrom:
            - secretRef:
                name: sccache-s3
                optional: true
          resources:
            requests:
              cpu: "0"
              memory: "0"
            limits:
              cpu: "4"
              memory: 6Gi
        - name: $postgres
          resources:
            requests:
              cpu: "0"
              memory: "0"
            limits:
              cpu: "2"
              memory: 2Gi
  cc-lb-2.yaml: |
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - macmini
                      - rock5bp
      containers:
        - name: $job
          envFrom:
            - secretRef:
                name: sccache-s3
                optional: true
          resources:
            requests:
              cpu: "0"
              memory: "0"
            limits:
              cpu: "2"
              memory: 4Gi
        - name: $postgres
          resources:
            requests:
              cpu: "0"
              memory: "0"
            limits:
              cpu: "2"
              memory: 2Gi
  cc-lb-1.yaml: |
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - macmini
                      - rock5bp
      containers:
        - name: $job
          envFrom:
            - secretRef:
                name: sccache-s3
                optional: true
          resources:
            requests:
              cpu: "0"
              memory: "0"
            limits:
              cpu: "1"
              memory: 2Gi
        - name: $postgres
          resources:
            requests:
              cpu: "0"
              memory: "0"
            limits:
              cpu: "1"
              memory: 1Gi
  cc-lb-500m.yaml: |
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - macmini
                      - rock5bp
      containers:
        - name: $job
          envFrom:
            - secretRef:
                name: sccache-s3
                optional: true
          resources:
            requests:
              cpu: "0"
              memory: "0"
            limits:
              cpu: "1"
              memory: 2Gi
        - name: $postgres
          resources:
            requests:
              cpu: "0"
              memory: "0"
            limits:
              cpu: "1"
              memory: 1Gi
