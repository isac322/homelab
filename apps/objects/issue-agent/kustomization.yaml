apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: issue-agent
resources:
  - namespace.yaml
  - pvc.yaml
  - external-secret-auth.yaml
  - external-secret-github.yaml
  - external-secret-publisher.yaml
  - secret-mirror-rbac.yaml
  - deployment-hub.yaml
  - deployment-n8n.yaml
  - deployment-bridge.yaml
  - service.yaml
  - httproute-hub.yaml
  - httproute-n8n.yaml
  - httproute-webhook.yaml
configMapGenerator:
  - name: issue-agent-bridge-code
    files:
      - bridge.py
      - repo-registry.json
    options:
      annotations:
        # bridge.py exceeds the 256 KiB last-applied-configuration annotation client-side apply writes.
        argocd.argoproj.io/sync-options: ServerSideApply=true
  - name: issue-agent-n8n-workflow
    files:
      - n8n-workflow.json
      - n8n-error-workflow.json
      - n8n-session-workflow.json
      - n8n-intake-workflow.json
      - n8n-bootstrap.sh
