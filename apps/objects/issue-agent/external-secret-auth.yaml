apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: issue-agent-webhook
spec:
  length: 64
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: issue-agent-webhook
spec:
  refreshInterval: "0"
  target:
    name: issue-agent-webhook
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        secret: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: issue-agent-webhook
      rewrite:
        - regexp:
            source: ".*"
            target: password
---
