apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: issue-agent-n8n-owner
spec:
  length: 48
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: issue-agent-n8n-owner
spec:
  refreshInterval: "0"
  target:
    name: issue-agent-n8n-owner
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        email: bhyoo@bhyoo.com
        password: '{{ printf "%sAa1" .password }}'
        N8N_INSTANCE_OWNER_PASSWORD_HASH: '{{ htpasswd "owner" (printf "%sAa1" .password) "bcrypt" | trimPrefix "owner:" }}'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: issue-agent-n8n-owner
      rewrite:
        - regexp:
            source: ".*"
            target: password
