apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: issue-agent-provider
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cluster-secrets
    kind: ClusterSecretStore
  target:
    name: issue-agent-provider
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        OPENAI_API_KEY: "{{ .apiKey }}"
        config.toml: |
          model_provider = "issue-agent"

          [model_providers.issue-agent]
          name = "Issue Agent provider"
          base_url = {{ .baseUrl | toJson }}
          wire_api = "responses"
          env_key = "OPENAI_API_KEY"
          requires_openai_auth = false
  dataFrom:
    - extract:
        key: /homelab/cluster/backbone/proxy/cliproxyapi/hermes
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: issue-agent-n8n-model
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cluster-secrets
    kind: ClusterSecretStore
  target:
    name: issue-agent-n8n-model
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        apiKey: "{{ .apiKey }}"
        baseUrl: "{{ .baseUrl }}"
  dataFrom:
    - extract:
        key: /homelab/cluster/backbone/proxy/cliproxyapi/hermes
