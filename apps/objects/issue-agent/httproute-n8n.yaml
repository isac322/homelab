apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: issue-agent-n8n
spec:
  parentRefs:
    - name: bhyoo-gateway
      namespace: ingress-ctrl
      sectionName: https
  hostnames:
    - n8n.bhyoo.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: issue-agent-n8n
          port: 5678
