apiVersion: apps/v1
kind: Deployment
metadata:
  name: issue-agent-runner
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: issue-agent-runner
  template:
    metadata:
      labels:
        app: issue-agent-runner
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - rock5bp
                      - macmini
      containers:
        - name: runner
          image: ghcr.io/isac322/issue-agent-runner:0.30.7-codex0.159.2-20260930-r2@sha256:c395f10dd33d73e73616611b7b0a97a9ab0381f2c3fd70d9b31cd7bceeb527ff
          env:
            - name: HOME
              value: /home/agent
            - name: HAPI_HOME
              value: /home/agent/.hapi
            - name: CODEX_HOME
              value: /home/agent/.codex
            - name: HAPI_API_URL
              value: http://issue-agent-hub.issue-agent.svc.cluster.local:3006
            - name: GH_CONFIG_DIR
              value: /run/issue-agent/github
            - name: GH_PROMPT_DISABLED
              value: "1"
            - name: GH_NO_UPDATE_NOTIFIER
              value: "1"
            - name: GIT_TERMINAL_PROMPT
              value: "0"
            - name: GIT_AUTHOR_NAME
              value: "bulgasaribot[bot]"
            - name: GIT_AUTHOR_EMAIL
              value: "333478113+bulgasaribot[bot]@users.noreply.github.com"
            - name: GIT_COMMITTER_NAME
              value: "bulgasaribot[bot]"
            - name: GIT_COMMITTER_EMAIL
              value: "333478113+bulgasaribot[bot]@users.noreply.github.com"
            - name: CARGO_BUILD_JOBS
              value: "4"
            - name: GOMAXPROCS
              value: "4"
            - name: CLI_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: issue-agent-hapi-auth
                  key: CLI_API_TOKEN
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: issue-agent-provider
                  key: OPENAI_API_KEY
          startupProbe:
            exec:
              command:
                - /opt/issue-agent/bin/runner-healthcheck
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 80
          livenessProbe:
            exec:
              command:
                - /opt/issue-agent/bin/runner-healthcheck
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 5
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: home
              mountPath: /home/agent
            - name: github
              mountPath: /run/issue-agent/github
              readOnly: true
            - name: provider
              mountPath: /run/issue-agent/provider
              readOnly: true
            - name: tmp
              mountPath: /tmp
        # The only container holding the contents:write token. Called by the
        # bridge only; the runner container cannot read either of its secrets.
        - name: publisher
          image: ghcr.io/isac322/issue-agent-runner:0.30.7-codex0.159.2-20260930-r2@sha256:c395f10dd33d73e73616611b7b0a97a9ab0381f2c3fd70d9b31cd7bceeb527ff
          command:
            - /usr/bin/tini
            - --
            - /opt/issue-agent/bin/publisher
          env:
            - name: HOME
              value: /var/lib/issue-agent-publisher
            - name: PUBLISHER_PORT
              value: "8090"
            - name: PUBLISHER_TOKEN_FILE
              value: /run/issue-agent/publisher/token
            - name: GITHUB_PUSH_TOKEN_FILE
              value: /run/issue-agent/push/token
            - name: PUBLISHER_STATE_DIR
              value: /var/lib/issue-agent-publisher
            - name: ISSUE_AGENT_CHECKOUTS
              value: /home/agent/checkouts
          ports:
            - name: publisher
              containerPort: 8090
          readinessProbe:
            httpGet:
              path: /healthz
              port: publisher
          livenessProbe:
            httpGet:
              path: /healthz
              port: publisher
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: home
              mountPath: /home/agent
            - name: push
              mountPath: /run/issue-agent/push
              readOnly: true
            - name: publisher-auth
              mountPath: /run/issue-agent/publisher
              readOnly: true
            - name: publisher-state
              mountPath: /var/lib/issue-agent-publisher
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: issue-agent-runner-home
        # Agent scratch (/tmp/issue-agent/<worktree>) and repository test suites
        # that build temporary Cargo workspaces under /tmp; 2Gi evicted the pod.
        - name: tmp
          emptyDir:
            sizeLimit: 16Gi
        - name: github
          secret:
            secretName: issue-agent-github-read
            defaultMode: 0440
        - name: provider
          secret:
            secretName: issue-agent-provider
            defaultMode: 0440
        - name: push
          secret:
            secretName: issue-agent-github-push
            defaultMode: 0440
        - name: publisher-auth
          secret:
            secretName: issue-agent-publisher
            defaultMode: 0440
        - name: publisher-state
          emptyDir:
            sizeLimit: 4Gi
