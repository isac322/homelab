# Lets the issue-agent-runner namespace's ESO SecretStore mirror the two
# generated secrets both namespaces must agree on: the HAPI CLI token (hub here,
# runner there) and the publisher bearer token (bridge here, publisher there).
# Nothing else in this namespace is readable from there.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: issue-agent-runner-secret-mirror
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - issue-agent-hapi-auth
      - issue-agent-publisher
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: issue-agent-runner-secret-mirror
subjects:
  - kind: ServiceAccount
    name: issue-agent-secret-mirror
    namespace: issue-agent-runner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: issue-agent-runner-secret-mirror
