apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: issue-agent-github-reviewer-app
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cluster-secrets
    kind: ClusterSecretStore
  target:
    name: issue-agent-github-reviewer-app
    creationPolicy: Owner
  data:
    - secretKey: private-key
      remoteRef:
        key: /homelab/cluster/backbone/github-app/ironeater-reviewer/private-key
---
# Bridge only: the haechibot App submits PR reviews, review-thread
# replies/resolves and the required `issue-agent/review` commit status, so
# PRs opened by bulgasaribot can receive a real APPROVE / REQUEST_CHANGES.
# contents: write is required by GraphQL resolveReviewThread for GitHub Apps.
apiVersion: generators.external-secrets.io/v1alpha1
kind: GithubAccessToken
metadata:
  name: issue-agent-github-review
spec:
  appID: "5118831"
  installID: "166063086"
  permissions:
    contents: write
    issues: read
    pull_requests: write
    statuses: write
  auth:
    privateKey:
      secretRef:
        name: issue-agent-github-reviewer-app
        key: private-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: issue-agent-github-review
spec:
  refreshInterval: 15m
  target:
    name: issue-agent-github-review
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        token: "{{ .token }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: GithubAccessToken
          name: issue-agent-github-review
