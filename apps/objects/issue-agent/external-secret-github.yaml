apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: issue-agent-github-app
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cluster-secrets
    kind: ClusterSecretStore
  target:
    name: issue-agent-github-app
    creationPolicy: Owner
  data:
    - secretKey: private-key
      remoteRef:
        key: /homelab/cluster/backbone/github-app/ironeater/private-key
---
# Bridge: every GitHub issue/PR mutation n8n performs through bridge ops.
# contents: write is required by GraphQL resolveReviewThread for GitHub Apps
# (read is rejected with FORBIDDEN); the bridge never pushes.
# No `repositories`: the token covers every repository the App is installed on.
apiVersion: generators.external-secrets.io/v1alpha1
kind: GithubAccessToken
metadata:
  name: issue-agent-github-token
spec:
  appID: "5063990"
  installID: "164533066"
  permissions:
    contents: write
    issues: write
    pull_requests: write
  auth:
    privateKey:
      secretRef:
        name: issue-agent-github-app
        key: private-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: issue-agent-github-token
spec:
  refreshInterval: 15m
  target:
    name: issue-agent-github-token
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        token: "{{ .token }}"
        config.yml: |
          version: "1"
        hosts.yml: |
          github.com:
            users:
              x-access-token:
                oauth_token: {{ .token | toJson }}
            oauth_token: {{ .token | toJson }}
            git_protocol: https
            user: x-access-token
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: GithubAccessToken
          name: issue-agent-github-token
---
# Runner agent container: read-only; the agent never writes to GitHub.
apiVersion: generators.external-secrets.io/v1alpha1
kind: GithubAccessToken
metadata:
  name: issue-agent-github-read
spec:
  appID: "5063990"
  installID: "164533066"
  permissions:
    contents: read
    issues: read
    pull_requests: read
  auth:
    privateKey:
      secretRef:
        name: issue-agent-github-app
        key: private-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
