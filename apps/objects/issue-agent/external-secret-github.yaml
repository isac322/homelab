---
# Publisher sidecar only: clones base checkouts and pushes hapi-issue-* branches.
apiVersion: generators.external-secrets.io/v1alpha1
kind: GithubAccessToken
metadata:
  name: issue-agent-github-push
spec:
  appID: "5063990"
  installID: "164533066"
  permissions:
    contents: write
  auth:
    privateKey:
      secretRef:
        name: issue-agent-github-app
        key: private-key
---
apiVersion: external-secrets.io/v1
