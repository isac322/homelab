apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: issue-agent-webhook
spec:
  parentRefs:
    - name: public-webhooks
      namespace: flareway-system
      sectionName: issue-agent-webhook
  hostnames:
    - issue-agent-webhook.bhyoo.com
  rules:
    - matches:
        - path:
            type: Exact
            value: /webhooks/github
      # The n8n intake workflow verifies the signature and forwards to the bridge's internal intake.
      backendRefs:
        - name: issue-agent-n8n
          port: 5678
