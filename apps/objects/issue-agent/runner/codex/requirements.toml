# Codex system requirements (/etc/codex/requirements.toml). Hooks declared here
# are managed: trusted by policy without the interactive /hooks review that an
# unattended runner cannot give, and not removable from user config layers.
# The context-mode hooks route large tool output into its sandbox and block
# raw fetches; the codegraph hook indexes the session worktree.
#
# Only these managed hooks run; hooks from user or project layers (a
# repository's .codex/) are ignored.
allow_managed_hooks_only = true

[features]
hooks = true

[hooks]
managed_dir = "/etc/codex/hooks"

[[hooks.SessionStart]]
[[hooks.SessionStart.hooks]]
type = "command"
command = "/etc/codex/hooks/codegraph-index"
timeout = 600
statusMessage = "Indexing the worktree with CodeGraph"

[[hooks.SessionStart.hooks]]
type = "command"
command = "/etc/codex/hooks/context-mode sessionstart"

[[hooks.PreToolUse]]
matcher = "local_shell|shell|shell_command|exec_command|Bash|Shell|apply_patch|Edit|Write|grep_files|ctx_execute|ctx_execute_file|ctx_batch_execute|ctx_fetch_and_index|ctx_search|ctx_index|mcp__"
[[hooks.PreToolUse.hooks]]
type = "command"
command = "/etc/codex/hooks/context-mode pretooluse"

[[hooks.PostToolUse]]
[[hooks.PostToolUse.hooks]]
type = "command"
command = "/etc/codex/hooks/context-mode posttooluse"

[[hooks.PreCompact]]
[[hooks.PreCompact.hooks]]
type = "command"
command = "/etc/codex/hooks/context-mode precompact"

[[hooks.UserPromptSubmit]]
[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = "/etc/codex/hooks/context-mode userpromptsubmit"

[[hooks.Stop]]
[[hooks.Stop.hooks]]
type = "command"
command = "/etc/codex/hooks/context-mode stop"

# MCP server allowlist, matched by server name and absolute command path. A
# server missing here, or whose command or arguments differ, is not started,
# whichever layer declares it. Environment variables cannot be constrained, so
# this is defence in depth; untrusted project roots (codex-untrust) keep a
# repository's .codex/config.toml from loading at all.
[mcp_servers.context-mode.identity]
command = { executable = "/usr/local/bin/context-mode", args = [] }

[mcp_servers.codegraph.identity]
command = { executable = "/usr/local/bin/codegraph", args = [
  { match = "exact", value = "serve" },
  { match = "exact", value = "--mcp" },
] }

# Injected by HAPI per thread (change_title, list_peers). Its command is the
# runner's own compiled binary (process.argv[0] of /usr/local/bin/hapi); the
# arguments vary per session, so only the executable is pinned.
[mcp_servers.hapi.identity]
command = "/usr/local/bin/hapi"
