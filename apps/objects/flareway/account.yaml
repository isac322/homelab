apiVersion: flareway.bhyoo.com/v1alpha1
kind: CloudflareAccount
metadata:
  name: bhyoo
spec:
  accountId: "fc3dc494135a541eb966015a04bc66c6"
  credentials:
    apiTokenSecretRef:
      name: cloudflare-api-token
      namespace: flareway-system
      key: api-token
  grants:
    # CRD defaults inside this atomic list must be explicit for Argo CD comparison.
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: flareway-system
      hostnames:
        - argocd-webhook.bhyoo.com
        - issue-agent-webhook.bhyoo.com
        - cpa-origin.bhyoo.com
      zones: [bhyoo.com]
      exposures: [Public]
      accessCustomPageRefs: Denied
      accessPolicyRefs: Denied
      accessStandaloneApplicationRefs: Denied
      devicePostureIntegrationRefs: Denied
      platformObjects: Denied
      # UnprotectedHostnames only exempts these public listeners from Flareway-managed
      # Cloudflare Access policies; cpa-origin.bhyoo.com enforces Cloudflare Access
      # externally via Terraform (cloudflare_zero_trust_access_application.cpa_origin).
      unprotectedHostnames:
        - argocd-webhook.bhyoo.com
        - issue-agent-webhook.bhyoo.com
        - cpa-origin.bhyoo.com
    - namespaceSelector:
        matchExpressions:
          - key: kubernetes.io/metadata.name
            operator: In
            values: [argocd, issue-agent]
      hostnames:
        - argocd-webhook.bhyoo.com
        - issue-agent-webhook.bhyoo.com
      zones: [bhyoo.com]
      exposures: [Public]
      accessCustomPageRefs: Denied
      accessPolicyRefs: Denied
      accessStandaloneApplicationRefs: Denied
      devicePostureIntegrationRefs: Denied
      platformObjects: Denied
      backends:
        namespaces: Same
        kinds: [Service]
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: cpa-gateway
      hostnames:
        - cpa-origin.bhyoo.com
      zones: [bhyoo.com]
      exposures: [Public]
      accessCustomPageRefs: Denied
      accessPolicyRefs: Denied
      accessStandaloneApplicationRefs: Denied
      devicePostureIntegrationRefs: Denied
      platformObjects: Denied
      backends:
        namespaces: Same
        kinds: [Service]
