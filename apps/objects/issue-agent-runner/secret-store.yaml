# Reads issue-agent's generated shared secrets (see
# apps/objects/issue-agent/secret-mirror-rbac.yaml for the exact grant).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: issue-agent-secret-mirror
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: issue-agent
spec:
  provider:
    kubernetes:
      remoteNamespace: issue-agent
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: issue-agent-secret-mirror
