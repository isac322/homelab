# Model-provider key for the model-proxy sidecar only. The runner container
# never mounts this secret; Codex reaches the provider through the proxy on
# 127.0.0.1:8317, which adds the Authorization header itself.
# MODEL_UPSTREAM is scheme://host of the provider (baseUrl without /v1).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: issue-agent-model-proxy
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cluster-secrets
    kind: ClusterSecretStore
  target:
    name: issue-agent-model-proxy
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        OPENAI_API_KEY: "{{ .apiKey }}"
        MODEL_UPSTREAM: '{{ .baseUrl | trimSuffix "/" | trimSuffix "/v1" }}'
  dataFrom:
    - extract:
        key: /homelab/cluster/backbone/proxy/cliproxyapi/hermes
