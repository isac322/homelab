apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Runner + publisher only: the dockerd sidecar needs a privileged namespace,
# so they live apart from the restricted issue-agent namespace (hub, n8n,
# bridge). Images are still built from apps/objects/issue-agent.
namespace: issue-agent-runner
resources:
  - namespace.yaml
  - pvc.yaml
  - secret-store.yaml
  - external-secret-shared.yaml
  - external-secret-model-proxy.yaml
  - external-secret-github.yaml
  - deployment-runner.yaml
  - service.yaml
# Hashed names roll the runner pod whenever either file changes.
configMapGenerator:
  - name: issue-agent-model-proxy-config
    files:
      - model-proxy/Caddyfile
  - name: issue-agent-provider-config
    files:
      - provider-config/config.toml
