# Runner home: native CODEX_HOME/HAPI_HOME, checkouts, worktrees and sessions.
# Created empty; the dockerd sidecar refuses to start (so the runner and
# publisher never start) until checkouts/.issue-agent-home-ready exists, written
# only by operations/issue-agent-runner-home-migrate `migrate`.
# Prune=false/Delete=false: a rollback or Application deletion never deletes it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: issue-agent-runner-home
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    pillar-csi.bhyoo.com/import-zvol: hot-data/k8s/pvc-a1f5925d-f8d9-4549-b288-4b1867f59dd9
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ssd-ha
  resources:
    requests:
      storage: 20Gi
---
# /var/lib/docker of the runner pod's dockerd sidecar (images, build cache,
# containerd content store). Discardable cache: no retention annotations.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: issue-agent-runner-docker
  annotations:
    pillar-csi.bhyoo.com/import-zvol: hot-data/k8s/pvc-0b800c7b-3f4b-4c85-894d-1a0ccce74201
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ssd-ha
  resources:
    requests:
      storage: 50Gi
