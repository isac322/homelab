# Enforce privileged only for the runner pod's dockerd sidecar; audit/warn stay
# restricted so any other deviation is still reported.
apiVersion: v1
kind: Namespace
metadata:
  name: issue-agent-runner
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
