# Mirrors of generated secrets owned by the issue-agent namespace. The values
# must match there: CLI_API_TOKEN authenticates the runner to the hub, and the
# publisher token authenticates the bridge to the publisher.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: issue-agent-hapi-auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: issue-agent
    kind: SecretStore
  target:
    name: issue-agent-hapi-auth
    creationPolicy: Owner
  data:
    - secretKey: CLI_API_TOKEN
      remoteRef:
        key: issue-agent-hapi-auth
        property: CLI_API_TOKEN
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: issue-agent-publisher
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: issue-agent
    kind: SecretStore
  target:
    name: issue-agent-publisher
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: issue-agent-publisher
        property: token
