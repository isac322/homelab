apiVersion: apps/v1
kind: Deployment
metadata:
  name: issue-agent-runner
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: issue-agent-runner
  template:
    metadata:
      labels:
        app: issue-agent-runner
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Pod-local Docker daemon. Runs as root and privileged; nothing else in
        # the pod may, so its securityContext fully overrides the pod defaults.
        # Reaching its startup probe is what releases the runner container.
        # Image: Dockerfile.dockerd. The explicit command keeps a wrong image
        # from falling back to the upstream entrypoint's TCP listener.
        - name: dockerd
          restartPolicy: Always
          image: ghcr.io/isac322/issue-agent-dockerd:29.4.0-20261001-native-drm-iptables-nft@sha256:331f0a70085fa8f20a11463235ac6cbaa9863ffd1d4fbb895fa127068da6ab79
          command:
            - /opt/issue-agent/bin/dockerd-start
          env:
            - name: ISSUE_AGENT_DOCKER_SOCKDIR
              value: /run/issue-agent-docker
            - name: ISSUE_AGENT_CHECKOUTS
              value: /home/agent/checkouts
          startupProbe:
            exec:
              command:
                - /opt/issue-agent/bin/dockerd-probe
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 60
          livenessProbe:
            exec:
              command:
                - /opt/issue-agent/bin/dockerd-probe
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              memory: 8Gi
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            privileged: true
            seccompProfile:
              type: Unconfined
          volumeMounts:
            - name: docker-sock
              mountPath: /run/issue-agent-docker
            - name: docker-data
              mountPath: /var/lib/docker
            - name: home
              mountPath: /home/agent/checkouts
              subPath: checkouts
            - name: tmp
              mountPath: /tmp
            # Raw curated DRM pair outside /dev; native-dri-prepare projects it
            # onto /dev/dri in the daemon's own mount namespace.
            - name: dri
              mountPath: /run/issue-agent-dri
            - name: dri-card0
              mountPath: /run/issue-agent-dri/card0
            - name: dri-render128
              mountPath: /run/issue-agent-dri/renderD128
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - rock5bp
                      - macmini
      containers:
        - name: runner
          image: ghcr.io/isac322/issue-agent-runner:0.30.7-codex0.159.2-20261002-login-path@sha256:3c0190450b30800f6c179a20a1e6c99073ba1a20fcf437936c8736b0005dfe9a
          env:
            - name: HOME
              value: /home/agent
            - name: HAPI_HOME
              value: /home/agent/.hapi
            - name: CODEX_HOME
              value: /home/agent/.codex
            - name: HAPI_API_URL
              value: http://issue-agent-hub.issue-agent.svc.cluster.local:3006
            - name: GH_CONFIG_DIR
              value: /run/issue-agent/github
            - name: GH_PROMPT_DISABLED
              value: "1"
            - name: GH_NO_UPDATE_NOTIFIER
              value: "1"
            - name: GIT_TERMINAL_PROMPT
              value: "0"
            - name: GIT_AUTHOR_NAME
              value: "bulgasaribot[bot]"
            - name: GIT_AUTHOR_EMAIL
              value: "333478113+bulgasaribot[bot]@users.noreply.github.com"
            - name: GIT_COMMITTER_NAME
              value: "bulgasaribot[bot]"
            - name: GIT_COMMITTER_EMAIL
              value: "333478113+bulgasaribot[bot]@users.noreply.github.com"
            - name: CARGO_BUILD_JOBS
              value: "4"
            - name: GOMAXPROCS
              value: "4"
            - name: DOCKER_HOST
              value: unix:///run/issue-agent-docker/docker.sock
            - name: CLI_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: issue-agent-hapi-auth
                  key: CLI_API_TOKEN
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: issue-agent-provider
                  key: OPENAI_API_KEY
          startupProbe:
            exec:
              command:
                - /opt/issue-agent/bin/runner-healthcheck
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 80
          livenessProbe:
            exec:
              command:
                - /opt/issue-agent/bin/runner-healthcheck
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 5
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: home
              mountPath: /home/agent
            - name: github
              mountPath: /run/issue-agent/github
              readOnly: true
            - name: provider
              mountPath: /run/issue-agent/provider
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: docker-sock
              mountPath: /run/issue-agent-docker
            # Visible so Krema's harness detects the /dev/dri nodes it passes via
            # `docker run --device`; the daemon resolves them in its own mount.
            # The native sidecar creates the two submount targets before its
            # startup probe releases this container.
            - name: dri
              mountPath: /dev/dri
              readOnly: true
            - name: dri-card0
              mountPath: /dev/dri/card0
              readOnly: true
            - name: dri-render128
              mountPath: /dev/dri/renderD128
              readOnly: true
        # The only container holding the contents:write token. Called by the
        # bridge only; the runner container cannot read either of its secrets.
        - name: publisher
          image: ghcr.io/isac322/issue-agent-runner:0.30.7-codex0.159.2-20261001-r4@sha256:901e1cf3e939f27b47919d0012615aa188ecf250e4ebed70ea50a824d1ef9c1b
          command:
            - /usr/bin/tini
            - --
            - /opt/issue-agent/bin/publisher
          env:
            - name: HOME
              value: /var/lib/issue-agent-publisher
            - name: PUBLISHER_PORT
              value: "8090"
            - name: PUBLISHER_TOKEN_FILE
              value: /run/issue-agent/publisher/token
            - name: GITHUB_PUSH_TOKEN_FILE
              value: /run/issue-agent/push/token
            - name: PUBLISHER_STATE_DIR
              value: /var/lib/issue-agent-publisher
            - name: ISSUE_AGENT_CHECKOUTS
              value: /home/agent/checkouts
            - name: CODEX_HOME
              value: /home/agent/.codex
          ports:
            - name: publisher
              containerPort: 8090
          readinessProbe:
            httpGet:
              path: /healthz
              port: publisher
          livenessProbe:
            httpGet:
              path: /healthz
              port: publisher
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: home
              mountPath: /home/agent
            - name: push
              mountPath: /run/issue-agent/push
              readOnly: true
            - name: publisher-auth
              mountPath: /run/issue-agent/publisher
              readOnly: true
            - name: publisher-state
              mountPath: /var/lib/issue-agent-publisher
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: issue-agent-runner-home
        # Agent scratch (/tmp/issue-agent/<worktree>) and repository test suites
        # that build temporary Cargo workspaces under /tmp; 2Gi evicted the pod.
        - name: tmp
          emptyDir:
            sizeLimit: 16Gi
        - name: github
          secret:
            secretName: issue-agent-github-read
            defaultMode: 0440
        - name: provider
          secret:
            secretName: issue-agent-provider
            defaultMode: 0440
        - name: push
          secret:
            secretName: issue-agent-github-push
            defaultMode: 0440
        - name: publisher-auth
          secret:
            secretName: issue-agent-publisher
            defaultMode: 0440
        - name: publisher-state
          emptyDir:
            sizeLimit: 4Gi
        # Unix socket only (dockerd --group=1000 → 0660 root:1000); no TCP listener.
        - name: docker-sock
          emptyDir: {}
        # Image content too: Docker 29's containerd image store keeps it under
        # /var/lib/docker/containerd/daemon, inside this volume.
        - name: docker-data
          persistentVolumeClaim:
            claimName: issue-agent-runner-docker
        # Curated /dev/dri contents: exactly the two CharDevice mounts below.
        # The runner mounts it at /dev/dri; the privileged dockerd container
        # mounts it outside /dev (its runtime would repopulate /dev/dri with
        # every host DRM node) and native-dri-prepare projects it privately.
        - name: dri
          emptyDir: {}
        # Native DRM pair only (asahi on macmini, rockchip-drm on rock5bp),
        # mounted per node rather than the whole /dev/dri so other DRM nodes
        # such as rock5bp's RKNPU card1/renderD129 stay out of the pod.
        # dockerd-probe verifies both belong to the same supported device.
        - name: dri-card0
          hostPath:
            path: /dev/dri/card0
            type: CharDevice
        - name: dri-render128
          hostPath:
            path: /dev/dri/renderD128
            type: CharDevice
