apiVersion: apps/v1
kind: Deployment
metadata:
  name: issue-agent-runner
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: issue-agent-runner
  template:
    metadata:
      labels:
        app: issue-agent-runner
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      # pillar-csi volumes attach only where its node plugin is registered.
      nodeSelector:
        pillar-csi.bhyoo.com/nvmeof: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Pod-local Docker daemon. Runs as root and privileged; nothing else in
        # the pod may, so its securityContext fully overrides the pod defaults.
        # Reaching its startup probe is what releases the runner container.
        # Image: Dockerfile.dockerd. The explicit command keeps a wrong image
        # from falling back to the upstream entrypoint's TCP listener.
        - name: dockerd
          restartPolicy: Always
          image: ghcr.io/isac322/issue-agent-dockerd:29.9.0-20261013-janitor-pressure@sha256:b8417323336fafa8553b38c136b1d88c987eecdde54c651dee5b6e2a46e0b103
          command:
            - /opt/issue-agent/bin/dockerd-start
          env:
            - name: ISSUE_AGENT_DOCKER_SOCKDIR
              value: /run/issue-agent-docker
            - name: ISSUE_AGENT_CHECKOUTS
              value: /home/agent/checkouts
          startupProbe:
            exec:
              command:
                - /opt/issue-agent/bin/dockerd-probe
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 60
          livenessProbe:
            exec:
              command:
                - /opt/issue-agent/bin/dockerd-probe
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 10m
              memory: 160Mi
            limits:
              memory: 8Gi
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            privileged: true
            seccompProfile:
              type: Unconfined
          volumeMounts:
            - name: docker-sock
              mountPath: /run/issue-agent-docker
            - name: docker-data
              mountPath: /var/lib/docker
            - name: home
              mountPath: /home/agent/checkouts
              subPath: checkouts
            - name: tmp
              mountPath: /tmp
            # Raw curated DRM pair outside /dev; native-dri-prepare projects it
            # onto /dev/dri in the daemon's own mount namespace.
            - name: dri
              mountPath: /run/issue-agent-dri
            - name: dri-card0
              mountPath: /run/issue-agent-dri/card0
            - name: dri-render128
              mountPath: /run/issue-agent-dri/renderD128
        # Model proxy: the only container holding the provider key. Codex in
        # the runner reaches the provider through http://127.0.0.1:8317/v1
        # without credentials; Caddy adds the Authorization header from a file
        # mounted only here and forwards just the Codex model endpoints
        # (model-proxy/Caddyfile). Bound to loopback, so other pods and Docker
        # containers cannot use it; exec probes for the same reason. Its own
        # uid, never 1000. The official binary carries the file capability
        # cap_net_bind_service, so exec fails unless that capability stays in
        # the bounding set, even though 8317 needs none.
        - name: model-proxy
          restartPolicy: Always
          image: docker.io/library/caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
          command:
            - caddy
            - run
            - --config
            - /etc/caddy/Caddyfile
            - --adapter
            - caddyfile
          env:
            - name: XDG_DATA_HOME
              value: /tmp
            - name: XDG_CONFIG_HOME
              value: /tmp
            - name: MODEL_UPSTREAM
              valueFrom:
                secretKeyRef:
                  name: issue-agent-model-proxy
                  key: MODEL_UPSTREAM
          startupProbe:
            exec:
              command:
                - wget
                - -q
                - -O
                - /dev/null
                - http://127.0.0.1:8317/healthz
            periodSeconds: 2
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            exec:
              command:
                - wget
                - -q
                - -O
                - /dev/null
                - http://127.0.0.1:8317/healthz
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 5m
              memory: 24Mi
            limits:
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
          volumeMounts:
            - name: model-proxy-key
              mountPath: /run/issue-agent/model-proxy
              readOnly: true
            - name: model-proxy-config
              mountPath: /etc/caddy
              readOnly: true
            - name: model-proxy-tmp
              mountPath: /tmp
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - rock5bp
                      - macmini
      containers:
        - name: runner
          image: ghcr.io/isac322/issue-agent-runner:0.30.7-codex0.162.1-20261013-review-bundle2@sha256:36a6683302261aa31b4882dde7cfed0bd5fae81ea497035235adbc67b257857e
          env:
            - name: HOME
              value: /home/agent
            - name: HAPI_HOME
              value: /home/agent/.hapi
            - name: CODEX_HOME
              value: /home/agent/.codex
            - name: HAPI_API_URL
              value: http://issue-agent-hub.issue-agent.svc.cluster.local:3006
            # How long the runner waits for a spawned/resumed session to report in
            # (HAPI default 15s). Resuming a long Codex thread right after a pod
            # restart took 14s before Codex 0.162.1 and 15.5s+ after it, so the
            # default made resumes fail. Kept below the hub's 30s machine RPC
            # timeout and the bridge's 30s HAPI request timeout.
            - name: HAPI_RUNNER_WEBHOOK_TIMEOUT_MS
              value: "25000"
            - name: GH_CONFIG_DIR
              value: /run/issue-agent/github
            - name: GH_PROMPT_DISABLED
              value: "1"
            - name: GH_NO_UPDATE_NOTIFIER
              value: "1"
            - name: GIT_TERMINAL_PROMPT
              value: "0"
            - name: GIT_AUTHOR_NAME
              value: "bulgasaribot[bot]"
            - name: GIT_AUTHOR_EMAIL
              value: "333478113+bulgasaribot[bot]@users.noreply.github.com"
            - name: GIT_COMMITTER_NAME
              value: "bulgasaribot[bot]"
            - name: GIT_COMMITTER_EMAIL
              value: "333478113+bulgasaribot[bot]@users.noreply.github.com"
            - name: CARGO_BUILD_JOBS
              value: "4"
            - name: GOMAXPROCS
              value: "4"
            - name: DOCKER_HOST
              value: unix:///run/issue-agent-docker/docker.sock
            - name: CLI_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: issue-agent-hapi-auth
                  key: CLI_API_TOKEN
          startupProbe:
            exec:
              command:
                - /opt/issue-agent/bin/runner-healthcheck
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 80
          livenessProbe:
            exec:
              command:
                - /opt/issue-agent/bin/runner-healthcheck
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 2560Mi
            # Blast wall sized to the allowed concurrency, measured 2026-10-13:
            # 14d working-set P99 ~3.4Gi, but the 10:10Z OOMKill (5.95Gi) was
            # censored at the 6Gi limit. Uncensored model: one codex session
            # with its MCP servers ~751Mi RSS, each of its max_threads=2
            # sub-agents adds ~275Mi (own codegraph 1.6.2/context-mode/hapi
            # mcp), working set ~1.15 x RSS. At MAX_ACTIVE_EVENTS=5 that is
            # 5 x 1.27Gi RSS -> ~7.4Gi working set (7.5Gi would leave ~1%).
            # Builds run in dockerd's cgroup, not here. 1.2 x 7.4Gi -> 9Gi.
            limits:
              memory: 9Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: home
              mountPath: /home/agent
            - name: github
              mountPath: /run/issue-agent/github
              readOnly: true
            - name: provider
              mountPath: /run/issue-agent/provider
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: docker-sock
              mountPath: /run/issue-agent-docker
            # Visible so Krema's harness detects the /dev/dri nodes it passes via
            # `docker run --device`; the daemon resolves them in its own mount.
            # The native sidecar creates the two submount targets before its
            # startup probe releases this container.
            - name: dri
              mountPath: /dev/dri
              readOnly: true
            - name: dri-card0
              mountPath: /dev/dri/card0
              readOnly: true
            - name: dri-render128
              mountPath: /dev/dri/renderD128
              readOnly: true
        # The only container holding the contents:write token. Called by the
        # bridge only; the runner container cannot read either of its secrets.
        # Same image as the runner; /checkout also marks the checkout and its
        # worktrees untrusted in CODEX_HOME (codex-untrust).
        - name: publisher
          image: ghcr.io/isac322/issue-agent-runner:0.30.7-codex0.162.1-20261013-review-bundle2@sha256:36a6683302261aa31b4882dde7cfed0bd5fae81ea497035235adbc67b257857e
          command:
            - /usr/bin/tini
            - --
            - /opt/issue-agent/bin/publisher
          env:
            - name: HOME
              value: /var/lib/issue-agent-publisher
            - name: PUBLISHER_PORT
              value: "8090"
            - name: PUBLISHER_TOKEN_FILE
              value: /run/issue-agent/publisher/token
            - name: GITHUB_PUSH_TOKEN_FILE
              value: /run/issue-agent/push/token
            - name: PUBLISHER_STATE_DIR
              value: /var/lib/issue-agent-publisher
            - name: ISSUE_AGENT_CHECKOUTS
              value: /home/agent/checkouts
            - name: CODEX_HOME
              value: /home/agent/.codex
          ports:
            - name: publisher
              containerPort: 8090
          readinessProbe:
            httpGet:
              path: /healthz
              port: publisher
          livenessProbe:
            httpGet:
              path: /healthz
              port: publisher
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: home
              mountPath: /home/agent
            - name: push
              mountPath: /run/issue-agent/push
              readOnly: true
            - name: publisher-auth
              mountPath: /run/issue-agent/publisher
              readOnly: true
            - name: publisher-state
              mountPath: /var/lib/issue-agent-publisher
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: issue-agent-runner-home
        # Agent scratch (/tmp/issue-agent/<worktree>) and repository test suites
        # that build temporary Cargo workspaces under /tmp; 2Gi evicted the pod.
        - name: tmp
          emptyDir:
            sizeLimit: 16Gi
        - name: github
          secret:
            secretName: issue-agent-github-read
            defaultMode: 0440
        # Provider config without credentials (provider-config/config.toml);
        # the bootstrap installs it as $CODEX_HOME/config.toml.
        - name: provider
          configMap:
            name: issue-agent-provider-config
            defaultMode: 0444
        - name: push
          secret:
            secretName: issue-agent-github-push
            defaultMode: 0440
        - name: publisher-auth
          secret:
            secretName: issue-agent-publisher
            defaultMode: 0440
        - name: publisher-state
          emptyDir:
            sizeLimit: 4Gi
        # Unix socket only (dockerd --group=1000 → 0660 root:1000); no TCP listener.
        - name: docker-sock
          emptyDir: {}
        # Image content too: Docker 29's containerd image store keeps it under
        # /var/lib/docker/containerd/daemon, inside this volume.
        - name: docker-data
          persistentVolumeClaim:
            claimName: issue-agent-runner-docker
        # Curated /dev/dri contents: exactly the two CharDevice mounts below.
        # The runner mounts it at /dev/dri; the privileged dockerd container
        # mounts it outside /dev (its runtime would repopulate /dev/dri with
        # every host DRM node) and native-dri-prepare projects it privately.
        - name: dri
          emptyDir: {}
        # Native DRM pair only (asahi on macmini, rockchip-drm on rock5bp),
        # mounted per node rather than the whole /dev/dri so other DRM nodes
        # such as rock5bp's RKNPU card1/renderD129 stay out of the pod.
        # dockerd-probe verifies both belong to the same supported device.
        - name: dri-card0
          hostPath:
            path: /dev/dri/card0
            type: CharDevice
        - name: dri-render128
          hostPath:
            path: /dev/dri/renderD128
            type: CharDevice
        # Provider key, mounted only by model-proxy (uid 65532, which reads it
        # through the pod fsGroup); the runner never mounts it.
        - name: model-proxy-key
          secret:
            secretName: issue-agent-model-proxy
            items:
              - key: OPENAI_API_KEY
                path: OPENAI_API_KEY
            defaultMode: 0440
        - name: model-proxy-config
          configMap:
            name: issue-agent-model-proxy-config
            defaultMode: 0444
        - name: model-proxy-tmp
          emptyDir:
            sizeLimit: 16Mi
