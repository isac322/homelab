apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cpa-gateway-upstream
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cluster-secrets
    kind: ClusterSecretStore
  target:
    name: cpa-gateway-upstream
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        OPENAI_API_KEY: "{{ .apiKey }}"
        MODEL_UPSTREAM: '{{ .baseUrl | trimSuffix "/" | trimSuffix "/v1" }}'
  dataFrom:
    - extract:
        key: /homelab/cluster/backbone/proxy/cliproxyapi/hermes
