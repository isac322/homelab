apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cpa-origin
spec:
  parentRefs:
    - name: public-webhooks
      namespace: flareway-system
      sectionName: cpa-origin
  hostnames:
    - cpa-origin.bhyoo.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1/responses
        - path:
            type: PathPrefix
            value: /v1/models
      backendRefs:
        - name: cpa-gateway
          port: 8317
