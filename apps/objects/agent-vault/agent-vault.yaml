apiVersion: v1
kind: Service
metadata:
  name: agent-vault
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: agent-vault
spec:
  selector:
    app.kubernetes.io/name: agent-vault
  ports:
    - name: management
      port: 14321
      targetPort: management
    - name: proxy
      port: 14322
      targetPort: proxy
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: agent-vault
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: agent-vault
spec:
  serviceName: agent-vault
  replicas: 1
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-vault
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-vault
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent-vault
          image: infisical/agent-vault:0.22.0
          imagePullPolicy: IfNotPresent
          args:
            - server
            - --host
            - 0.0.0.0
            - --port
            - "14321"
            - --mitm-port
            - "14322"
          env:
            - name: AGENT_VAULT_ADDR
              value: https://agent-vault.bhyoo.com
            - name: AGENT_VAULT_MASTER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agent-vault-master-password
                  key: masterPassword
            - name: AGENT_VAULT_LOG_LEVEL
              value: info
            - name: AGENT_VAULT_LOGS_RETENTION_LOCK
              value: "true"
            - name: AGENT_VAULT_RATELIMIT_LOCK
              value: "true"
          ports:
            - name: management
              containerPort: 14321
            - name: proxy
              containerPort: 14322
          startupProbe:
            httpGet:
              path: /health
              port: management
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /health
              port: management
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: management
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        annotations:
          argocd.argoproj.io/sync-options: Delete=false,Prune=false
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: ssd-ha-cnpg
        resources:
          requests:
            storage: 2Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-vault
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agent-vault
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: hermes
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-ctrl
      ports:
        - protocol: TCP
          port: 14321
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: hermes
      ports:
        - protocol: TCP
          port: 14322
  egress:
    - {}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agent-vault
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: bhyoo-gateway
      namespace: ingress-ctrl
  hostnames:
    - agent-vault.bhyoo.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: agent-vault
          port: 14321
          weight: 1
