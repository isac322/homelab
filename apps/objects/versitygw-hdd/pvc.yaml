apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: versitygw-hdd-data
  annotations:
    # Created by democratic-csi (hdd-ha-xfs, iSCSI) and imported into
    # pillar-csi in place on 2026-10-12, so the S3 backend kept its contents.
    pillar-csi.bhyoo.com/import-zvol: nas/k8s/pvc-ea9bd4c6-cf3b-4d83-8457-c639c6ae9246
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: hdd-ha-retain
  resources:
    requests:
      storage: 1Ti
