# Partial server-side apply patch: marks the StorageClass generated by the
# ssd-ha PillarStorageClass (storageclass.yaml) as the cluster default for
# PVCs that omit storageClassName. PillarStorageClass cannot set StorageClass
# annotations, and its controller keeps annotations it does not manage, so
# Argo CD owns only this annotation. Prune/Delete=false: removing this file or
# the Application must not delete the pillar-owned StorageClass; remove the
# annotation from the cluster by hand when retiring it.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ssd-ha
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
