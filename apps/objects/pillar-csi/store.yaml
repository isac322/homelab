apiVersion: pillar-csi.bhyoo.com/v1alpha1
kind: PillarAgent
metadata:
  name: rock5bp
spec:
  nodeRef:
    name: rock5bp
---
# Non-replicated SSD pool on rock5bp (nvme1n1p5). The pool is created and
# owned host-natively (preserveNasState); see README. The layout must match
# agent.backends in values/pillar-csi/backbone.yaml.
# Volumes are thick (ZFS default refreservation) so a full pool cannot turn
# into I/O errors inside a running volume. A PVC opts into thin with
# `zfs: {properties: {refreservation: none}}` in its backend annotation; the
# reverse is not expressible, because `zfs create -V` rejects
# `refreservation=auto` with "out of space".
apiVersion: pillar-csi.bhyoo.com/v1alpha1
kind: PillarStore
metadata:
  name: rock5bp-fast
spec:
  agentRef: rock5bp
  backend:
    zfs:
      volumeType: zvol
      pool: fast
      parentDataset: k8s
---
# Replicated pools (raidz1) on rock5bp, shared with democratic-csi and openebs
# zfs-localpv. The parent dataset is the one those drivers use, so their
# existing zvols can be imported without copying (pillar-csi.bhyoo.com/
# import-zvol). Imported zvols keep their own properties; new volumes follow
# the same thick default as rock5bp-fast.
apiVersion: pillar-csi.bhyoo.com/v1alpha1
kind: PillarStore
metadata:
  name: rock5bp-hot
spec:
  agentRef: rock5bp
  backend:
    zfs:
      volumeType: zvol
      pool: hot-data
      parentDataset: k8s
---
apiVersion: pillar-csi.bhyoo.com/v1alpha1
kind: PillarStore
metadata:
  name: rock5bp-nas
spec:
  agentRef: rock5bp
  backend:
    zfs:
      volumeType: zvol
      pool: nas
      parentDataset: k8s
---
apiVersion: pillar-csi.bhyoo.com/v1alpha1
kind: PillarProtocol
metadata:
  name: nvmeof-tcp
spec:
  protocol:
    nvmeofTcp:
      port: 4420
      acl: true
      # rock5bp takes ~7.5 minutes to come back from a reboot; the kernel
      # default (600s) leaves too little margin before consumers give up and
      # their filesystems shut down.
      ctrlLossTmo: 1200
      reconnectDelay: 5
