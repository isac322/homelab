name: Camofox browser ARM64

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - .github/workflows/camofox-browser-arm64.yaml

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/isac322/camofox-browser
  TAG: 1.13.0-arm64
  UPSTREAM_SHA: 8b5b0959adfadadae38ecce9d7eed706ab102bf1

jobs:
  build:
    name: Build, verify, and publish
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Checkout homelab
        uses: actions/checkout@v6

      - name: Checkout pinned Camofox source
        uses: actions/checkout@v6
        with:
          repository: jo-inc/camofox-browser
          ref: ${{ env.UPSTREAM_SHA }}
          path: upstream

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ARM64 image
        run: |
          set -euo pipefail
          docker build \
            --build-arg ARCH=arm64 \
            --label org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY} \
            --label org.opencontainers.image.revision=${UPSTREAM_SHA} \
            --tag "${IMAGE}:${TAG}" \
            upstream

      - name: Verify non-root browser and VNC runtime
        run: |
          set -euo pipefail
          home_volume="camofox-home-${GITHUB_RUN_ID}"
          data_volume="camofox-data-${GITHUB_RUN_ID}"
          container="camofox-smoke-${GITHUB_RUN_ID}"
          cleanup() {
            docker rm -f "$container" >/dev/null 2>&1 || true
            docker volume rm "$home_volume" "$data_volume" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker volume create "$home_volume" >/dev/null
          docker volume create "$data_volume" >/dev/null
          docker run --rm \
            --volume "$home_volume:/target" \
            "${IMAGE}:${TAG}" \
            sh -ec 'mkdir -p /target/.cache; cp -a /root/.cache/camoufox /target/.cache/; chown -R 1000:1000 /target'

          docker run -d \
            --name "$container" \
            --read-only \
            --user 1000:1000 \
            --security-opt no-new-privileges \
            --cap-drop ALL \
            --tmpfs /tmp:rw,nosuid,size=512m,uid=1000,gid=1000 \
            --tmpfs /dev/shm:rw,nosuid,size=512m,uid=1000,gid=1000 \
            --volume "$home_volume:/home/node" \
            --volume "$data_volume:/data" \
            --env HOME=/home/node \
            --env CAMOFOX_BIND_HOST=127.0.0.1 \
            --env CAMOFOX_CRASH_REPORT_ENABLED=false \
            --env CAMOFOX_DISABLE_DEFAULT_ADDONS=true \
            --env CAMOFOX_PROFILE_DIR=/data/profiles \
            --env CAMOFOX_COOKIES_DIR=/data/cookies \
            --env CAMOFOX_TRACES_DIR=/data/traces \
            --env CAMOFOX_API_KEY=smoke-api-key \
            --env CAMOFOX_ACCESS_KEY=smoke-api-key \
            --env ENABLE_VNC=1 \
            --env VNC_BIND=127.0.0.1 \
            --env VNC_PASSWORD=smokevnc \
            --env VNC_RESOLUTION=1280x720 \
            "${IMAGE}:${TAG}" >/dev/null

          for attempt in $(seq 1 60); do
            if docker exec "$container" node -e \
              "fetch('http://127.0.0.1:9377/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker logs "$container"
              exit 1
            fi
            sleep 2
          done

          docker exec "$container" node -e \
            "fetch('http://127.0.0.1:9377/tabs',{method:'POST',headers:{'content-type':'application/json','authorization':'Bearer smoke-api-key'},body:JSON.stringify({userId:'smoke',sessionKey:'smoke',url:'https://example.com'})}).then(async r => { if (!r.ok) throw new Error(await r.text()) }).catch(e => { console.error(e); process.exit(1) })"

          for attempt in $(seq 1 30); do
            if docker exec "$container" node -e \
              "fetch('http://127.0.0.1:9377/vnc/status',{headers:{authorization:'Bearer smoke-api-key'}}).then(r => r.json()).then(v => process.exit(v.running && v.watcherRunning ? 0 : 1)).catch(() => process.exit(1))"; then
              exit 0
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs "$container"
              exit 1
            fi
            sleep 2
          done

      - name: Publish image
        run: docker push "${IMAGE}:${TAG}"
