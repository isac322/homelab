# Hindsight — AI Agent Memory Server

api:
  replicaCount: 1
  image:
    tag: "1.2.0-slim@sha256:38482a3f10dbf2ff50a5b577b2e82994cb2c9ae172183bcb46263b4550f8ec04"
  resources:
    requests:
      cpu: 25m
      memory: 640Mi
    limits:
      memory: 1Gi
  env:
    HINDSIGHT_API_TENANT_EXTENSION: "hindsight_api.extensions.builtin.tenant:ApiKeyTenantExtension"
    HINDSIGHT_API_MCP_ENABLED: "false"
    # LLM: OpenAI with the key shared with embeddings (HINDSIGHT_API_LLM_API_KEY from hindsight-secrets).
    # gpt-6-luna ranks #2 on Hindsight 1.2.0's retain and all-operations leaderboards at the lowest cost.
    HINDSIGHT_API_LLM_PROVIDER: "openai"
    HINDSIGHT_API_LLM_MODEL: "gpt-6-luna"
    # Vector extension
    HINDSIGHT_API_VECTOR_EXTENSION: "vchord"
    # Retain
    HINDSIGHT_API_RETAIN_EXTRACTION_MODE: "verbose"
    # Embeddings — OpenAI
    HINDSIGHT_API_EMBEDDINGS_PROVIDER: "openai"
    HINDSIGHT_API_EMBEDDINGS_OPENAI_MODEL: "text-embedding-3-large"
    # Reranker — RRF ordering of the semantic, keyword, graph and temporal candidate lists
    HINDSIGHT_API_RERANKER_PROVIDER: "rrf"
    # Recall performance — keep everyday searches bounded while preserving high-budget depth
    HINDSIGHT_API_QUERY_ANALYZER_LANGUAGES: "ko,en"
    HINDSIGHT_API_RERANKER_MAX_CANDIDATES_LOW: "75"
    HINDSIGHT_API_RERANKER_MAX_CANDIDATES_MID: "150"
    HINDSIGHT_API_RERANKER_MAX_CANDIDATES_HIGH: "300"
  livenessProbe:
    httpGet:
      path: /health/live
      port: 8888
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
  readinessProbe:
    httpGet:
      path: /health
      port: 8888
    initialDelaySeconds: 15
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 6

controlPlane:
  enabled: true
  replicaCount: 1
  image:
    tag: "1.2.0@sha256:f518803353d16e870aee930382e2eaaae965e649adba90a0b57fa4dc93bfd9a1"
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi

worker:
  enabled: false

postgresql:
  enabled: false
  external:
    host: cnpg-hindsight-rw.hindsight.svc
    port: 5432
    database: hindsight
    username: hindsight

existingSecret: hindsight-secrets

# Bump in Git after hindsight-secrets changes; API and control plane read envFrom at pod start.
podAnnotations:
  kubectl.kubernetes.io/restartedAt: "2026-11-18T06:00:00Z"

ingress:
  enabled: false
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: cluster-issuer-acme
    cert-manager.io/private-key-algorithm: ECDSA
    cert-manager.io/private-key-size: "384"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
  hosts:
    - host: hindsight.bhyoo.com
      paths:
        - path: /
          pathType: Prefix
          service: controlPlane
    - host: hindsight-api.bhyoo.com
      paths:
        - path: /
          pathType: Prefix
          service: api
  tls:
    - hosts:
        - hindsight.bhyoo.com
      secretName: hindsight-bhyoo-com
    - hosts:
        - hindsight-api.bhyoo.com
      secretName: hindsight-api-bhyoo-com
