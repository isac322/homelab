# Hindsight — AI Agent Memory Server

api:
  replicaCount: 1
  image:
    tag: "1.1.0-slim@sha256:b97af4787f35f0f897cc85299e1c800e265ff98e1d70c900c58a7f9903cb5b7d"
  resources:
    requests:
      cpu: 25m
      memory: 640Mi
    limits:
      memory: 1Gi
  env:
    # LLM: Vertex AI using the existing service-account mount through ADC
    HINDSIGHT_API_LLM_PROVIDER: "vertexai"
    HINDSIGHT_API_LLM_MODEL: "gemini-3.5-flash-lite"
    HINDSIGHT_API_LLM_VERTEXAI_PROJECT_ID: "runbear"
    HINDSIGHT_API_LLM_VERTEXAI_REGION: "global"
    # Vector extension
    HINDSIGHT_API_VECTOR_EXTENSION: "vchord"
    # Retain
    HINDSIGHT_API_RETAIN_EXTRACTION_MODE: "verbose"
    # Embeddings — OpenAI
    HINDSIGHT_API_EMBEDDINGS_PROVIDER: "openai"
    HINDSIGHT_API_EMBEDDINGS_OPENAI_MODEL: "text-embedding-3-large"
    # Reranker — Vertex AI Ranking via LiteLLM SDK (auth via GOOGLE_APPLICATION_CREDENTIALS)
    HINDSIGHT_API_RERANKER_PROVIDER: "litellm-sdk"
    HINDSIGHT_API_RERANKER_LITELLM_SDK_MODEL: "vertex_ai/semantic-ranker-fast@latest"
    HINDSIGHT_API_RERANKER_LITELLM_SDK_API_KEY: "gcp-sa"  # placeholder — actual auth via GOOGLE_APPLICATION_CREDENTIALS
    # Recall performance — keep everyday searches bounded while preserving high-budget depth
    HINDSIGHT_API_QUERY_ANALYZER_LANGUAGES: "ko,en"
    HINDSIGHT_API_RERANKER_MAX_CANDIDATES_LOW: "75"
    HINDSIGHT_API_RERANKER_MAX_CANDIDATES_MID: "150"
    HINDSIGHT_API_RERANKER_MAX_CANDIDATES_HIGH: "300"
    # Keep recall available with RRF ordering when the Vertex AI reranker is unavailable
    HINDSIGHT_API_RERANKER_1_PROVIDER: "rrf"
    GOOGLE_APPLICATION_CREDENTIALS: "/etc/gcp/sa-key.json"
    VERTEXAI_PROJECT: "runbear"
    VERTEXAI_LOCATION: "global"
  extraVolumes:
    - name: gcp-sa-key
      secret:
        secretName: hindsight-gcp-sa-key
  extraVolumeMounts:
    - name: gcp-sa-key
      mountPath: /etc/gcp
      readOnly: true
  livenessProbe:
    httpGet:
      path: /health/live
      port: 8888
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
  readinessProbe:
    httpGet:
      path: /health
      port: 8888
    initialDelaySeconds: 15
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 6

controlPlane:
  enabled: true
  replicaCount: 1
  image:
    tag: "1.1.0@sha256:373f86848649a8dadc9b2d9ecf1d18b4c446162ca7b556fc4152e92ef433e983"
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi

worker:
  enabled: false

postgresql:
  enabled: false
  external:
    host: cnpg-hindsight-rw.hindsight.svc
    port: 5432
    database: hindsight
    username: hindsight

existingSecret: hindsight-secrets

# Bump in Git after hindsight-secrets changes; API and control plane read envFrom at pod start.
podAnnotations:
  kubectl.kubernetes.io/restartedAt: "2026-10-14T05:02:24Z"

ingress:
  enabled: false
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: cluster-issuer-acme
    cert-manager.io/private-key-algorithm: ECDSA
    cert-manager.io/private-key-size: "384"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
  hosts:
    - host: hindsight.bhyoo.com
      paths:
        - path: /
          pathType: Prefix
          service: controlPlane
    - host: hindsight-api.bhyoo.com
      paths:
        - path: /
          pathType: Prefix
          service: api
  tls:
    - hosts:
        - hindsight.bhyoo.com
      secretName: hindsight-bhyoo-com
    - hosts:
        - hindsight-api.bhyoo.com
      secretName: hindsight-api-bhyoo-com
