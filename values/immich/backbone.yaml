## This chart relies on the common library chart from bjw-s
## You can find it at https://github.com/bjw-s-labs/helm-charts/tree/common-4.3.0/charts/library/common
## Refer there for more detail about the supported values

# These entries are shared between all the Immich components

controllers:
  main:
    containers:
      main:
        image:
          tag: v3.3.1@sha256:db996e352359771c6a3db121a0ed8761516b22f727fc092a0f46dcfef82c1bc1
        env:
          REDIS_HOSTNAME: '{{ printf "%s-valkey" .Release.Name }}'
          # Add the env vars to connect to your database here.
          DB_HOSTNAME:
            valueFrom:
              secretKeyRef:
                key: host
                name: cnpg-immich-superuser
          DB_PORT:
            valueFrom:
              secretKeyRef:
                key: port
                name: cnpg-immich-superuser
          DB_USERNAME:
            valueFrom:
              secretKeyRef:
                key: username
                name: cnpg-immich-superuser
          DB_PASSWORD:
            valueFrom:
              secretKeyRef:
                key: password
                name: cnpg-immich-superuser
          DB_DATABASE_NAME: app
          TZ: Asia/Seoul

immich:
  metrics:
    # Enabling this will create the service monitors needed to monitor immich with the prometheus operator
    enabled: true
  persistence:
    # Main data store for all photos shared between different components.
    library:
      # Automatically creating the library volume is not supported by this chart
      # You have to specify an existing PVC to use
      existingClaim: immich-data
  # configuration is immich-config.json converted to yaml
  # ref: https://immich.app/docs/install/config-file/
  #
  configuration: {}
    # trash:
    #   enabled: false
    #   days: 30
    # storageTemplate:
    #   enabled: true
    #   template: "{{y}}/{{y}}-{{MM}}-{{dd}}/{{filename}}"
  configurationKind: Secret
  existingConfiguration: immich-config

# Dependencies

valkey:
  enabled: true
  controllers:
    main:
      containers:
        main:
          image:
            repository: docker.io/valkey/valkey
            tag: 9.1.2-alpine@sha256:a0dbf4c1d5708782907c10e2c72deff317518518b5288a58416981d9db95d30b
            pullPolicy: IfNotPresent
          args:
            - --maxmemory
            - 192mb
            - --maxmemory-policy
            - noeviction
          resources:
            requests:
              cpu: 15m
              memory: 48Mi
            limits:
              memory: 256Mi
  persistence:
    data:
      enabled: true
      size: 1Gi
      # Optional: Set this to persistentVolumeClaim to keep job queues persistent
      type: persistentVolumeClaim
      accessMode: ReadWriteOnce
      storageClass: ssd-ha
      annotations:
        pillar-csi.bhyoo.com/import-zvol: hot-data/k8s/pvc-ee3ed006-37a7-41ce-a181-272a7072da61

# Immich components

server:
  enabled: true
  controllers:
    main:
      strategy: Recreate
      pod:
        nodeSelector:
          homelab.bhyoo.com/media-api: rkmpp
      containers:
        main:
          image:
            repository: ghcr.io/immich-app/immich-server
            pullPolicy: IfNotPresent
          env:
            # Mali OpenCL shim (libMaliOpenCL.so.1) lives in /usr/lib/aarch64-linux-gnu/mali/
            # on Debian's libmali-valhall-* package layout. The container image has no
            # ldconfig and the host's /etc/ld.so.conf.d/00-aarch64-mali.conf is not mounted,
            # so the dynamic linker cannot find libMaliOpenCL.so.1 referenced by mali.icd
            # without an explicit LD_LIBRARY_PATH. Required for HDR->SDR tonemapping via
            # ffmpeg hwmap -> tonemap_opencl on RK3588.
            LD_LIBRARY_PATH: /usr/lib/aarch64-linux-gnu/mali
          resources:
            requests:
              cpu: 300m
              memory: 1536Mi
            limits:
              memory: 5Gi
          securityContext:
            appArmorProfile:
              type: Unconfined
            privileged: true
  ingress:
    main:
      enabled: false
      annotations:
        cert-manager.io/cluster-issuer: cluster-issuer-acme
        cert-manager.io/private-key-algorithm: ECDSA
        cert-manager.io/private-key-size: "384"
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
      hosts:
        - host: immich.bhyoo.com
          paths:
            - path: "/"
              service:
                identifier: main
      tls:
        - hosts:
            - immich.bhyoo.com
          secretName: immich-bhyoo-com
  route:
    main:
      enabled: true
      parentRefs:
        - name: bhyoo-gateway
          namespace: ingress-ctrl
          sectionName: https
      hostnames:
        - immich.bhyoo.com
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
          backendRefs:
            - identifier: main
              port: http
  persistence:
    rk-drivers:
      enabled: true
      type: hostPath
      hostPath: /dev/dri
    rk-rga:
      enabled: true
      type: hostPath
      hostPath: /dev/rga
    rk-dma-heap:
      enabled: true
      type: hostPath
      hostPath: /dev/dma_heap
    rk-dma-mpp-service:
      enabled: true
      type: hostPath
      hostPath: /dev/mpp_service
    rk-mali:
      enabled: true
      type: hostPath
      hostPath: /dev/mali0
    opencl:
      enabled: true
      type: hostPath
      hostPath: /etc/OpenCL
    libmali:
      enabled: true
      type: hostPath
      hostPath: /usr/lib/aarch64-linux-gnu/libmali.so.1
    mali-libs:
      enabled: true
      type: hostPath
      hostPath: /usr/lib/aarch64-linux-gnu/mali
    libmali-hook:
      enabled: true
      type: hostPath
      hostPath: /usr/lib/aarch64-linux-gnu/libmali-hook.so.1
    libxcb-dri2:
      enabled: true
      type: hostPath
      hostPath: /usr/lib/aarch64-linux-gnu/libxcb-dri2.so.0
    libx11-xcb:
      enabled: true
      type: hostPath
      hostPath: /usr/lib/aarch64-linux-gnu/libX11-xcb.so.1
    libwayland-client:
      enabled: true
      type: hostPath
      hostPath: /usr/lib/aarch64-linux-gnu/libwayland-client.so.0
    libwayland-server:
      enabled: true
      type: hostPath
      hostPath: /usr/lib/aarch64-linux-gnu/libwayland-server.so.0
    # These files are verbatim copies of immich v3.3.1 server dist JS with only the
    # local RKMPP/OpenCL tonemap and frame-cropping deltas applied (see the
    # media-patch-configmap.yaml commit history and the PR #30022 port). They are
    # valid ONLY for the server image tag pinned in this values file (v3.3.1).
    # To regenerate: extract the six dist files from
    # ghcr.io/immich-app/immich-server:<tag> (docker create --platform linux/arm64
    # + docker cp), apply the local delta via git merge-file (base = old upstream
    # tag, theirs = previous patched copies), node --check each file, then re-embed
    # in apps/objects/immich/media-patch-configmap.yaml.
    patch-media:
      enabled: true
      type: configMap
      name: immich-media-patch
      advancedMounts:
        main:
          main:
            - path: /usr/src/app/server/dist/utils/media.js
              subPath: media.js
            - path: /usr/src/app/server/dist/utils/database.js
              subPath: database.js
            - path: /usr/src/app/server/dist/repositories/media.repository.js
              subPath: media.repository.js
            - path: /usr/src/app/server/dist/repositories/asset.repository.js
              subPath: asset.repository.js
            - path: /usr/src/app/server/dist/services/metadata.service.js
              subPath: metadata.service.js
            - path: /usr/src/app/server/dist/services/media.service.js
              subPath: media.service.js

machine-learning:
  enabled: true
  controllers:
    main:
      strategy: Recreate
      pod:
        nodeSelector:
          homelab.bhyoo.com/npu: rknn
      containers:
        main:
          image:
            repository: ghcr.io/isac322/immich-machine-learning
            tag: v3.3.1-rknn@sha256:8d859332aa0bfdcd7262706de4c4a3b410cb012fa5921731902d8ef6d87a9e30
          env:
            MACHINE_LEARNING_RKNN_THREADS: 3
            # Upstream v2 models fold the XLM-R position-id CumSum away at export
            # time, so nllb-clip textual loads on librknnrt without locally
            # patched models.
            MACHINE_LEARNING_MODEL_REVISION: v2
          securityContext:
            appArmorProfile:
              type: Unconfined
            privileged: true
          resources:
            requests:
              cpu: 200m
              memory: 1536Mi
            limits:
              cpu: 2
              memory: 6Gi
              rock-chips.com/rknpu: 1
          probes:
            liveness: &machineLearningProbes
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ping
                  port: http
                initialDelaySeconds: 0
                periodSeconds: 10
                timeoutSeconds: 10
                failureThreshold: 12
            readiness: *machineLearningProbes
            startup:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ping
                  port: http
                initialDelaySeconds: 0
                periodSeconds: 10
                timeoutSeconds: 10
                failureThreshold: 60
  persistence:
    cache:
      enabled: true
      type: emptyDir
      advancedMounts:
        main:
          main:
            - {}
    rk-drivers:
      enabled: true
      type: hostPath
      hostPath: /dev/dri
      advancedMounts:
        main:
          main:
            - {}
