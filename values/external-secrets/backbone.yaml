resources:
  requests:
    cpu: 10m
    memory: 104Mi
  limits:
    cpu: 50m
    memory: 160Mi

grafanaDashboard:
  enabled: true

serviceMonitor:
  enabled: true

webhook:
  serviceMonitor:
    enabled: true

  resources:
    requests:
      cpu: 10m
      memory: 112Mi
    limits:
      cpu: 50m
      memory: 192Mi

  certManager:
    enabled: true
    cert:
      issuerRef:
        kind: ClusterIssuer
        name: cluster-issuer-self-signed
      duration: 8760h
      renewBefore: 2200h

certController:
  create: false
