resources:
  requests:
    cpu: 10m
    memory: 104Mi
  limits:
    memory: 128Mi

grafanaDashboard:
  enabled: true

serviceMonitor:
  enabled: true

webhook:
  serviceMonitor:
    enabled: true

  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 192Mi

  certManager:
    enabled: true
    cert:
      issuerRef:
        kind: ClusterIssuer
        name: cluster-issuer-self-signed
      duration: 8760h
      renewBefore: 2200h

certController:
  create: false
