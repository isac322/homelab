## CRD upgrade job to avoid ServerSideApply timeout on large CRDs
##
crds:
  upgradeJob:
    enabled: true
    forceConflicts: true

nameOverride: shared

## Configuration for alertmanager
## ref: https://prometheus.io/docs/alerting/alertmanager/
##
alertmanager:
  enabled: false

## No Alertmanager: Prometheus alerts reach Telegram through the Grafana
## infra-prometheus-alerts-forwarded rule, so the Alertmanager rule group and
## the "not connected to Alertmanagers" alert are noise.
defaultRules:
  rules:
    alertmanager: false
  disabled:
    PrometheusNotConnectedToAlertmanagers: true

## Using default values from https://github.com/grafana/helm-charts/blob/main/charts/grafana/values.yaml
##
grafana:
  admin:
    existingSecret: grafana-admin-credentials
    userKey: admin-user
    passwordKey: admin-password

  alerting:
    rules.yaml:
      apiVersion: 1
      groups:
        - orgId: 1
          name: Backbone infrastructure
          folder: Infrastructure
          interval: 1m
          rules:
            - uid: infra-node-down
              title: Node exporter unavailable
              condition: B
              data:
                - refId: A
                  relativeTimeRange:
                    from: 600
                    to: 0
                  datasourceUid: prometheus
                  model:
                    datasource:
                      type: prometheus
                      uid: prometheus
                    editorMode: code
                    expr: >-
                      1 - max by (cluster, instance)
                      (up{cluster="backbone", job="node-exporter"})
                    instant: true
                    intervalMs: 60000
                    legendFormat: __auto
                    maxDataPoints: 43200
                    range: false
                    refId: A
                - refId: B
                  relativeTimeRange:
                    from: 0
                    to: 0
                  datasourceUid: __expr__
                  model:
                    conditions:
                      - evaluator:
                          params:
                            - 0.5
                          type: gt
                        operator:
                          type: and
                        query:
                          params:
                            - B
                        reducer:
                          params: []
                          type: last
                        type:
                          type: query
                    datasource:
                      type: __expr__
                      uid: __expr__
                    expression: A
                    intervalMs: 60000
                    maxDataPoints: 43200
                    refId: B
                    type: threshold
              noDataState: Alerting
              execErrState: Error
              for: 5m
              annotations:
                display_name: 노드 메트릭 수집 중단
                target: '{{`{{ $labels.instance }}`}}'
                current_value: 메트릭 수집 불가
                threshold: 5분간 node-exporter 메트릭 수집 실패
                description: 노드 연결 상태와 node-exporter 상태를 확인하세요.
                summary: backbone 노드의 메트릭 수집이 중단되었습니다.
              labels:
                severity: critical
                managed_by: gitops
              isPaused: false
            - uid: infra-node-cpu-high
              title: Node CPU usage high
              condition: B
              data:
                - refId: A
                  relativeTimeRange:
                    from: 600
                    to: 0
                  datasourceUid: prometheus
                  model:
                    datasource:
                      type: prometheus
                      uid: prometheus
                    editorMode: code
                    expr: >-
                      100 * (1 - avg by (cluster, instance)
                      (rate(node_cpu_seconds_total{cluster="backbone", mode="idle"}[5m])))
                    instant: true
                    intervalMs: 60000
                    legendFormat: __auto
                    maxDataPoints: 43200
                    range: false
                    refId: A
                - refId: B
                  relativeTimeRange:
                    from: 0
                    to: 0
                  datasourceUid: __expr__
                  model:
                    conditions:
                      - evaluator:
                          params:
                            - 90
                          type: gt
                        operator:
                          type: and
                        query:
                          params:
                            - B
                        reducer:
                          params: []
                          type: last
                        type:
                          type: query
                    datasource:
                      type: __expr__
                      uid: __expr__
                    expression: A
                    intervalMs: 60000
                    maxDataPoints: 43200
                    refId: B
                    type: threshold
              noDataState: NoData
              execErrState: Error
              for: 15m
              annotations:
                display_name: CPU 사용률 높음
                target: '{{`{{ $labels.instance }}`}}'
                current_value: '{{`{{ with $values.A }}{{ printf "%.1f%%" .Value }}{{ else }}값 없음{{ end }}`}}'
                threshold: 90% 초과 상태가 15분간 지속됨
                description: CPU를 많이 사용하는 프로세스와 워크로드를 확인하세요.
                summary: backbone 노드의 CPU 사용률이 지속적으로 높습니다.
              labels:
                severity: warning
                managed_by: gitops
              isPaused: false
            - uid: infra-node-memory-high
              title: Node memory usage high
              condition: B
              data:
                - refId: A
                  relativeTimeRange:
                    from: 600
                    to: 0
                  datasourceUid: prometheus
                  model:
                    datasource:
                      type: prometheus
                      uid: prometheus
                    editorMode: code
                    expr: >-
                      100 * (1 -
                      node_memory_MemAvailable_bytes{cluster="backbone"} /
                      node_memory_MemTotal_bytes{cluster="backbone"})
                    instant: true
                    intervalMs: 60000
                    legendFormat: __auto
                    maxDataPoints: 43200
                    range: false
                    refId: A
                - refId: B
                  relativeTimeRange:
                    from: 0
                    to: 0
                  datasourceUid: __expr__
                  model:
                    conditions:
                      - evaluator:
                          params:
                            - 90
                          type: gt
                        operator:
                          type: and
                        query:
                          params:
                            - B
                        reducer:
                          params: []
                          type: last
                        type:
                          type: query
                    datasource:
                      type: __expr__
                      uid: __expr__
                    expression: A
                    intervalMs: 60000
                    maxDataPoints: 43200
                    refId: B
                    type: threshold
              noDataState: NoData
              execErrState: Error
              for: 15m
              annotations:
                display_name: 메모리 사용률 높음
                target: '{{`{{ $labels.instance }}`}}'
                current_value: '{{`{{ with $values.A }}{{ printf "%.1f%%" .Value }}{{ else }}값 없음{{ end }}`}}'
                threshold: 90% 초과 상태가 15분간 지속됨
                description: 메모리를 많이 사용하는 프로세스와 OOM 발생 여부를 확인하세요.
                summary: backbone 노드의 메모리 사용률이 지속적으로 높습니다.
              labels:
                severity: warning
                managed_by: gitops
              isPaused: false
            - uid: infra-node-filesystem-high
              title: Node filesystem usage high
              condition: B
              data:
                - refId: A
                  relativeTimeRange:
                    from: 600
                    to: 0
                  datasourceUid: prometheus
                  model:
                    datasource:
                      type: prometheus
                      uid: prometheus
                    editorMode: code
                    expr: >-
                      100 * (1 -
                      node_filesystem_avail_bytes{cluster="backbone",
                      fstype!~"rootfs|tmpfs|overlay", mountpoint!~"/boot.*"} /
                      node_filesystem_size_bytes{cluster="backbone",
                      fstype!~"rootfs|tmpfs|overlay", mountpoint!~"/boot.*"})
                    instant: true
                    intervalMs: 60000
                    legendFormat: __auto
                    maxDataPoints: 43200
                    range: false
                    refId: A
                - refId: B
                  relativeTimeRange:
                    from: 0
                    to: 0
                  datasourceUid: __expr__
                  model:
                    conditions:
                      - evaluator:
                          params:
                            - 90
                          type: gt
                        operator:
                          type: and
                        query:
                          params:
                            - B
                        reducer:
                          params: []
                          type: last
                        type:
                          type: query
                    datasource:
                      type: __expr__
                      uid: __expr__
                    expression: A
                    intervalMs: 60000
                    maxDataPoints: 43200
                    refId: B
                    type: threshold
              noDataState: NoData
              execErrState: Error
              for: 10m
              annotations:
                display_name: 디스크 사용률 높음
                target: '{{`{{ $labels.instance }} · {{ $labels.mountpoint }}`}}'
                current_value: '{{`{{ with $values.A }}{{ printf "%.1f%%" .Value }}{{ else }}값 없음{{ end }}`}}'
                threshold: 90% 초과 상태가 10분간 지속됨
                description: 불필요한 파일, 로그 증가 및 볼륨 사용 현황을 확인하세요.
                summary: backbone 노드의 파일시스템이 거의 가득 찼습니다.
              labels:
                severity: critical
                managed_by: gitops
              isPaused: false
            - uid: infra-pod-restarting
              title: Pod container restarting frequently
              condition: B
              data:
                - refId: A
                  relativeTimeRange:
                    from: 1200
                    to: 0
                  datasourceUid: prometheus
                  model:
                    datasource:
                      type: prometheus
                      uid: prometheus
                    editorMode: code
                    expr: >-
                      sum by (cluster, namespace, pod, container)
                      (increase(kube_pod_container_status_restarts_total{
                      cluster="backbone"}[15m]))
                    instant: true
                    intervalMs: 60000
                    legendFormat: __auto
                    maxDataPoints: 43200
                    range: false
                    refId: A
                - refId: B
                  relativeTimeRange:
                    from: 0
                    to: 0
                  datasourceUid: __expr__
                  model:
                    conditions:
                      - evaluator:
                          params:
                            - 3
                          type: gt
                        operator:
                          type: and
                        query:
                          params:
                            - B
                        reducer:
                          params: []
                          type: last
                        type:
                          type: query
                    datasource:
                      type: __expr__
                      uid: __expr__
                    expression: A
                    intervalMs: 60000
                    maxDataPoints: 43200
                    refId: B
                    type: threshold
              noDataState: OK
              execErrState: Error
              for: 5m
              annotations:
                display_name: 컨테이너 반복 재시작
                target: '{{`{{ $labels.namespace }}/{{ $labels.pod }} · {{ $labels.container }}`}}'
                current_value: '{{`{{ with $values.A }}{{ printf "%.0f회" .Value }}{{ else }}값 없음{{ end }}`}}'
                threshold: 최근 15분 동안 3회 초과 재시작 후 5분간 지속됨
                description: Pod 이벤트와 이전 컨테이너 로그를 확인하세요.
                summary: Kubernetes 컨테이너가 반복해서 재시작하고 있습니다.
              labels:
                severity: warning
                managed_by: gitops
              isPaused: false
            - uid: infra-certificate-expiring
              title: Certificate expiring soon
              condition: B
              data:
                - refId: A
                  relativeTimeRange:
                    from: 600
                    to: 0
                  datasourceUid: prometheus
                  model:
                    datasource:
                      type: prometheus
                      uid: prometheus
                    editorMode: code
                    expr: >-
                      (certmanager_certificate_expiration_timestamp_seconds{
                      cluster="backbone"} - time()) / 86400
                    instant: true
                    intervalMs: 60000
                    legendFormat: __auto
                    maxDataPoints: 43200
                    range: false
                    refId: A
                - refId: B
                  relativeTimeRange:
                    from: 0
                    to: 0
                  datasourceUid: __expr__
                  model:
                    conditions:
                      - evaluator:
                          params:
                            - 14
                          type: lt
                        operator:
                          type: and
                        query:
                          params:
                            - B
                        reducer:
                          params: []
                          type: last
                        type:
                          type: query
                    datasource:
                      type: __expr__
                      uid: __expr__
                    expression: A
                    intervalMs: 60000
                    maxDataPoints: 43200
                    refId: B
                    type: threshold
              noDataState: NoData
              execErrState: Error
              for: 1h
              annotations:
                display_name: 인증서 만료 임박
                target: '{{`{{ $labels.namespace }}/{{ $labels.name }}`}}'
                current_value: '{{`{{ with $values.A }}{{ printf "%.1f일" .Value }}{{ else }}값 없음{{ end }}`}}'
                threshold: 남은 유효기간이 14일 미만인 상태가 1시간 지속됨
                description: Certificate와 CertificateRequest의 발급 상태를 확인하세요.
                summary: cert-manager 인증서의 만료일이 가까워졌습니다.
              labels:
                severity: warning
                managed_by: gitops
              isPaused: false
            - uid: infra-prometheus-wal-failure
              title: Prometheus WAL integrity failure
              condition: B
              data:
                - refId: A
                  relativeTimeRange:
                    from: 1200
                    to: 0
                  datasourceUid: prometheus
                  model:
                    datasource:
                      type: prometheus
                      uid: prometheus
                    editorMode: code
                    expr: >-
                      sum(increase(prometheus_tsdb_wal_corruptions_total{
                      cluster="backbone", job="shared-prometheus"}[15m]))
                      +
                      sum(increase(prometheus_tsdb_wal_writes_failed_total{
                      cluster="backbone", job="shared-prometheus"}[15m]))
                    instant: true
                    intervalMs: 60000
                    legendFormat: __auto
                    maxDataPoints: 43200
                    range: false
                    refId: A
                - refId: B
                  relativeTimeRange:
                    from: 0
                    to: 0
                  datasourceUid: __expr__
                  model:
                    conditions:
                      - evaluator:
                          params:
                            - 0
                          type: gt
                        operator:
                          type: and
                        query:
                          params:
                            - B
                        reducer:
                          params: []
                          type: last
                        type:
                          type: query
                    datasource:
                      type: __expr__
                      uid: __expr__
                    expression: A
                    intervalMs: 60000
                    maxDataPoints: 43200
                    refId: B
                    type: threshold
              noDataState: OK
              execErrState: Error
              for: 1m
              annotations:
                display_name: Prometheus WAL 무결성 오류
                target: Prometheus WAL
                current_value: '{{`{{ with $values.A }}{{ printf "%.0f건" .Value }}{{ else }}값 없음{{ end }}`}}'
                threshold: 최근 15분 동안 WAL 손상 또는 쓰기 실패가 1건 이상 발생
                description: Prometheus 로그와 WAL, PVC 상태를 확인하세요.
                summary: Prometheus WAL 손상 또는 쓰기 실패가 감지되었습니다.
              labels:
                severity: critical
                managed_by: gitops
              isPaused: false
            - uid: infra-thanos-compactor-halted
              title: Thanos compactor halted
              condition: B
              data:
                - refId: A
                  relativeTimeRange:
                    from: 600
                    to: 0
                  datasourceUid: prometheus
                  model:
                    datasource:
                      type: prometheus
                      uid: prometheus
                    editorMode: code
                    # A halted compactor stays up but stops compacting and
                    # downsampling until restarted; it went unnoticed from
                    # 2026-03 to 2026-10.
                    expr: >-
                      max(thanos_compact_halted{
                      cluster="backbone", job="thanos-compactor"})
                    instant: true
                    intervalMs: 60000
                    legendFormat: __auto
                    maxDataPoints: 43200
                    range: false
                    refId: A
                - refId: B
                  relativeTimeRange:
                    from: 0
                    to: 0
                  datasourceUid: __expr__
                  model:
                    conditions:
                      - evaluator:
                          params:
                            - 0
                          type: gt
                        operator:
                          type: and
                        query:
                          params:
                            - B
                        reducer:
                          params: []
                          type: last
                        type:
                          type: query
                    datasource:
                      type: __expr__
                      uid: __expr__
                    expression: A
                    intervalMs: 60000
                    maxDataPoints: 43200
                    refId: B
                    type: threshold
              noDataState: Alerting
              execErrState: Error
              for: 30m
              annotations:
                display_name: Thanos compactor 정지
                target: thanos-compactor
                current_value: '{{`{{ with $values.A }}{{ if gt .Value 0.0 }}정지{{ else }}정상{{ end }}{{ else }}메트릭 없음{{ end }}`}}'
                threshold: 30분 이상 halted 상태이거나 메트릭 수집 불가
                description: compactor 로그의 "critical error detected; halting" 원인을 확인하세요. 손상 블록이면 원본 검증 후 no-compact 표시가 필요합니다.
                summary: Thanos compactor가 멈춰 압축과 다운샘플링이 중단되었습니다.
              labels:
                severity: warning
                managed_by: gitops
              isPaused: false

            # Forwards alerts evaluated by the pillar-csi PrometheusRule
            # (apps/objects/pillar-csi/prometheusrule.yaml) to Telegram; there
            # is no Alertmanager, so Prometheus alerts would otherwise be
            # silent. Severity labels come from the forwarded ALERTS series.
            - uid: infra-pillar-pool-alerts
              title: pillar-csi storage pool alert (Prometheus-forwarded)
              condition: B
              data:
                - refId: A
                  relativeTimeRange:
                    from: 300
                    to: 0
                  datasourceUid: prometheus
                  model:
                    datasource:
                      type: prometheus
                      uid: prometheus
                    editorMode: code
                    # Grafana replaces alertname with the rule title, so the
                    # Prometheus name is kept in source_alertname. The `or`
                    # sentinel (value 0, never firing) is present whenever
                    # Prometheus is up, so an empty result means Prometheus is
                    # unreachable, not "no alerts" (see noDataState).
                    expr: >-
                      label_replace(ALERTS{cluster="backbone", alertname=~"Pillar.*",
                      alertstate="firing"}, "source_alertname", "$1", "alertname", "(.+)")
                      or on() (0 * max(up{job="shared-prometheus"}))
                    instant: true
                    intervalMs: 60000
                    legendFormat: __auto
                    maxDataPoints: 43200
                    range: false
                    refId: A
                - refId: B
                  relativeTimeRange:
                    from: 0
                    to: 0
                  datasourceUid: __expr__
                  model:
                    conditions:
                      - evaluator:
                          params:
                            - 0
                          type: gt
                        operator:
                          type: and
                        query:
                          params:
                            - B
                        reducer:
                          params: []
                          type: last
                        type:
                          type: query
                    datasource:
                      type: __expr__
                      uid: __expr__
                    expression: A
                    intervalMs: 60000
                    maxDataPoints: 43200
                    refId: B
                    type: threshold
              # KeepLast: the query is empty only while Prometheus (and its
              # sidecar) is unreachable; keep the forwarded alerts as they were
              # instead of resolving them all and re-firing them on recovery.
              noDataState: KeepLast
              execErrState: KeepLast
              for: 1m
              annotations:
                display_name: pillar-csi 스토리지 풀 알림
                target: '{{`{{ $labels.source_alertname }}{{ with $labels.name }} · {{ . }}{{ end }}`}}'
                current_value: '{{`severity={{ $labels.severity }}, firing`}}'
                threshold: Prometheus Pillar* 규칙이 firing 상태임
                description: pillar-csi PrometheusRule이 발행한 알림을 전달합니다. 스토리지 노드에서 `zfs list -o name,used,avail -r <pool>/k8s`로 가용 공간을 확인하고, 사용하지 않는 볼륨(PVC)을 삭제하거나 thick 예약을 줄이세요.
                summary: ZFS 스토리지 풀 용량 관련 알림이 발생했습니다.
              labels:
                managed_by: gitops
              isPaused: false

            # Forwards alerts evaluated by the storage-integrity PrometheusRule
            # (apps/objects/storage-integrity/prometheusrule.yaml, isac322/homelab#385)
            # to Telegram. Severity labels come from the forwarded ALERTS series.
            - uid: infra-storage-integrity-alerts
              title: Storage integrity alert (Prometheus-forwarded)
              condition: B
              data:
                - refId: A
                  relativeTimeRange:
                    from: 300
                    to: 0
                  datasourceUid: prometheus
                  model:
                    datasource:
                      type: prometheus
                      uid: prometheus
                    editorMode: code
                    # Grafana replaces alertname with the rule title, so the
                    # Prometheus name is kept in source_alertname. The `or`
                    # sentinel (value 0, never firing) is present whenever
                    # Prometheus is up, so an empty result means Prometheus is
                    # unreachable, not "no alerts" (see noDataState).
                    expr: >-
                      label_replace(ALERTS{cluster="backbone", alertname=~"StorageIntegrity.*",
                      alertstate="firing"}, "source_alertname", "$1", "alertname", "(.+)")
                      or on() (0 * max(up{job="shared-prometheus"}))
                    instant: true
                    intervalMs: 60000
                    legendFormat: __auto
                    maxDataPoints: 43200
                    range: false
                    refId: A
                - refId: B
                  relativeTimeRange:
                    from: 0
                    to: 0
                  datasourceUid: __expr__
                  model:
                    conditions:
                      - evaluator:
                          params:
                            - 0
                          type: gt
                        operator:
                          type: and
                        query:
                          params:
                            - B
                        reducer:
                          params: []
                          type: last
                        type:
                          type: query
                    datasource:
                      type: __expr__
                      uid: __expr__
                    expression: A
                    intervalMs: 60000
                    maxDataPoints: 43200
                    refId: B
                    type: threshold
              # KeepLast: the query is empty only while Prometheus (and its
              # sidecar) is unreachable; keep the forwarded alerts as they were
              # instead of resolving them all and re-firing them on recovery.
              noDataState: KeepLast
              execErrState: KeepLast
              for: 1m
              annotations:
                display_name: 스토리지 무결성 알림
                target: '{{`{{ $labels.source_alertname }}{{ with $labels.arm }} · {{ . }}{{ end }}{{ with $labels.pod }} · {{ . }}{{ end }}`}}'
                current_value: '{{`severity={{ $labels.severity }}, firing`}}'
                threshold: Prometheus StorageIntegrity* 규칙이 firing 상태임
                description: 데이터가 조용히 손상되었을 수 있습니다(isac322/homelab#385). 커널 로그가 며칠 안에 지워지므로 바로 확인하세요. 에이전트에게는 이 메시지를 그대로 전달하면 docs/storage-integrity.md의 "이어받기" 절부터 분석을 이어갑니다. https://github.com/isac322/homelab/blob/master/docs/storage-integrity.md
                summary: 스토리지 데이터 무결성(손상 의심) 알림이 발생했습니다.
              labels:
                managed_by: gitops
              isPaused: false

            # Forwards every other Prometheus alert (kube-prometheus-stack
            # defaultRules, CNPG, etcd, ...) to Telegram; there is no
            # Alertmanager. Excluded names: Watchdog/InfoInhibitor are always
            # firing by design; PrometheusNotConnectedToAlertmanagers is expected
            # without Alertmanager; Pillar*/StorageIntegrity* have the dedicated
            # forwarders above; KubePodCrashLooping, NodeMemoryHighUtilization and
            # NodeFilesystemAlmostOutOfSpace duplicate infra-pod-restarting,
            # infra-node-memory-high and infra-node-filesystem-high; the
            # Kube*Overcommit alerts flap (71 firing episodes in 14d).
            # Grafana replaces the query's alertname with this rule's title, so
            # the Prometheus name is copied to source_alertname first. The `or`
            # sentinel works as in infra-pillar-pool-alerts.
            - uid: infra-prometheus-alerts-forwarded
              title: Prometheus alert (forwarded)
              condition: B
              data:
                - refId: A
                  relativeTimeRange:
                    from: 300
                    to: 0
                  datasourceUid: prometheus
                  model:
                    datasource:
                      type: prometheus
                      uid: prometheus
                    editorMode: code
                    expr: >-
                      label_replace(ALERTS{cluster="backbone", alertstate="firing",
                      severity=~"critical|warning",
                      alertname!~"Watchdog|InfoInhibitor|PrometheusNotConnectedToAlertmanagers|Pillar.*|StorageIntegrity.*|KubePodCrashLooping|NodeMemoryHighUtilization|NodeFilesystemAlmostOutOfSpace|KubeMemoryOvercommit|KubeCPUOvercommit"},
                      "source_alertname", "$1", "alertname", "(.+)")
                      or on() (0 * max(up{job="shared-prometheus"}))
                    instant: true
                    intervalMs: 60000
                    legendFormat: __auto
                    maxDataPoints: 43200
                    range: false
                    refId: A
                - refId: B
                  relativeTimeRange:
                    from: 0
                    to: 0
                  datasourceUid: __expr__
                  model:
                    conditions:
                      - evaluator:
                          params:
                            - 0
                          type: gt
                        operator:
                          type: and
                        query:
                          params:
                            - B
                        reducer:
                          params: []
                          type: last
                        type:
                          type: query
                    datasource:
                      type: __expr__
                      uid: __expr__
                    expression: A
                    intervalMs: 60000
                    maxDataPoints: 43200
                    refId: B
                    type: threshold
              # KeepLast: see infra-pillar-pool-alerts.
              noDataState: KeepLast
              execErrState: KeepLast
              for: 1m
              annotations:
                display_name: '{{`Prometheus 알림 · {{ $labels.source_alertname }}`}}'
                target: '{{`{{ $labels.source_alertname }}{{ with $labels.namespace }} · {{ . }}{{ end }}{{ with $labels.job }} · {{ . }}{{ end }}{{ with $labels.pod }} · {{ . }}{{ end }}`}}'
                current_value: '{{`severity={{ $labels.severity }}, firing`}}'
                threshold: Prometheus 규칙의 for 조건을 넘겨 firing 상태임
                description: '{{`Prometheus 규칙 {{ $labels.source_alertname }}이 발행한 알림을 전달합니다. 규칙 설명과 런북: https://prometheus.bhyoo.com/alerts?search={{ $labels.source_alertname }}`}}'
                summary: Prometheus 알림이 발생했습니다.
              labels:
                managed_by: gitops
              isPaused: false

            # Loki and Alloy: up is guarded by "any backbone target is up", so a
            # Prometheus/Thanos gap (every series missing) does not page as an
            # outage. kube-state-metrics shares node n2p1 with loki-0, so it
            # cannot be the guard.
            - uid: infra-loki-unavailable
              title: Loki unavailable
              condition: B
              data:
                - refId: A
                  relativeTimeRange:
                    from: 600
                    to: 0
                  datasourceUid: prometheus
                  model:
                    datasource:
                      type: prometheus
                      uid: prometheus
                    editorMode: code
                    expr: >-
                      max(up{cluster="backbone", job="loki/loki"})
                      or on() (vector(0) and on()
                      count(up{cluster="backbone"} == 1))
                    instant: true
                    intervalMs: 60000
                    legendFormat: __auto
                    maxDataPoints: 43200
                    range: false
                    refId: A
                - refId: B
                  relativeTimeRange:
                    from: 0
                    to: 0
                  datasourceUid: __expr__
                  model:
                    conditions:
                      - evaluator:
                          params:
                            - 1
                          type: lt
                        operator:
                          type: and
                        query:
                          params:
                            - B
                        reducer:
                          params: []
                          type: last
                        type:
                          type: query
                    datasource:
                      type: __expr__
                      uid: __expr__
                    expression: A
                    intervalMs: 60000
                    maxDataPoints: 43200
                    refId: B
                    type: threshold
              noDataState: OK
              execErrState: Error
              for: 5m
              annotations:
                display_name: Loki 중단
                target: loki/loki-0
                current_value: '{{`{{ with $values.A }}{{ if gt .Value 0.0 }}정상{{ else }}수집 불가{{ end }}{{ else }}메트릭 없음{{ end }}`}}'
                threshold: 5분간 Loki 메트릭 수집 실패
                description: Alloy는 Loki가 복구될 때까지 30초 간격으로 계속 재시도하므로 보낸 로그는 버리지 않지만, 그동안 수집이 멈춰 kubelet 로그 회전(10Mi)이 지나간 로그는 유실됩니다(바쁜 Pod 기준 약 1시간). loki-0 Pod 상태, PVC(storage-loki-0) attach, 이벤트를 확인하세요. Loki가 멈춘 동안 Alloy를 재시작하지 마세요.
                summary: Loki가 응답하지 않아 로그 수집이 중단되었습니다.
              labels:
                severity: critical
                managed_by: gitops
              isPaused: false
            - uid: infra-alloy-unavailable
              title: Alloy unavailable
              condition: B
              data:
                - refId: A
                  relativeTimeRange:
                    from: 600
                    to: 0
                  datasourceUid: prometheus
                  model:
                    datasource:
                      type: prometheus
                      uid: prometheus
                    editorMode: code
                    expr: >-
                      max(up{cluster="backbone", job="alloy"})
                      or on() (vector(0) and on()
                      count(up{cluster="backbone"} == 1))
                    instant: true
                    intervalMs: 60000
                    legendFormat: __auto
                    maxDataPoints: 43200
                    range: false
                    refId: A
                - refId: B
                  relativeTimeRange:
                    from: 0
                    to: 0
                  datasourceUid: __expr__
                  model:
                    conditions:
                      - evaluator:
                          params:
                            - 1
                          type: lt
                        operator:
                          type: and
                        query:
                          params:
                            - B
                        reducer:
                          params: []
                          type: last
                        type:
                          type: query
                    datasource:
                      type: __expr__
                      uid: __expr__
                    expression: A
                    intervalMs: 60000
                    maxDataPoints: 43200
                    refId: B
                    type: threshold
              noDataState: OK
              execErrState: Error
              for: 5m
              annotations:
                display_name: Alloy 로그 수집 중단
                target: kube-system/alloy-0
                current_value: '{{`{{ with $values.A }}{{ if gt .Value 0.0 }}정상{{ else }}수집 불가{{ end }}{{ else }}메트릭 없음{{ end }}`}}'
                threshold: 5분간 Alloy 메트릭 수집 실패
                description: Alloy가 멈추면 모든 Pod 로그 수집이 중단되고, 늦게 복구되면 kubelet 로그 회전(10Mi)이 지나간 로그는 유실됩니다. 재시작 시 메모리 큐에 있던 배치(최대 10MiB)도 사라집니다. alloy-0 Pod 상태, PVC(alloy-data-alloy-0) attach, 이벤트를 확인하세요.
                summary: Alloy가 응답하지 않아 로그 수집이 중단되었습니다.
              labels:
                severity: critical
                managed_by: gitops
              isPaused: false
            - uid: infra-loki-pvc-usage-high
              title: Loki PVC usage high
              condition: B
              data:
                - refId: A
                  relativeTimeRange:
                    from: 600
                    to: 0
                  datasourceUid: prometheus
                  model:
                    datasource:
                      type: prometheus
                      uid: prometheus
                    editorMode: code
                    expr: >-
                      100 * max by (namespace, persistentvolumeclaim)
                      (kubelet_volume_stats_used_bytes{cluster="backbone",
                      namespace="loki", persistentvolumeclaim="storage-loki-0"}) /
                      max by (namespace, persistentvolumeclaim)
                      (kubelet_volume_stats_capacity_bytes{cluster="backbone",
                      namespace="loki", persistentvolumeclaim="storage-loki-0"})
                    instant: true
                    intervalMs: 60000
                    legendFormat: __auto
                    maxDataPoints: 43200
                    range: false
                    refId: A
                - refId: B
                  relativeTimeRange:
                    from: 0
                    to: 0
                  datasourceUid: __expr__
                  model:
                    conditions:
                      - evaluator:
                          params:
                            - 80
                          type: gt
                        operator:
                          type: and
                        query:
                          params:
                            - B
                        reducer:
                          params: []
                          type: last
                        type:
                          type: query
                    datasource:
                      type: __expr__
                      uid: __expr__
                    expression: A
                    intervalMs: 60000
                    maxDataPoints: 43200
                    refId: B
                    type: threshold
              # OK: kubelet volume stats vanish while loki-0 is rescheduled.
              noDataState: OK
              execErrState: Error
              for: 15m
              annotations:
                display_name: Loki 볼륨 사용률 높음
                target: '{{`{{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }}`}}'
                current_value: '{{`{{ with $values.A }}{{ printf "%.1f%%" .Value }}{{ else }}값 없음{{ end }}`}}'
                threshold: 80% 초과 상태가 15분간 지속됨
                description: retention(8760h)과 compactor 상태를 확인하고, PVC 확장 또는 retention 축소를 검토하세요.
                summary: Loki 저장 볼륨이 가득 차고 있습니다.
              labels:
                severity: warning
                managed_by: gitops
              isPaused: false
            # increase() instead of the last-success timestamp: that gauge is 0 for
            # ~10 min after every Loki restart.
            - uid: infra-loki-retention-stalled
              title: Loki compactor retention stalled
              condition: B
              data:
                - refId: A
                  relativeTimeRange:
                    from: 10800
                    to: 0
                  datasourceUid: prometheus
                  model:
                    datasource:
                      type: prometheus
                      uid: prometheus
                    editorMode: code
                    expr: >-
                      sum(increase(loki_compactor_apply_retention_operation_total{
                      cluster="backbone", namespace="loki", status="success"}[3h]))
                      or on() (vector(0) and on()
                      max(up{cluster="backbone", job="loki/loki"} == 1))
                    instant: true
                    intervalMs: 60000
                    legendFormat: __auto
                    maxDataPoints: 43200
                    range: false
                    refId: A
                - refId: B
                  relativeTimeRange:
                    from: 0
                    to: 0
                  datasourceUid: __expr__
                  model:
                    conditions:
                      - evaluator:
                          params:
                            - 1
                          type: lt
                        operator:
                          type: and
                        query:
                          params:
                            - B
                        reducer:
                          params: []
                          type: last
                        type:
                          type: query
                    datasource:
                      type: __expr__
                      uid: __expr__
                    expression: A
                    intervalMs: 60000
                    maxDataPoints: 43200
                    refId: B
                    type: threshold
              # OK: Loki being down is reported by infra-loki-unavailable.
              noDataState: OK
              execErrState: Error
              for: 30m
              annotations:
                display_name: Loki 보존 정책 정지
                target: loki/loki-0 compactor
                current_value: '{{`{{ with $values.A }}{{ printf "최근 3시간 성공 %.0f회" .Value }}{{ else }}값 없음{{ end }}`}}'
                threshold: 3시간 동안 retention 성공 0회가 30분간 지속됨
                description: loki-0 로그에서 compactor 오류를 확인하세요. retention이 멈추면 PVC 사용량이 계속 증가합니다.
                summary: Loki compactor가 오래된 로그를 삭제하지 못하고 있습니다.
              labels:
                severity: warning
                managed_by: gitops
              isPaused: false
            # Alloy is the only pusher. 5xx, 429 and -1 (connection error) responses
            # are retried at most 30s apart with no retry limit (loki.write
            # max_backoff_retries = 0), so a failure blocks all log shipping until
            # it clears. Also covers loki-gateway outages while loki-0 is up.
            - uid: infra-loki-push-failing
              title: Alloy log push to Loki failing
              condition: B
              data:
                - refId: A
                  relativeTimeRange:
                    from: 600
                    to: 0
                  datasourceUid: prometheus
                  model:
                    datasource:
                      type: prometheus
                      uid: prometheus
                    editorMode: code
                    expr: >-
                      sum(increase(loki_write_request_duration_seconds_count{
                      cluster="backbone", status_code=~"5..|429|-1"}[5m]))
                      or on() vector(0)
                    instant: true
                    intervalMs: 60000
                    legendFormat: __auto
                    maxDataPoints: 43200
                    range: false
                    refId: A
                - refId: B
                  relativeTimeRange:
                    from: 0
                    to: 0
                  datasourceUid: __expr__
                  model:
                    conditions:
                      - evaluator:
                          params:
                            - 0
                          type: gt
                        operator:
                          type: and
                        query:
                          params:
                            - B
                        reducer:
                          params: []
                          type: last
                        type:
                          type: query
                    datasource:
                      type: __expr__
                      uid: __expr__
                    expression: A
                    intervalMs: 60000
                    maxDataPoints: 43200
                    refId: B
                    type: threshold
              noDataState: OK
              execErrState: Error
              for: 5m
              annotations:
                display_name: Loki 로그 전송 실패
                target: alloy → loki-gateway
                current_value: '{{`{{ with $values.A }}{{ printf "최근 5분 실패 %.0f건" .Value }}{{ else }}값 없음{{ end }}`}}'
                threshold: 5xx/429/연결 오류가 5분 이상 지속됨
                description: Alloy가 최대 30초 간격으로 무기한 재시도하는 동안 모든 로그 전송이 멈춥니다. 길어지면 kubelet 로그 회전(10Mi)으로 유실됩니다. loki-gateway, loki-0 상태와 Alloy 로그를 확인하세요. Loki가 멈춘 동안 Alloy를 재시작하지 마세요.
                summary: Alloy가 Loki로 로그를 전송하지 못하고 있습니다.
              labels:
                severity: critical
                managed_by: gitops
              isPaused: false
    templates.yaml:
      apiVersion: 1
      templates:
        - orgId: 1
          name: telegram-korean
          template: |
            {{`{{ define "telegram.message.ko" }}
            {{ if gt (len .Alerts.Firing) 0 }}
            {{ $first := index .Alerts.Firing 0 }}
            {{ $name := or (index $first.Annotations "display_name") (index $first.Labels "alertname") }}
            {{ $severity := index $first.Labels "severity" }}
            {{ if eq (index $first.Labels "test_alert") "true" }}🧪 <b>테스트 · {{ html $name }}</b>
            {{ else if eq $severity "critical" }}🚨 <b>심각 · {{ html $name }}</b>
            {{ else if eq $severity "warning" }}⚠️ <b>경고 · {{ html $name }}</b>
            {{ else }}ℹ️ <b>알림 · {{ html $name }}</b>
            {{ end }}
            {{ if gt (len .Alerts.Firing) 1 }}발생 대상: <b>{{ len .Alerts.Firing }}개</b>
            {{ end }}
            {{ range $index, $alert := .Alerts.Firing }}
            {{ if ge $index 5 }}{{ break }}{{ end }}
            {{ if gt $index 0 }}
            {{ end }}<b>대상</b>
            <code>{{ html (or (index $alert.Annotations "target") "대상 미확인") }}</code>

            <b>현재 상태</b>
            {{ html (or (index $alert.Annotations "current_value") "값 없음") }}

            <b>발생 기준</b>
            {{ html (or (index $alert.Annotations "threshold") "기준 정보 없음") }}

            <b>설명</b>
            {{ html (or (index $alert.Annotations "description") (index $alert.Annotations "summary") "설명 없음") }}

            <b>발생 시각</b>
            {{ $alert.StartsAt | tz "Asia/Seoul" | date "2006-01-02 15:04 MST" }}
            {{ end }}
            {{ if gt (len .Alerts.Firing) 5 }}
            총 {{ len .Alerts.Firing }}건 중 상위 5건만 표시했습니다.
            {{ end }}
            {{ if $first.GeneratorURL }}<a href="{{ html $first.GeneratorURL }}">Grafana에서 보기</a>{{ end }}{{ if $first.SilenceURL }} · <a href="{{ html $first.SilenceURL }}">알림 일시 중지</a>{{ end }}
            {{ end }}

            {{ if gt (len .Alerts.Resolved) 0 }}
            {{ $first := index .Alerts.Resolved 0 }}
            {{ $name := or (index $first.Annotations "display_name") (index $first.Labels "alertname") }}
            {{ if eq (index $first.Labels "test_alert") "true" }}🧪 <b>테스트 정상화 · {{ html $name }}</b>
            {{ else }}✅ <b>정상화 · {{ html $name }}</b>
            {{ end }}
            {{ if gt (len .Alerts.Resolved) 1 }}정상화 대상: <b>{{ len .Alerts.Resolved }}개</b>
            {{ end }}
            {{ range $index, $alert := .Alerts.Resolved }}
            {{ if ge $index 5 }}{{ break }}{{ end }}
            {{ if gt $index 0 }}
            {{ end }}<b>대상</b>
            <code>{{ html (or (index $alert.Annotations "target") "대상 미확인") }}</code>

            <b>현재 상태</b>
            {{ html (or (index $alert.Annotations "current_value") "정상 범위") }}

            <b>발생 시각</b>
            {{ $alert.StartsAt | tz "Asia/Seoul" | date "2006-01-02 15:04 MST" }}

            <b>정상화 시각</b>
            {{ $alert.EndsAt | tz "Asia/Seoul" | date "2006-01-02 15:04 MST" }}
            {{ end }}
            {{ if gt (len .Alerts.Resolved) 5 }}
            총 {{ len .Alerts.Resolved }}건 중 상위 5건만 표시했습니다.
            {{ end }}
            {{ if $first.GeneratorURL }}<a href="{{ html $first.GeneratorURL }}">Grafana에서 보기</a>{{ end }}
            {{ end }}
            {{ end }}`}}

  grafana.ini:
    date_formats:
      default_timezone: Asia/Seoul
    # Literal URL: without it Grafana builds http://grafana.bhyoo.com:3000/
    # links (Telegram GeneratorURL/SilenceURL), which the HTTPS-only gateway
    # does not serve.
    server:
      root_url: https://grafana.bhyoo.com/
    # TLS terminates at the gateway, so browsers only ever see HTTPS.
    security:
      cookie_secure: true
      disable_gravatar: true
    analytics:
      reporting_enabled: false
      check_for_updates: false
      check_for_plugin_updates: false
      feedback_links_enabled: false
    snapshots:
      external_enabled: false
    # Quiet the two noisiest info loggers without hiding ngalert state lines.
    log:
      filters: 'plugin.prometheus:warn plugins.update.checker:warn'
    # WAL mode avoids the SQLITE_BUSY "database is locked" write contention.
    database:
      wal: true

  # Dashboards, rules, datasources and contact points are provisioned from
  # git; the PVC keeps alert instance state, the notification log, silences
  # and state-history annotations across restarts, so firing alerts are not
  # re-sent on every rollout.
  persistence:
    enabled: true
    type: pvc
    storageClassName: ssd-ha
    accessModes:
      - ReadWriteOnce
    size: 2Gi
  # The volume is RWO, so the old pod must stop before the new one starts.
  # maxSurge 0 does that with one replica; switching type to Recreate would
  # fail server-side apply because the API server keeps the defaulted
  # rollingUpdate block.
  deploymentStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  # The pod's fsGroup 472 already makes the new volume writable; the chart's
  # chown init container would add a busybox image pinned only by tag.
  initChownData:
    enabled: false

  ## Timezone for the default dashboards
  ## Other options are: browser or a specific timezone, i.e. Europe/Luxembourg
  ##
  defaultDashboardsTimezone: Asia/Seoul

  ingress:
    enabled: false
    ingressClassName: traefik

    annotations:
      external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
      cert-manager.io/cluster-issuer: cluster-issuer-acme
      cert-manager.io/private-key-algorithm: ECDSA
      cert-manager.io/private-key-size: '384'
      traefik.ingress.kubernetes.io/router.entrypoints: websecure

    hosts:
      - grafana.bhyoo.com

    ## Path for grafana ingress
    path: /

    tls:
      - secretName: grafana-general-tls
        hosts:
          - grafana.bhyoo.com

  route:
    main:
      enabled: true
      hostnames:
        - grafana.bhyoo.com
      parentRefs:
        - name: bhyoo-gateway
          namespace: ingress-ctrl
          sectionName: https

  resources:
    requests:
      cpu: 150m
      # 14d working set P50 293Mi, P99 418Mi, max 465Mi (AGENTS.md: request
      # 1.20x P50, limit 1.24x max; the old 480Mi limit was 1.03x max).
      memory: 352Mi
    limits:
      memory: 576Mi
  downloadDashboards:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 64Mi

  sidecar:
    image:
      tag: 2.11.2
      sha: 2912be006f62f9ea080194cf6d3afcd90daead8d101d0ba686a137a849f6a4f6
    resources:
      requests:
        cpu: 5m
        memory: 112Mi
      limits:
        memory: 128Mi
    alerts:
      enabled: true
      label: grafana_alert
      labelValue: "1"
      resource: secret
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      # Allow discovery in all namespaces for dashboards
      searchNamespace: ALL

      multicluster:
        global:
          enabled: true
        etcd:
          enabled: true
    datasources:
      enabled: true
      defaultDatasourceEnabled: false

      label: grafana_datasource
      labelValue: "1"

      alertmanager:
        enabled: false

  additionalDataSources:
    - name: Thanos
      uid: prometheus
      type: prometheus
      access: proxy
      url: http://thanos-query-frontend.prometheus.svc.cluster.local:9090
      isDefault: true
      editable: true
      jsonData:
        httpMethod: POST
        timeInterval: 30s
        timeout: 120
        # Lets Grafana use the Thanos-specific API behaviour.
        prometheusType: Thanos
        # Auto-refreshing dashboards re-query only the newest part of the
        # range; 10m overlap re-reads samples that land late (OOO window 1h,
        # but in practice only cAdvisor during kubelet flaps).
        incrementalQuerying: true
        incrementalQueryOverlapWindow: 10m
    - name: Loki
      uid: loki
      type: loki
      access: proxy
      url: http://loki-gateway.loki.svc.cluster.local
      isDefault: false
      editable: true
      jsonData:
        timeout: 120
        maxLines: 5000
        # /loki/api/v1/drilldown-limits skips the fake-auth middleware and
        # returns 401 without a tenant header; every other route already
        # forces tenant "fake" (auth_enabled: false).
        httpHeaderName1: X-Scope-OrgID
      secureJsonData:
        httpHeaderValue1: fake

  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: community
          orgId: 1
          folder: Community
          type: file
          disableDeletion: true
          editable: false
          options:
            path: /var/lib/grafana/dashboards/community

  dashboards:
    community:
      node-exporter-full:
        gnetId: 1860
        revision: 42
        datasource: Prometheus
      argocd:
        gnetId: 19993
        revision: 7
        datasource: Prometheus
      cert-manager:
        gnetId: 20842
        revision: 3
        datasource: Prometheus
      loki:
        gnetId: 17781
        revision: 1
        datasource: Prometheus
      immich:
        gnetId: 22555
        revision: 1
        datasource: Prometheus
      external-dns:
        gnetId: 23969
        revision: 1
        datasource: Prometheus
      thanos-query-frontend:
        url: https://raw.githubusercontent.com/thanos-io/thanos/main/examples/dashboards/query-frontend.json
        datasource: Prometheus
      thanos-sidecar:
        url: https://raw.githubusercontent.com/thanos-io/thanos/main/examples/dashboards/sidecar.json
        datasource: Prometheus
