## Only Linux nodes run node-exporter; skip the AIX/Darwin dashboards.
nodeExporter:
  operatingSystems:
    aix:
      enabled: false
    darwin:
      enabled: false

## In K3s, apiserver /metrics exposes kubelet metrics (single binary).
## Drop only kubelet-specific metrics (already scraped via kubelet job).
## Keep scheduler/proxy/k3s metrics here since their standalone scrapes are disabled.
kubeApiServer:
  serviceMonitor:
    metricRelabelings:
      - sourceLabels: [__name__]
        regex: kubelet_.*|volume_manager_.*|volume_operation_.*|storage_operation_.*|csi_operations_.*|plugin_manager_.*|reconstruct_volume_.*|dra_operations_.*|dra_resource_.*
        action: drop
      ## Histogram buckets are ~80% of the apiserver job's head series. The
      ## only buckets any loaded rule or provisioned dashboard reads from
      ## job="apiserver" are the SLO source and the apiserver dashboard's
      ## workqueue panel; mark those, then drop every other *_bucket series
      ## (apiserver_request_duration_seconds_bucket,
      ## etcd_request_duration_seconds_bucket, apiserver_response_sizes_bucket,
      ## flowcontrol/rest_client/scheduler buckets, etc. ~95k series). The
      ## cert-expiry alert needs its histogram too.
      - sourceLabels: [__name__]
        regex: apiserver_request_sli_duration_seconds_bucket|apiserver_client_certificate_expiration_seconds_bucket|workqueue_queue_duration_seconds_bucket
        targetLabel: __tmp_bucket_keep
        replacement: keep
        # Written explicitly: the operator defaults action=replace on the live
        # ServiceMonitor; omitting it leaves the app permanently OutOfSync.
        action: replace
      - sourceLabels: [__name__, __tmp_bucket_keep]
        separator: ';'
        regex: .+_bucket;
        action: drop

## Component scraping the kubelet and kubelet-hosted cAdvisor
##
kubelet:
  serviceMonitor:
    attachMetadata:
      node: true

    # up is synthetic, so the scrapeClass metricRelabelings never label it
    # with cluster and KubeletDown's "unless on (cluster)" join always fires.
    # Setting this key replaces the chart default, so its metrics_path
    # relabeling is repeated here.
    relabelings:
      - action: replace
        sourceLabels: [__metrics_path__]
        targetLabel: metrics_path
      - action: replace
        targetLabel: cluster
        replacement: backbone

    cAdvisorInterval: 30s
    # Chart defaults (91.8.2) copied verbatim because setting this key replaces
    # them; re-sync on chart upgrades. The last rule drops cAdvisor series that
    # no loaded rule or provisioned dashboard reads.
    cAdvisorMetricRelabelings:
      # Drop less useful container CPU metrics.
      - sourceLabels: [__name__]
        action: drop
        regex: 'container_cpu_(cfs_throttled_seconds_total|load_average_10s|system_seconds_total|user_seconds_total)'
      # Drop less useful container / always zero filesystem metrics.
      - sourceLabels: [__name__]
        action: drop
        regex: 'container_fs_(io_current|io_time_seconds_total|io_time_weighted_seconds_total|reads_merged_total|sector_reads_total|sector_writes_total|writes_merged_total)'
      # Drop less useful / always zero container memory metrics.
      - sourceLabels: [__name__]
        action: drop
        regex: 'container_memory_(mapped_file|swap)'
      # Drop less useful container process metrics.
      - sourceLabels: [__name__]
        action: drop
        regex: 'container_(file_descriptors|tasks_state|threads_max)'
      # Drop container_memory_failures_total{scope="hierarchy"} metrics,
      # we only need the container scope.
      - sourceLabels: [__name__, scope]
        action: drop
        regex: 'container_memory_failures_total;hierarchy'
      # Drop container_network_... metrics that match various interfaces that
      # correspond to CNI and similar interfaces. This avoids capturing network
      # metrics for host network containers.
      - sourceLabels: [__name__, interface]
        action: drop
        regex: 'container_network_.*;(cali|cilium|cni|lxc|nodelocaldns|tunl).*'
      # Drop container spec metrics that overlap with kube-state-metrics.
      - sourceLabels: [__name__]
        action: drop
        regex: 'container_spec.*'
      # Drop cgroup metrics with no pod.
      - sourceLabels: [id, pod]
        action: drop
        regex: '.+;'
      # Local addition: unused by every rule and dashboard.
      - sourceLabels: [__name__]
        action: drop
        regex: 'container_(blkio_device_usage_total|memory_failures_total|last_seen|memory_kernel_usage|health_state|cpu_load_d_average_10s|memory_max_usage_bytes|memory_failcnt)'

    ## In K3s, kubelet /metrics exposes all control-plane metrics (single binary).
    ## Drop non-kubelet metrics to avoid duplication with apiserver/scheduler/proxy scrapes.
    metricRelabelings:
      - sourceLabels: [__name__]
        regex: apiserver_.*|apiextensions_.*|aggregator_.*|authenticated_.*|authentication_.*|authorization_.*|etcd_.*|grpc_client_.*|scheduler_.*|kubeproxy_.*|kube_apiserver_.*|kube_router_.*|node_authorizer_.*|node_collector_.*|node_controller_.*|serviceaccount_.*|watch_cache_.*|field_validation_.*|force_cleaned_.*|pod_security_.*|session_server_.*|lasso_.*
        action: drop

## K3s bundles all control plane components into a single binary, so
## kube-proxy, kube-controller-manager, and kube-scheduler do not expose
## separate metrics endpoints. Their metrics are already collected via the
## apiserver job.
kubeProxy:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false

## etcd metrics are scraped via additionalScrapeConfigs (node SD) instead of
## the default ServiceMonitor, because K3s has no component=etcd Pod.
## Keep kubeEtcd enabled for the dashboard and alert rules only.
kubeEtcd:
  enabled: true
  service:
    enabled: false
  serviceMonitor:
    enabled: false

## Configuration for kube-state-metrics subchart
##
kube-state-metrics:
  resources:
    requests:
      cpu: 15m
      # Since 2026-10-04 the daily P50 is 83-86Mi (raw 14d max 117Mi), so the
      # older 35Mi regime is ignored. AGENTS.md: request 1.22x P50, limit
      # 1.23x max (the old 120Mi limit was 0.98x max).
      memory: 104Mi
    limits:
      memory: 144Mi

  # PillarStore.status.capacity is the freshest capacity view reachable on
  # the pod network (the controller syncs it from the agent every ~30s).
  # The pillar-csi agent/node /metrics ports are unreachable behind the
  # rock5bp host firewall, so customResourceState is the capacity source
  # for the PillarStore* alerts in apps/objects/pillar-csi/prometheusrule.yaml.
  customResourceState:
    enabled: true
    config:
      spec:
        resources:
          - groupVersionKind:
              group: pillar-csi.bhyoo.com
              version: v1alpha1
              kind: PillarStore
            metricNamePrefix: pillar_csi_store
            labelsFromPath:
              name: [metadata, name]
              namespace: [metadata, namespace]
            metrics:
              - name: capacity_total_bytes
                help: Allocatable + used bytes at the store's provisioning boundary (PillarStore.status.capacity.total).
                each:
                  type: Gauge
                  gauge:
                    path: [status, capacity, total]
              - name: capacity_available_bytes
                help: Bytes still allocatable at the store's provisioning boundary (PillarStore.status.capacity.available).
                each:
                  type: Gauge
                  gauge:
                    path: [status, capacity, available]

  rbac:
    extraRules:
      - apiGroups: ["pillar-csi.bhyoo.com"]
        resources: ["pillarstores"]
        verbs: ["list", "watch"]

## Configuration for prometheus-node-exporter subchart
##
prometheus-node-exporter:
  nameOverride: node-exporter
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 76Mi

## Manages Prometheus and Alertmanager components
##
prometheusOperator:

  admissionWebhooks:
    annotations:
      argocd.argoproj.io/hook: PreSync
      argocd.argoproj.io/hook-delete-policy: HookSucceeded

    # Use certmanager to generate webhook certs
    certManager:
      enabled: true
      issuerRef:
        kind: ClusterIssuer
        name: cluster-issuer-self-signed

  resources:
    requests:
      cpu: 10m
      memory: 48Mi
    limits:
      memory: 96Mi

  prometheusConfigReloader:
    resources:
      requests:
        cpu: 5m
        memory: 20Mi
      limits:
        memory: 48Mi

## Deploy a Prometheus instance
##
prometheus:
  ingress:
    enabled: false
    ingressClassName: traefik

    annotations:
      cert-manager.io/cluster-issuer: cluster-issuer-acme
      cert-manager.io/private-key-algorithm: ECDSA
      cert-manager.io/private-key-size: '384'
      traefik.ingress.kubernetes.io/router.entrypoints: websecure

    hosts:
      - prometheus.bhyoo.com

    tls:
      - secretName: prometheus-general-tls
        hosts:
          - prometheus.bhyoo.com

  route:
    main:
      enabled: true
      hostnames:
        - prometheus.bhyoo.com
      parentRefs:
        - name: bhyoo-gateway
          namespace: ingress-ctrl
          sectionName: https

  # Expose and scrape the Thanos sidecar so the Thanos/Sidecar dashboard has
  # data. Its queries select job=~".*thanos-sidecar.*", so the job label is
  # pinned instead of using the generated Service name.
  thanosService:
    enabled: true
  thanosServiceMonitor:
    enabled: true
    relabelings:
      - targetLabel: job
        replacement: thanos-sidecar
        action: replace

  prometheusSpec:
    podMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    scrapeConfigSelectorNilUsesHelmValues: false

    scrapeClasses:
      - name: default
        default: true
        metricRelabelings:
          - sourceLabels: [cluster]
            regex: "^$"
            targetLabel: cluster
            replacement: backbone
            action: replace

    ## External labels to add to any time series or alerts when communicating with external systems
    ##
    externalLabels:
      cluster: backbone

    ## Disabled: 0 remote-write requests in 14d, and the receiver is
    ## unauthenticated and reachable over the WireGuard overlay.
    enableRemoteWriteReceiver: false

    ## How long to retain metrics
    ##
    retention: 30d

    thanos:
      image: quay.io/thanos/thanos:v0.42.4@sha256:b567818fe608067eb0f1d7c2c4fe361e7ad83c8a256234c97685f1d0bf670cc8
      version: v0.42.4
      resources:
        requests:
          cpu: 10m
          memory: 40Mi
        limits:
          memory: 480Mi
      objectStorageConfig:
        existingSecret:
          name: thanos-objstore-config
          key: objstore.yml

    ## Allow out-of-order/out-of-bounds samples ingested into Prometheus for a specified duration
    ## See https://prometheus.io/docs/prometheus/latest/configuration/configuration/#tsdb
    tsdb:
      ## Only absorbs cAdvisor samples with explicit timestamps that arrive
      ## late during kubelet flaps; remote-write is disabled.
      outOfOrderTimeWindow: 1h

    ## Resource limits & requests
    ##

    # Required, not preferred: the TSDB volume is served by rock5bp, so the pod
    # cannot run anywhere else while rock5bp is down, and a preference let the
    # pod stay on another node after a rock5bp reboot and push heavy I/O over
    # NVMe/TCP. Required affinity also keeps the descheduler from moving it.
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - rock5bp
    # Sized on RSS, not working set: the working set also counts TSDB page
    # cache, which fills whatever the limit leaves free and is reclaimed under
    # pressure. 14d container_memory_rss: P50 1255Mi, P99 1508Mi, max 1614Mi;
    # Go heap max 1563Mi. Request ~1.22x RSS P50. The limit stays well above
    # RSS so mmapped TSDB chunks can stay cached (GOMEMLIMIT is 0.9x limit).
    resources:
      requests:
        cpu: 250m
        memory: 1536Mi
      limits:
        memory: 3584Mi

    ## Prometheus StorageSpec for persistent data
    ## ref: https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/user-guides/storage.md
    ##
    ## prometheus-shared-db-prometheus-shared-0 was created by democratic-csi
    ## (16K volblocksize, lz4) and imported into pillar-csi in place on
    ## 2026-10-01, so it keeps those zvol properties.
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: ssd-ha
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 256Gi

    ## Scrape etcd server metrics via Kubernetes node service discovery.
    ## K3s has no component=etcd Pod, so the kubeEtcd ServiceMonitor can't discover targets.
    ## Port 2381 is open on all control-plane nodes (etcd-expose-metrics: true in K3s config).
    ## The etcd port also exposes apiserver/containerd metrics, so we keep only etcd_*.
    ## job_name "etcd" matches the dashboard/alert pattern job=~".*etcd.*".
    additionalScrapeConfigs:
      - job_name: etcd
        scheme: http
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - source_labels: [__meta_kubernetes_node_label_node_role_kubernetes_io_etcd]
            action: keep
            regex: "true"
          - source_labels: [__address__]
            action: replace
            regex: (.+?)(?::\d+)?
            replacement: $1:2381
            target_label: __address__
          - target_label: cluster
            replacement: backbone
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: etcd_.*
            action: keep

    securityContext:
      runAsGroup: 2000
      runAsNonRoot: true
      runAsUser: 1000
      fsGroup: 2000
      fsGroupChangePolicy: OnRootMismatch

cleanPrometheusOperatorObjectNames: true
