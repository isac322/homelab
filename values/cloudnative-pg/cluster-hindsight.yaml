type: postgresql
mode: standalone
version:
  postgresql: "18"

nameOverride: hindsight

cluster:
  instances: 1
  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:18.6-1.1.1@sha256:c7672bc011351a587cc292a94aac7eeebb593ed2e120077bd9c9944c9467db93
  resources:
    requests:
      cpu: 1
      memory: 1280Mi
    limits:
      memory: 2560Mi
  # The data and WAL zvols were imported in place into pillar-csi (stage 6). CNPG uses the
  # class only for claims it creates later; the existing claims were created by hand with
  # the pillar-csi.bhyoo.com/import-zvol annotation. Pillar PVs carry no node topology, so the
  # instance is pinned to the storage host to keep the local NVMe/TCP attach it had before.
  affinity:
    nodeSelector:
      kubernetes.io/hostname: rock5bp
  storage:
    storageClass: ssd-ha-retain
    size: 10Gi
  walStorage:
    enabled: true
    storageClass: ssd-ha-retain
    size: 40Gi
  postgresql:
    shared_preload_libraries:
      - vchord.so
    parameters:
      wal_compression: zstd
      shared_buffers: 512MB
      work_mem: 16MB
      maintenance_work_mem: 128MB
      max_connections: "50"
  postgresUID: 26
  postgresGID: 999
  initdb:
    database: hindsight
    owner: hindsight
    postInitSQL:
      - CREATE EXTENSION IF NOT EXISTS vector;
      - CREATE EXTENSION IF NOT EXISTS vchord CASCADE;
  monitoring:
    enabled: true
    podMonitor:
      metricRelabelings:
        - sourceLabels: [cluster]
          targetLabel: cnpg_cluster
    prometheusRule:
      excludeRules:
        # chart 0.6.0 PromQL syntax bug
        - CNPGClusterLogicalReplicationErrorsCritical
        - CNPGClusterLogicalReplicationErrors
        - CNPGClusterLogicalReplicationStoppedCritical
        - CNPGClusterLogicalReplicationStopped
        # instances: 1 by design, so a standby can never exist and these
        # two alerts would always fire.
        - CNPGClusterHACritical
        - CNPGClusterHAWarning

backups:
  enabled: true
  endpointURL: "http://versitygw-hdd.object-storage.svc:7070"
  provider: s3
  data:
    compression: gzip
    encryption: ''
  wal:
    compression: zstd
    maxParallel: 2
    encryption: ''
  secret:
    create: false
    name: hindsight-s3-creds
  s3:
    bucket: cnpg-hindsight-backup-hdd
    region: ap-northeast-2
  scheduledBackups:
    - name: daily-backup
      schedule: "0 0 2 * * *"
      backupOwnerReference: self
  retentionPolicy: "7d"
