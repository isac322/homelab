type: postgresql
mode: standalone
version:
  postgresql: "17"

nameOverride: immich

cluster:
  instances: 1
  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:17.11-1.1.1@sha256:bb7eb8442f76b1e74911f28585019a77022911f8cfa2ddcfb166ea6af85abd09
  resources:
    requests:
      cpu: 100m
      memory: 1152Mi
    limits:
      memory: 2Gi
  # The data and WAL zvols were imported in place into pillar-csi (stage 6). CNPG uses the
  # class only for claims it creates later; the existing claims were created by hand with
  # the pillar-csi.bhyoo.com/import-zvol annotation. Pillar PVs carry no node topology, so the
  # instance is pinned to the storage host to keep the local NVMe/TCP attach it had before.
  affinity:
    nodeSelector:
      kubernetes.io/hostname: rock5bp
  storage:
    storageClass: ssd-ha-retain
    size: 10Gi
  walStorage:
    enabled: true
    storageClass: ssd-ha-retain
    size: 64Gi
  postgresql:
    shared_preload_libraries:
      - vchord.so
    parameters:
      wal_compression: zstd
      shared_buffers: 512MB
      work_mem: 16MB
      maintenance_work_mem: 128MB
      max_connections: "50"
  postgresUID: 26
  postgresGID: 999
  monitoring:
    enabled: true
    podMonitor:
      metricRelabelings:
        # Copy CNPG's "cluster" label to "cnpg_cluster" before Prometheus
        # external label (cluster=backbone) overwrites it.
        # See https://github.com/cloudnative-pg/cloudnative-pg/issues/2501
        - sourceLabels: [cluster]
          targetLabel: cnpg_cluster
    prometheusRule:
      excludeRules:
        # chart 0.6.0 PromQL syntax bug (ranges only allowed for vector selectors)
        - CNPGClusterLogicalReplicationErrorsCritical
        - CNPGClusterLogicalReplicationErrors
        - CNPGClusterLogicalReplicationStoppedCritical
        - CNPGClusterLogicalReplicationStopped
        # instances: 1 by design, so a standby can never exist and these
        # two alerts would always fire.
        - CNPGClusterHACritical
        - CNPGClusterHAWarning

backups:
  enabled: true
  endpointURL: "http://versitygw-hdd.object-storage.svc:7070"
  provider: s3
  data:
    compression: gzip
    encryption: ''
  wal:
    compression: zstd
    maxParallel: 2
    encryption: ''
  secret:
    create: false
    name: immich-s3-creds
  s3:
    bucket: cnpg-immich-backup-hdd
    region: ap-northeast-2
  scheduledBackups:
    - name: daily-backup # Weekly on Sunday at midnight
      schedule: "0 0 0 * * 0" # Weekly on Sunday at midnight
      backupOwnerReference: self
  retentionPolicy: "30d"
