type: postgresql
mode: standalone
version:
  postgresql: "18"

nameOverride: immich

cluster:
  instances: 1
  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:18.6-1.1.1@sha256:c7672bc011351a587cc292a94aac7eeebb593ed2e120077bd9c9944c9467db93
  resources:
    requests:
      cpu: 100m
      memory: 1152Mi
    limits:
      memory: 2Gi
  # Pillar PVs carry no node topology, so the instance is pinned to the storage
  # host to keep a local NVMe/TCP attach (homelab#385).
  affinity:
    nodeSelector:
      kubernetes.io/hostname: rock5bp
  storage:
    storageClass: ssd-ha-retain
    size: 10Gi
  walStorage:
    enabled: true
    storageClass: ssd-ha-retain
    size: 64Gi
  postgresql:
    shared_preload_libraries:
      - vchord.so
    parameters:
      wal_compression: zstd
      shared_buffers: 512MB
      work_mem: 16MB
      maintenance_work_mem: 128MB
      max_connections: "50"
  postgresUID: 26
  postgresGID: 999
  monitoring:
    enabled: true
    podMonitor:
      metricRelabelings:
        # Copy CNPG's "cluster" label to "cnpg_cluster" before Prometheus
        # external label (cluster=backbone) overwrites it.
        # See https://github.com/cloudnative-pg/cloudnative-pg/issues/2501
        - sourceLabels: [cluster]
          targetLabel: cnpg_cluster
    prometheusRule:
      excludeRules:
        # chart 0.6.0 PromQL syntax bug (ranges only allowed for vector selectors)
        - CNPGClusterLogicalReplicationErrorsCritical
        - CNPGClusterLogicalReplicationErrors
        - CNPGClusterLogicalReplicationStoppedCritical
        - CNPGClusterLogicalReplicationStopped
        # instances: 1 by design, so a standby can never exist and these
        # two alerts would always fire.
        - CNPGClusterHACritical
        - CNPGClusterHAWarning

backups:
  enabled: true
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  objectStore:
    create: true
    helmHook: false
    annotations:
      argocd.argoproj.io/sync-wave: "-1"
  instanceSidecarConfiguration:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi
  endpointURL: "http://versitygw-hdd.object-storage.svc:7070"
  provider: s3
  data:
    compression: gzip
    encryption: ''
  wal:
    compression: zstd
    maxParallel: 2
    encryption: ''
  secret:
    create: false
    name: immich-s3-creds
  s3:
    bucket: cnpg-immich-backup-hdd
    path: "/pg18"
    region: ap-northeast-2
  scheduledBackups:
    - name: daily-backup # Weekly on Sunday at midnight
      schedule: "0 0 0 * * 0" # Weekly on Sunday at midnight
      backupOwnerReference: self
      method: plugin
      pluginConfiguration:
        name: barman-cloud.cloudnative-pg.io
  retentionPolicy: "30d"
