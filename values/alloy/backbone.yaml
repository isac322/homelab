serviceMonitor:
  enabled: true

controller:
  type: statefulset
  replicas: 1

  volumeClaimTemplates:
    - metadata:
        name: alloy-data
      spec:
        accessModes: ["ReadWriteOnce"]
        # alloy-data-alloy-0 was created by democratic-csi and imported into
        # pillar-csi in place on 2026-10-01.
        storageClassName: ssd-ha
        resources:
          requests:
            storage: 1Gi

alloy:
  stabilityLevel: generally-available
  ## Persist WAL and positions across restarts to avoid re-sending old logs
  storagePath: /var/lib/alloy
  mounts:
    extra:
      - name: alloy-data
        mountPath: /var/lib/alloy
  resources:
    requests:
      cpu: 100m
      memory: 224Mi
    limits:
      memory: 512Mi
  configMap:
    create: true
    content: |-
      discovery.kubernetes "pods" {
        role = "pod"
      }

      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          target_label  = "node"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "app"
        }

        rule {
          replacement  = "backbone"
          target_label = "cluster"
        }
      }

      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pods.output
        forward_to = [loki.process.pods.receiver]
      }

      loki.process "pods" {
        forward_to = [loki.write.backbone.receiver]

        // Loki rejects entries older than reject_old_samples_max_age (336h) with
        // HTTP 400; only kubelet re-sends of a container's last line reach this age.
        stage.drop {
          older_than          = "330h"
          drop_counter_reason = "too_old"
        }

        // Label changes belong here, not in discovery.relabel: tailer positions are
        // keyed by the discovery labels, so changing those re-reads every log.
        stage.label_drop {
          values = ["instance", "job"]
        }

        // descheduler CronJob runs (*/15, 3 successful runs kept): pod becomes
        // structured metadata so each run does not create a new stream. Limited to
        // descheduler: merged streams reject lines more than 1h behind the newest
        // line (unordered_writes window), and the kept runs span only ~30 min.
        stage.match {
          selector = `{namespace="kube-system", pod=~"descheduler-[0-9]{8}-[a-z0-9]{5}"}`
          stage.structured_metadata {
            values = { pod = "" }
          }
        }
      }

      loki.write "backbone" {
        endpoint {
          url = "http://loki-gateway.loki.svc.cluster.local/loki/api/v1/push"

          // Retry 5xx, 429 and connection errors until Loki answers (0 = no retry
          // limit) instead of dropping a batch after 10 retries (~4-8 min); the
          // queue then back-pressures the tailers, so unsent lines stay in the
          // kubelet log files. Retries are at most 30s apart. 4xx is still dropped.
          min_backoff_period  = "1s"
          max_backoff_period  = "30s"
          max_backoff_retries = 0
        }
      }

image:
  repository: grafana/alloy
  tag: v1.20.1
  digest: sha256:2aa2099af76c0098d4af7a4d6e48f86cb66dc1a000222ad927a1c67c6542d13f

configReloader:
  image:
    tag: v0.94.1
    digest: sha256:06b52bd4dbe3ed6dd5905aadaf8b9987d9da4c31d37bb86deaadae68cee2d26b
  resources:
    requests:
      cpu: 5m
      memory: 16Mi
    limits:
      memory: 48Mi
