# Update this image pin together with argocd/apps/hermes.yaml's chart version.
image:
  repository: ghcr.io/paperclipinc/hermes-operator
  tag: v0.2.0@sha256:7a491ec9b0ff3037341a7b1f71b8e3d0a8a6f61ea3dd3fc00b585bcd57b82481

resources:
  requests:
    cpu: 10m
    memory: 104Mi
  limits:
    memory: 120Mi

affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - n2p1
      - weight: 80
        preference:
          matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - n2p2

webhook:
  enabled: true
  certManager:
    enabled: true
    issuerKind: Issuer
    issuerName: hermes-operator-selfsigned
