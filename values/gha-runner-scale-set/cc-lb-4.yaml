githubConfigUrl: https://github.com/isac322/cc-lb
githubConfigSecret: github-config
runnerScaleSetName: cc-lb-4

minRunners: 0
maxRunners: 2

controllerServiceAccount:
  namespace: arc-systems
  name: arc-gha-rs-controller

containerMode:
  type: kubernetes
  kubernetesModeWorkVolumeClaim:
    accessModes: ["ReadWriteOnce"]
    storageClassName: local-path
    resources:
      requests:
        storage: 10Gi

# Reserve 3.5 CPUs so batch runners fit alongside resident workloads.
# Retain the 4-CPU burst cap and 6Gi memory budget; QoS becomes Burstable.
# No DinD. Image builds go to buildkit.arc-systems.svc:1234.
# actions/cache talks to the in-cluster cache server, not GitHub.
# Runner pods and hook-created workflow pods stay on macmini so CI CPU never
# lands on rock5bp (storage host; load-48 incident) or the small n2p/rpi nodes.

template:
  spec:
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - macmini
    volumes:
      - name: workflow-pod-templates
        configMap:
          name: workflow-pod-templates
          defaultMode: 0644
    containers:
      - name: runner
        image: ghcr.io/isac322/cc-lb-actions-runner:2.337.0-cclb-fe7ac6d6df4f@sha256:c2f09887524d6616d0b97be3316822b47466f5633409f743d6e1bab277deefb4
        command: ["/home/runner/run.sh"]
        env:
          - name: ACTIONS_RUNNER_CONTAINER_HOOKS
            value: /home/runner/k8s/index.js
          - name: ACTIONS_RUNNER_CONTAINER_HOOK_TEMPLATE
            value: /home/runner/pod-templates/cc-lb-4.yaml
          - name: ACTIONS_RUNNER_POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: ACTIONS_RUNNER_REQUIRE_JOB_CONTAINER
            value: "false"
          - name: BUILDKIT_HOST
            value: tcp://buildkit.arc-systems.svc.cluster.local:1234
          - name: ACTIONS_RESULTS_URL
            value: http://gha-cache-server.arc-systems.svc.cluster.local:3000/
          - name: CUSTOM_ACTIONS_RESULTS_URL
            value: http://gha-cache-server.arc-systems.svc.cluster.local:3000/
          - name: DISABLE_RUNNER_UPDATE
            value: "true"
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: sccache-s3
                key: AWS_ACCESS_KEY_ID
                optional: true
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: sccache-s3
                key: AWS_SECRET_ACCESS_KEY
                optional: true
          - name: SCCACHE_BUCKET
            valueFrom:
              secretKeyRef:
                name: sccache-s3
                key: SCCACHE_BUCKET
                optional: true
          - name: SCCACHE_ENDPOINT
            valueFrom:
              secretKeyRef:
                name: sccache-s3
                key: SCCACHE_ENDPOINT
                optional: true
          - name: SCCACHE_REGION
            valueFrom:
              secretKeyRef:
                name: sccache-s3
                key: SCCACHE_REGION
                optional: true
          - name: SCCACHE_S3_USE_SSL
            valueFrom:
              secretKeyRef:
                name: sccache-s3
                key: SCCACHE_S3_USE_SSL
                optional: true
          - name: SCCACHE_S3_KEY_PREFIX
            valueFrom:
              secretKeyRef:
                name: sccache-s3
                key: SCCACHE_S3_KEY_PREFIX
                optional: true
          - name: CARGO_BUILD_JOBS
            value: "4"
          - name: RAYON_NUM_THREADS
            value: "4"
        resources:
          requests:
            cpu: "3500m"
            memory: 6Gi
          limits:
            cpu: "4"
            memory: 6Gi
        volumeMounts:
          - name: workflow-pod-templates
            mountPath: /home/runner/pod-templates
            readOnly: true
listenerTemplate:
  spec:
    containers:
      - name: listener
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 128Mi
