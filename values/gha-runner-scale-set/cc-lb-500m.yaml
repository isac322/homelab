githubConfigUrl: https://github.com/isac322/cc-lb
githubConfigSecret: github-config
runnerScaleSetName: cc-lb-500m

minRunners: 0


controllerServiceAccount:
  namespace: arc-systems
  name: arc-gha-rs-controller

containerMode:
  type: kubernetes
  # The work volume is the `work` entry under template.spec.volumes below; the
  # chart renders a user-defined `work` volume verbatim, while
  # kubernetesModeWorkVolumeClaim lands only under volumeClaimTemplate.spec and
  # cannot carry the pillar-csi annotations.

# fmt/promtool/web/helm and docker-build clients; compile runs on BuildKit.
# No maxRunners: ARC omits the cap and scales with the GitHub queue.
# No DinD. Image builds go to buildkit.arc-systems.svc:1234.
# actions/cache talks to the in-cluster cache server, not GitHub.
# Runner pods and hook-created workflow pods stay on macmini or rock5bp; the
# small n2p/rpi nodes lack the RAM for these jobs.
template:
  spec:
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - macmini
                    - rock5bp
    volumes:
      # Thick zvol on pillar-csi `ssd-single` (rock5bp `fast` pool) attached over
      # NVMe/TCP, replacing local-path: local-path consumed the node rootfs with
      # no size enforcement, and on 2026-10-09 concurrent cargo builds pushed
      # rock5bp nodefs to DiskPressure and evicted job pods. 96Gi covers observed
      # 22-91GiB per job (kubelet_volume_stats_used_bytes, 30d); thick
      # reservations cap live volumes at ~6 on ~587GiB pool-free, so a queue
      # storm parks extra runners as Pending instead of draining the pool.
      # lz4 + default 8K volblocksize; mkfs -K skips the discard pass.
      - name: work
        ephemeral:
          volumeClaimTemplate:
            metadata:
              annotations:
                pillar-csi.bhyoo.com/backend: |
                  zfs: {properties: {compression: lz4}}
                pillar-csi.bhyoo.com/filesystem: |
                  mkfsOptions: ["-K"]
            spec:
              accessModes: ["ReadWriteOnce"]
              storageClassName: ssd-single
              resources:
                requests:
                  storage: 96Gi
      - name: workflow-pod-templates
        configMap:
          name: workflow-pod-templates
          defaultMode: 0644
    containers:
      - name: runner
        image: ghcr.io/isac322/cc-lb-actions-runner:2.337.0-cclb-fe7ac6d6df4f@sha256:c2f09887524d6616d0b97be3316822b47466f5633409f743d6e1bab277deefb4
        command: ["/home/runner/run.sh"]
        env:
          - name: ACTIONS_RUNNER_CONTAINER_HOOKS
            value: /home/runner/k8s/index.js
          - name: ACTIONS_RUNNER_CONTAINER_HOOK_TEMPLATE
            value: /home/runner/pod-templates/cc-lb-500m.yaml
          - name: ACTIONS_RUNNER_POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: ACTIONS_RUNNER_REQUIRE_JOB_CONTAINER
            value: "false"
          - name: BUILDKIT_HOST
            value: tcp://buildkit.arc-systems.svc.cluster.local:1234
          - name: ACTIONS_RESULTS_URL
            value: http://gha-cache-server.arc-systems.svc.cluster.local:3000/
          - name: CUSTOM_ACTIONS_RESULTS_URL
            value: http://gha-cache-server.arc-systems.svc.cluster.local:3000/
          - name: DISABLE_RUNNER_UPDATE
            value: "true"
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: sccache-s3
                key: AWS_ACCESS_KEY_ID
                optional: true
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: sccache-s3
                key: AWS_SECRET_ACCESS_KEY
                optional: true
          - name: SCCACHE_BUCKET
            valueFrom:
              secretKeyRef:
                name: sccache-s3
                key: SCCACHE_BUCKET
                optional: true
          - name: SCCACHE_ENDPOINT
            valueFrom:
              secretKeyRef:
                name: sccache-s3
                key: SCCACHE_ENDPOINT
                optional: true
          - name: SCCACHE_REGION
            valueFrom:
              secretKeyRef:
                name: sccache-s3
                key: SCCACHE_REGION
                optional: true
          - name: SCCACHE_S3_USE_SSL
            valueFrom:
              secretKeyRef:
                name: sccache-s3
                key: SCCACHE_S3_USE_SSL
                optional: true
          - name: SCCACHE_S3_KEY_PREFIX
            valueFrom:
              secretKeyRef:
                name: sccache-s3
                key: SCCACHE_S3_KEY_PREFIX
                optional: true
          - name: CARGO_BUILD_JOBS
            value: "1"
          - name: RAYON_NUM_THREADS
            value: "1"
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 500m
            memory: 1Gi
        volumeMounts:
          - name: workflow-pod-templates
            mountPath: /home/runner/pod-templates
            readOnly: true

listenerTemplate:
  spec:
    containers:
      - name: listener
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 128Mi
