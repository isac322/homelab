githubConfigUrl: https://github.com/isac322/cc-lb
githubConfigSecret: github-config
runnerScaleSetName: oracle4-cc-lb

minRunners: 0
maxRunners: 4

controllerServiceAccount:
  namespace: arc-systems
  name: arc-gha-rs-controller

# Official ARC runner plus gcc/pkg-config. Rust build scripts need `cc`.
# containerMode is left empty so the injected latest tags can be replaced
# with digest pins.
template:
  spec:
    initContainers:
      - name: init-dind-externals
        image: ghcr.io/isac322/gha-actions-runner:2.337.0-cc@sha256:106cfac2c960b03ba52ab3b4f53bcb8117e90dbd4a1409c92df52e16943f44b0
        command: ["cp", "-r", "/home/runner/externals/.", "/home/runner/tmpDir/"]
        volumeMounts:
          - name: dind-externals
            mountPath: /home/runner/tmpDir
    containers:
      - name: runner
        image: ghcr.io/isac322/gha-actions-runner:2.337.0-cc@sha256:106cfac2c960b03ba52ab3b4f53bcb8117e90dbd4a1409c92df52e16943f44b0
        command: ["/home/runner/run.sh"]
        env:
          - name: DOCKER_HOST
            value: unix:///var/run/docker.sock
          - name: RUNNER_WAIT_FOR_DOCKER_IN_SECONDS
            value: "120"
        resources:
          requests:
            cpu: "1"
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work
          - name: dind-sock
            mountPath: /var/run
      - name: dind
        image: docker:28-dind@sha256:2a232a42256f70d78e3cc5d2b5d6b3276710a0de0596c145f627ecfae90282ac
        args:
          - dockerd
          - --host=unix:///var/run/docker.sock
          - --group=$(DOCKER_GROUP_GID)
        env:
          - name: DOCKER_GROUP_GID
            value: "123"
        securityContext:
          privileged: true
        startupProbe:
          exec:
            command:
              - docker
              - info
          initialDelaySeconds: 0
          failureThreshold: 24
          periodSeconds: 5
          timeoutSeconds: 5
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work
          - name: dind-sock
            mountPath: /var/run
          - name: dind-externals
            mountPath: /home/runner/externals
    volumes:
      - name: work
        emptyDir: {}
      - name: dind-sock
        emptyDir: {}
      - name: dind-externals
        emptyDir: {}
