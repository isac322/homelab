githubConfigUrl: https://github.com/isac322/cc-lb
githubConfigSecret: github-config
runnerScaleSetName: cc-lb-2

minRunners: 0
maxRunners: 1

controllerServiceAccount:
  namespace: arc-systems
  name: arc-gha-rs-controller

containerMode:
  type: kubernetes

# leftover medium jobs; image compiles moved to BuildKit
# No DinD. Image builds go to buildkit.arc-systems.svc:1234.
# actions/cache talks to the in-cluster cache server, not GitHub.
template:
  spec:
    containers:
      - name: runner
        image: ghcr.io/isac322/cc-lb-actions-runner:2.337.0-cclb-20f79911f8e8@sha256:d4b215346fc04e7271816c5f9e6c132f7d7b47e629cef2864c4b516441980139
        command: ["/home/runner/run.sh"]
        env:
          - name: ACTIONS_RUNNER_CONTAINER_HOOKS
            value: /home/runner/k8s/index.js
          - name: ACTIONS_RUNNER_POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: ACTIONS_RUNNER_REQUIRE_JOB_CONTAINER
            value: "false"
          - name: BUILDKIT_HOST
            value: tcp://buildkit.arc-systems.svc.cluster.local:1234
          - name: ACTIONS_RESULTS_URL
            value: http://gha-cache-server.arc-systems.svc.cluster.local:3000/
          - name: CUSTOM_ACTIONS_RESULTS_URL
            value: http://gha-cache-server.arc-systems.svc.cluster.local:3000/
          - name: DISABLE_RUNNER_UPDATE
            value: "true"
        resources:
          requests:
            cpu: 2
