githubConfigUrl: https://github.com/isac322/cc-lb
githubConfigSecret: github-config
runnerScaleSetName: cc-lb-1

minRunners: 0
maxRunners: 2

controllerServiceAccount:
  namespace: arc-systems
  name: arc-gha-rs-controller

containerMode:
  type: kubernetes
  kubernetesModeWorkVolumeClaim:
    accessModes: ["ReadWriteOnce"]
    storageClassName: local-path
    resources:
      requests:
        storage: 10Gi

# cargo-deny and other rustc-install jobs
# No DinD. Image builds go to buildkit.arc-systems.svc:1234.
# actions/cache talks to the in-cluster cache server, not GitHub.
template:
  spec:
    containers:
      - name: runner
        image: ghcr.io/isac322/cc-lb-actions-runner:2.337.0-cclb-91f8035a0c5f@sha256:508df5d4504e09e2d560b61ef297e2fa77f5e671409c4d8214887a3d8e7327d0
        command: ["/home/runner/run.sh"]
        env:
          - name: ACTIONS_RUNNER_CONTAINER_HOOKS
            value: /home/runner/k8s/index.js
          - name: ACTIONS_RUNNER_POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: ACTIONS_RUNNER_REQUIRE_JOB_CONTAINER
            value: "false"
          - name: BUILDKIT_HOST
            value: tcp://buildkit.arc-systems.svc.cluster.local:1234
          - name: ACTIONS_RESULTS_URL
            value: http://gha-cache-server.arc-systems.svc.cluster.local:3000/
          - name: CUSTOM_ACTIONS_RESULTS_URL
            value: http://gha-cache-server.arc-systems.svc.cluster.local:3000/
          - name: DISABLE_RUNNER_UPDATE
            value: "true"
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: sccache-s3
                key: AWS_ACCESS_KEY_ID
                optional: true
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: sccache-s3
                key: AWS_SECRET_ACCESS_KEY
                optional: true
          - name: SCCACHE_BUCKET
            valueFrom:
              secretKeyRef:
                name: sccache-s3
                key: SCCACHE_BUCKET
                optional: true
          - name: SCCACHE_ENDPOINT
            valueFrom:
              secretKeyRef:
                name: sccache-s3
                key: SCCACHE_ENDPOINT
                optional: true
          - name: SCCACHE_REGION
            valueFrom:
              secretKeyRef:
                name: sccache-s3
                key: SCCACHE_REGION
                optional: true
          - name: SCCACHE_S3_USE_SSL
            valueFrom:
              secretKeyRef:
                name: sccache-s3
                key: SCCACHE_S3_USE_SSL
                optional: true
          - name: SCCACHE_S3_KEY_PREFIX
            valueFrom:
              secretKeyRef:
                name: sccache-s3
                key: SCCACHE_S3_KEY_PREFIX
                optional: true
        resources:
          requests:
            cpu: 1
            memory: 2Gi
          limits:
            cpu: 1
            memory: 2Gi

listenerTemplate:
  spec:
    containers:
      - name: listener
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 100m
            memory: 128Mi
