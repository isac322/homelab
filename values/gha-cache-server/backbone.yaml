fullnameOverride: gha-cache-server

image:
  repository: ghcr.io/falcondev-oss/github-actions-cache-server
  tag: 9.7.0@sha256:3999b0202ec509f3b2084ef92cc50b408838e0d442b5997dd6dff2d89f4fe7b4

config:
  apiBaseUrl: http://gha-cache-server.arc-systems.svc.cluster.local:3000
  cacheCleanupOlderThanDays: 14
  cacheMaxSizeBytes: "42949672960"
  cacheFilesystemMaxUsagePercent: 90
  orphanedStorageGracePeriodHours: 24
  storage:
    driver: filesystem
    filesystem:
      path: /data/cache
  db:
    driver: sqlite
    sqlite:
      path: /data/cache-server.db

resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    memory: 384Mi

livenessProbe:
  httpGet:
    path: /health
    port: cache
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 5

readinessProbe:
  httpGet:
    path: /health
    port: cache
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 5

persistentVolumeClaim:
  enabled: true
  accessModes:
    - ReadWriteOnce
  storage: 50Gi
  storageClassName: ssd-ha-xfs
