fullnameOverride: gha-cache-server

image:
  repository: ghcr.io/falcondev-oss/github-actions-cache-server
  tag: 9.8.0@sha256:58bc6ae6fc34606c3b139e259c3c12d9ff23c793a666e8a784f13f6bb9b1aa41

config:
  apiBaseUrl: http://gha-cache-server.arc-systems.svc.cluster.local:3000
  cacheCleanupOlderThanDays: 14
  cacheMaxSizeBytes: "42949672960"
  cacheFilesystemMaxUsagePercent: 90
  orphanedStorageGracePeriodHours: 24
  storage:
    driver: filesystem
    filesystem:
      path: /data/cache
  db:
    driver: sqlite
    sqlite:
      path: /data/cache-server.db

resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    memory: 384Mi

livenessProbe:
  httpGet:
    path: /health
    port: cache
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 5

readinessProbe:
  httpGet:
    path: /health
    port: cache
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 5

persistentVolumeClaim:
  enabled: true
  accessModes:
    - ReadWriteOnce
  storage: 50Gi
  storageClassName: ssd-ha-xfs
