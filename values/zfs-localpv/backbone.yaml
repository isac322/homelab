zfsPlugin:
  image:
    registry: docker.io/
    repository: openebs/zfs-driver
    pullPolicy: IfNotPresent
    tag: 2.11.1@sha256:16f1a74bb2495c78f9652be5d7cd6e869cb212c9decd42cac63e6566b07fa5f2

# zfsNode contains the configurables for
# the zfs node daemonset
zfsNode:
  defaultFormatOptions:
    xfs: "-s size=4096"
  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi
  ## Labels to be added to openebs-zfs node pods
  nodeSelector:
    homelab.bhyoo.com/zfs-node: 'true'

# zfsController contains the configurables for
# the zfs controller statefulset
zfsController:
  replicas: 1
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 10m
      memory: 128Mi
