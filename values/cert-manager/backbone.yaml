crds:
  # This option decides if the CRDs should be installed
  # as part of the Helm installation.
  enabled: true

  # This option makes it so that the "helm.sh/resource-policy": keep
  # annotation is added to the CRD. This will prevent Helm from uninstalling
  # the CRD when the Helm release is uninstalled.
  # WARNING: when the CRDs are removed, all cert-manager custom resources
  # (Certificates, Issuers, ...) will be removed too by the garbage collector.
  keep: false

config:
  enableGatewayAPI: true

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1

resources:
  requests:
    cpu: 10m
    memory: 80Mi
  limits:
    memory: 128Mi

containerSecurityContext:
  readOnlyRootFilesystem: true
  runAsNonRoot: true

prometheus:
  enabled: true
  servicemonitor:
    enabled: true

webhook:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1

  resources:
    requests:
      cpu: 5m
      memory: 72Mi
    limits:
      memory: 80Mi

cainjector:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1

  resources:
    requests:
      cpu: 10m
      memory: 128Mi
    limits:
      memory: 160Mi
