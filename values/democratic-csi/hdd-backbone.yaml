csiDriver:
  name: "org.democratic-csi.hdd-iscsi"

storageClasses:
  - name: hdd-ha-xfs
    defaultClass: false
    reclaimPolicy: Delete
    volumeBindingMode: Immediate
    allowVolumeExpansion: true
    parameters:
      fsType: xfs
      democratic-csi.org/load-config-from-pvc: "true"

volumeSnapshotClasses: []

driver:
  config:
    driver: zfs-generic-iscsi
    sshConnection:
      host: rock5bp
      username: democratic-csi
      privateKey: "$SSH_PRIVATE_KEY"

    zfs:
      cli:
        sudoEnabled: true

      datasetParentName: nas/k8s
      detachedSnapshotsDatasetParentName: nas/k8s-snapshots

      zvolCompression: off
      zvolDedup: off
      zvolEnableReservation: false

    iscsi:
      shareStrategy: "targetCli"
      shareStrategyTargetCli:
        sudoEnabled: true
        basename: "iqn.2020-04.com.bhyoo.backbone"
        tpg:
          attributes:
            authentication: 0
            generate_node_acls: 1
            cache_dynamic_acls: 1
            demo_mode_write_protect: 0
        block:
          attributes:
            emulate_tpu: 0
      targetPortal: rock5bp:3260

csiProxy:
  resources:
    requests:
      cpu: 5m
      memory: 16Mi
    limits:
      memory: 20Mi

controller:
  externalAttacher:
    resources:
      requests:
        cpu: 5m
        memory: 32Mi
      limits:
        memory: 40Mi
  externalProvisioner:
    resources:
      requests:
        cpu: 5m
        memory: 32Mi
      limits:
        memory: 40Mi
  externalResizer:
    resources:
      requests:
        cpu: 10m
        memory: 36Mi
      limits:
        memory: 40Mi
  externalSnapshotter:
    resources:
      requests:
        cpu: 5m
        memory: 32Mi
      limits:
        memory: 40Mi
  driver:
    image:
      registry: docker.io/isac322/democratic-csi
      tag: "next@sha256:f9ebd3c6a5d732cf020f60157916582996b98c39ce7d88cee01187248b518cc7"
      pullPolicy: Always
    resources:
      requests:
        cpu: 25m
        memory: 80Mi
      limits:
        memory: 112Mi
    extraEnv:
      - name: SSH_PRIVATE_KEY
        valueFrom:
          secretKeyRef:
            name: openssh-private-key
            key: ssh-privatekey

node:
  cleanup:
    resources:
      requests:
        cpu: 5m
        memory: 8Mi
      limits:
        memory: 12Mi
  driverRegistrar:
    resources:
      requests:
        cpu: 5m
        memory: 24Mi
      limits:
        memory: 36Mi
  driver:
    image:
      registry: docker.io/isac322/democratic-csi
      tag: "next@sha256:f9ebd3c6a5d732cf020f60157916582996b98c39ce7d88cee01187248b518cc7"
      pullPolicy: Always
    resources:
      requests:
        cpu: 50m
        memory: 136Mi
      limits:
        memory: 192Mi
    extraEnv:
      - name: SSH_PRIVATE_KEY
        valueFrom:
          secretKeyRef:
            name: openssh-private-key
            key: ssh-privatekey
