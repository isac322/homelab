deploymentMode: Monolithic

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  storage:
    type: filesystem
  limits_config:
    retention_period: 8760h
    allow_structured_metadata: true
    volume_enabled: true
    split_queries_by_interval: 1h
    ## Multi-cluster: generous window for delayed log ingestion from remote clusters
    reject_old_samples: true
    reject_old_samples_max_age: 336h # 14d
    creation_grace_period: 10m # clock skew tolerance between clusters
    ## 1 replica x querier.max_concurrent 4: 8 keeps every worker busy while
    ## bounding the splits one query queues (the 128 default queued Drilldown
    ## requests for minutes behind a long scan on 2026-10-07). No byte cap:
    ## bytes predict cost poorly and Grafana's 120s timeout already bounds it.
    tsdb_max_query_parallelism: 8
    max_query_parallelism: 8
  query_range:
    ## Caches metric and filter-query results for extents older than
    ## max_cache_freshness_per_query (10m). Lines arriving later than that
    ## (Alloy retry backlog) can be hidden from a repeated query for up to ~2h;
    ## send `Cache-Control: no-cache` or restart loki-0 to bypass. The
    ## index-stats/volume/series/labels caches inherit this size.
    cache_results: true
    results_cache:
      cache:
        embedded_cache:
          enabled: true
          max_size_mb: 32
  ingester:
    wal:
      ## 5m default rewrites ~6 MiB of in-memory state 288x/day onto the
      ## raidz1 zvol; 15m cuts that to a third. Replay stays <15m of WAL.
      checkpoint_duration: 15m
      ## Default 4GB exceeds the 1Gi limit; replay flushes at 90% of this
      ## instead of OOM-looping. Leaves headroom under GOMEMLIMIT 870MiB.
      replay_memory_ceiling: 384MB
  compactor:
    retention_enabled: true
    delete_request_store: filesystem

singleBinary:
  replicas: 1
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - n2p1
        - weight: 80
          preference:
            matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - n2p2
        - weight: 50
          preference:
            matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - rpi5
  resources:
    requests:
      cpu: 100m
      memory: 384Mi # 1.18x 14d P50 (325Mi)
    limits:
      memory: 1Gi
  # storage-loki-0 was created by democratic-csi and imported into
  # pillar-csi in place on 2026-10-01.
  persistence:
    enabled: true
    storageClass: ssd-ha
    accessModes:
      - ReadWriteOnce
    size: 100Gi

read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

chunksCache:
  enabled: false
resultsCache:
  enabled: false

sidecar:
  # No loki rule ConfigMaps are used in this deployment, so the rules
  # sidecar is unnecessary. Disabling it prevents the kiwigrid/k8s-sidecar
  # container from blocking Pod readiness (its HTTP server sometimes
  # fails to bind before the readiness probe expires).
  rules:
    enabled: false

gateway:
  image:
    tag: 1.31.6-alpine
    digest: sha256:b54ac358b83fc6c965793fd271839b4ea4cdb6e99895bb19618cbc2ca152d972
  resources:
    requests:
      cpu: 5m
      memory: 24Mi
    limits:
      memory: 32Mi
  metrics:
    resources:
      requests:
        cpu: 5m
        memory: 24Mi
      limits:
        memory: 48Mi

lokiCanary:
  enabled: false

test:
  enabled: false

monitoring:
  dashboards:
    # Disabled: all Loki dashboards use read/write microservice job patterns
    # (e.g. loki-read, loki-write) which don't match SingleBinary mode (job=loki/loki)
    enabled: false
  rules:
    enabled: false
  alerts:
    enabled: false
  serviceMonitor:
    enabled: true

# Chart 13.x defaults abort_if_cluster_join_fails=true for memberlist; combined
# with a headless Service that filters NotReady endpoints, a single-replica
# SingleBinary pod can't resolve itself on startup and crashloops. Publishing
# NotReady addresses lets the pod discover itself during boot.
memberlist:
  service:
    publishNotReadyAddresses: true
