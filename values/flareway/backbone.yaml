image:
  digest: sha256:8865b32be899428c6afa6ee978357d6833db0412b6df5f71c4250f76c3fb3ac5

logging:
  level: debug

controllers:
  gateway: true
  access: true
  privateNetwork: true
  device: true
  organization: true

# Tier 1. Initial sizing exception approved 2026-11-03; no Flareway history yet.
# Revisit after 14 healthy days; cloudflared uses the previous tunnel's history.
resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: null
    memory: 128Mi

gatewayClass:
  create: true
  config:
    accountRefName: bhyoo
    connector:
      image: docker.io/cloudflare/cloudflared:2026.10.7@sha256:4955524aeaa379e154023d5a027c250f7b35041a2e7e950cf13f144bc9b9c5ba
      replicas: 2
      resources:
        requests:
          cpu: 100m
          memory: 24Mi
        limits:
          memory: 48Mi
    proxy:
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          memory: 256Mi
    scheduling:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values: [amd64, arm64]
                  - key: kubernetes.io/os
                    operator: In
                    values: [linux]
                  # WARP on macmini drops tunnel QUIC (UDP 7844).
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: [macmini]
