image:
  digest: sha256:44f049d4357e8181f8b5049d426917fa62f5d1b8c622ee0d8f4f350ec3e3f152

controllers:
  gateway: true
  access: false
  privateNetwork: false
  device: false
  organization: false

# Tier 1. Initial sizing exception approved 2026-11-03; no Flareway history yet.
# Revisit after 14 healthy days; cloudflared uses the previous tunnel's history.
resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: null
    memory: 128Mi

gatewayClass:
  create: true
  config:
    accountRefName: bhyoo
    connector:
      image: docker.io/cloudflare/cloudflared:2026.10.7@sha256:4955524aeaa379e154023d5a027c250f7b35041a2e7e950cf13f144bc9b9c5ba
      replicas: 2
      resources:
        requests:
          cpu: 100m
          memory: 24Mi
        limits:
          memory: 48Mi
    proxy:
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          memory: 256Mi
    scheduling:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values: [amd64, arm64]
                  - key: kubernetes.io/os
                    operator: In
                    values: [linux]
                  # WARP on macmini drops tunnel QUIC (UDP 7844).
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: [macmini]
