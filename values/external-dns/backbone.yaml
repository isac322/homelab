serviceMonitor:
  enabled: true

env:
  - name: CF_API_TOKEN
    valueFrom:
      secretKeyRef:
        name: cloudflare-api-token
        key: token

resources:
  requests:
    cpu: 10m
    memory: 80Mi
  limits:
    memory: 120Mi

sources:
  - node
  - service
  - gateway-httproute

policy: sync

registry: txt
txtOwnerId: k8s-backbone

domainFilters:
  - bhyoo.com

provider:
  name: cloudflare

extraArgs:
  - --service-type-filter=LoadBalancer
  - --gateway-name=bhyoo-gateway
  - --gateway-namespace=ingress-ctrl
