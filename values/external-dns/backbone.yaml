image:
  tag: v0.24.0@sha256:a80a146d2540fa138565e404f0625157271071a06093021f27ae19d8316d10f9

serviceMonitor:
  enabled: true

env:
  - name: CF_API_TOKEN
    valueFrom:
      secretKeyRef:
        name: cloudflare-api-token
        key: token

resources:
  requests:
    cpu: 10m
    memory: 80Mi
  limits:
    memory: 120Mi

sources:
  - node
  - service
  - gateway-httproute

policy: sync

registry: txt
txtOwnerId: k8s-backbone

domainFilters:
  - bhyoo.com

provider:
  name: cloudflare

extraArgs:
  - --service-type-filter=LoadBalancer
  - --gateway-namespace=ingress-ctrl
  - --annotation-prefix=external-dns.alpha.kubernetes.io/
