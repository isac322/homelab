image:
  tag: v1.10.0@sha256:89cad13cc981986ee284cbafea4613f9533ce6fd5f37a2c96c4c4fb8adb3a316

strategy:
  type: Recreate

gateway:
  corsAllowOrigin: "https://versitygw.bhyoo.com"
  backend:
    type: posix
    args: "/mnt/data"

httpRoute:
  enabled: true
  parentRefs:
    - name: bhyoo-gateway
      namespace: ingress-ctrl
      sectionName: https
  hostnames:
    - s3.bhyoo.com

admin:
  enabled: true
  httpRoute:
    enabled: true
    parentRefs:
      - name: bhyoo-gateway
        namespace: ingress-ctrl
        sectionName: https
    hostnames:
      - admin-s3.bhyoo.com

webui:
  enabled: true
  apiGateways:
    - "https://s3.bhyoo.com"
  adminGateways:
    - "https://admin-s3.bhyoo.com"
  httpRoute:
    enabled: true
    parentRefs:
      - name: bhyoo-gateway
        namespace: ingress-ctrl
        sectionName: https
    hostnames:
      - versitygw.bhyoo.com

iam:
  enabled: true

auth:
  existingSecret: versitygw-root-credentials

persistence:
  enabled: true
  create: false
  claimName: versitygw-data

ingress:
  enabled: false
  className: traefik
  annotations:
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
    cert-manager.io/cluster-issuer: cluster-issuer-acme
    cert-manager.io/private-key-algorithm: ECDSA
    cert-manager.io/private-key-size: "384"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
  hosts:
    - host: versitygw.bhyoo.com
      paths:
        - path: /
          pathType: Prefix
          servicePort: webui
    - host: s3.bhyoo.com
      paths:
        - path: /
          pathType: Prefix
    - host: admin-s3.bhyoo.com
      paths:
        - path: /
          pathType: Prefix
          servicePort: admin
  tls:
    - secretName: versitygw-webui-tls
      hosts:
        - versitygw.bhyoo.com
    - secretName: versitygw-s3-tls
      hosts:
        - s3.bhyoo.com
    - secretName: versitygw-admin-tls
      hosts:
        - admin-s3.bhyoo.com

resources:
  requests:
    cpu: 10m
    memory: 80Mi
  limits:
    memory: 320Mi
