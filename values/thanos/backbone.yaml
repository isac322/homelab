global:
  security:
    allowInsecureImages: true

image:
  registry: quay.io
  repository: thanos/thanos
  tag: v0.42.4
  # Same digest as the kube-prometheus-stack sidecar image.
  digest: sha256:b567818fe608067eb0f1d7c2c4fe361e7ad83c8a256234c97685f1d0bf670cc8

metrics:
  enabled: true
  serviceMonitor:
    enabled: true

existingObjstoreSecret: thanos-objstore-config
existingObjstoreSecretItems:
  - key: objstore.yml
    path: objstore.yml

query:
  enabled: true
  replicaCount: 1
  stores:
    - dnssrv+_grpc._tcp.prometheus-operated.prometheus.svc.cluster.local
  replicaLabel:
    - prometheus_replica
  extraFlags:
    - --query.auto-downsampling
  # 14d working set: P50 40Mi; heavy-query peak 471Mi.
  resources:
    requests:
      cpu: 50m
      memory: 48Mi
    limits:
      memory: 576Mi

queryFrontend:
  enabled: true
  replicaCount: 1
  extraFlags:
    - --query-range.split-interval=24h
    - --labels.split-interval=24h
    - --query-range.max-retries-per-request=3
    - --query-range.request-downsampled
    - --query-frontend.compress-responses
    - --cache-compression-type=snappy
    - --query-range.response-cache-config={"type":"in-memory","config":{"max-size":"256MB","max-item-size":"10MB","validity":"6h"}}
    - --labels.response-cache-config={"type":"in-memory","config":{"max-size":"32MB","max-item-size":"1MB","validity":"6h"}}
  # 14d working set: P50 32Mi. The limit leaves room for the in-memory caches
  # above (256MB range + 32MB labels) to fill plus Go heap headroom.
  resources:
    requests:
      cpu: 10m
      memory: 40Mi
    limits:
      memory: 640Mi

storegateway:
  enabled: true
  replicaCount: 1
  extraFlags:
    - --index-cache-size=512MB
  # Heavy I/O on a volume served by rock5bp: required so it returns there after
  # a rock5bp reboot and the descheduler never moves it.
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - rock5bp
  # 14d working set: P50 377Mi, P99 694Mi, peak 935Mi (initial sync on
  # 2026-10-01).
  resources:
    requests:
      cpu: 30m
      memory: 448Mi
    limits:
      memory: 1152Mi
  # data-thanos-storegateway-0 was created by democratic-csi and imported
  # into pillar-csi in place on 2026-10-01.
  persistence:
    enabled: true
    storageClass: ssd-ha
    size: 8Gi

compactor:
  enabled: true
  # Prometheus accepts out-of-order samples (tsdb.outOfOrderTimeWindow) and
  # ships them as a second block for the same 2h range. Without vertical
  # compaction the compactor treats that overlap as corruption and halts.
  extraFlags:
    - --compact.enable-vertical-compaction
  # Prefer macmini (8 cores, ~10Gi free, not control-plane). On the 4 GiB
  # control-plane Pis the compactor's IO and page cache pushed the node into
  # swap thrashing (rpi4, 2026-10-01: ~5k pages/s swap-in, 3+ busy cores,
  # k3s server starved).
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - macmini
  # 14d working set: P50 41Mi, compaction peak 1667Mi. The backlog is cleared
  # (no pending compactions, not halted), so the 2-core catch-up limit is gone;
  # the CPU limit is the approved Thanos compactor exception.
  resources:
    requests:
      cpu: 120m
      memory: 48Mi
    limits:
      cpu: 500m
      memory: 2Gi
  # Created by democratic-csi and imported into pillar-csi in place on
  # 2026-10-01. A 2-week compaction downloads its source blocks (~15GiB here)
  # and writes a block of similar size next to them; at 20Gi it halted with
  # "no space left on device" (2026-10-03).
  persistence:
    enabled: true
    storageClass: ssd-ha
    size: 60Gi
    annotations:
      pillar-csi.bhyoo.com/import-zvol: hot-data/k8s/pvc-d9bfa3b6-0d6e-4d3e-8ab6-c7b57774c55f
  retentionResolutionRaw: 30d
  retentionResolution5m: 90d
  retentionResolution1h: 0d

ruler:
  enabled: false
receive:
  enabled: false
receiveDistributor:
  enabled: false
bucketweb:
  enabled: false
