global:
  security:
    allowInsecureImages: true

image:
  registry: quay.io
  repository: thanos/thanos
  tag: v0.42.4

metrics:
  enabled: true
  serviceMonitor:
    enabled: true

existingObjstoreSecret: thanos-objstore-config
existingObjstoreSecretItems:
  - key: objstore.yml
    path: objstore.yml

query:
  enabled: true
  replicaCount: 1
  stores:
    - dnssrv+_grpc._tcp.prometheus-operated.prometheus.svc.cluster.local
  replicaLabels:
    - prometheus_replica
  extraFlags:
    - --query.auto-downsampling
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      memory: 512Mi

queryFrontend:
  enabled: true
  replicaCount: 1
  extraFlags:
    - --query-range.split-interval=24h
    - --labels.split-interval=24h
    - --query-range.max-retries-per-request=3
    - --query-range.request-downsampled
    - --query-frontend.compress-responses
    - --cache-compression-type=snappy
    - --query-range.response-cache-config={"type":"in-memory","config":{"max-size":"256MB","max-item-size":"10MB","validity":"6h"}}
    - --labels.response-cache-config={"type":"in-memory","config":{"max-size":"32MB","max-item-size":"1MB","validity":"6h"}}
  resources:
    requests:
      cpu: 10m
      memory: 56Mi
    limits:
      memory: 96Mi

storegateway:
  enabled: true
  replicaCount: 1
  extraFlags:
    - --index-cache-size=512MB
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - rock5bp
  resources:
    requests:
      cpu: 30m
      memory: 1280Mi
    limits:
      memory: 4Gi
  persistence:
    enabled: true
    storageClass: ssd-ha-xfs
    size: 8Gi

compactor:
  enabled: true
  resources:
    requests:
      cpu: 120m
      memory: 200Mi
    limits:
      cpu: 500m
      memory: 256Mi
  persistence:
    enabled: true
    storageClass: ssd-ha-xfs
    size: 16Gi
  retentionResolutionRaw: 30d
  retentionResolution5m: 180d
  retentionResolution1h: 0d

ruler:
  enabled: false
receive:
  enabled: false
receiveDistributor:
  enabled: false
bucketweb:
  enabled: false
