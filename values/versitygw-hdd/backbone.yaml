image:
  tag: v1.10.0@sha256:89cad13cc981986ee284cbafea4613f9533ce6fd5f37a2c96c4c4fb8adb3a316

strategy:
  type: Recreate

gateway:
  # Request log for audit: versitygw's stdout summary (time, status, latency,
  # peer IP, method, path, error, query) with credential-bearing query values
  # masked by versitygw itself. ~670k lines/day, mostly Thanos block reads.
  # Do not enable gateway.accessLog: it writes the raw request URI, including
  # presigned X-Amz-Signature and X-Amz-Security-Token values.
  # The summary has no requester; per-action/bucket/status counts stay in the
  # StatsD metrics below (versitygw_failed_count{action,bucket,status}).
  quiet: false
  backend:
    type: posix
    args: "/mnt/data"

admin:
  enabled: true

webui:
  enabled: false

iam:
  enabled: true

auth:
  existingSecret: versitygw-hdd-root-credentials

persistence:
  enabled: true
  create: false
  claimName: versitygw-hdd-data

resources:
  requests:
    cpu: 150m
    memory: 56Mi
  limits:
    memory: 384Mi

extraEnv:
  - name: VGW_METRICS_STATSD_SERVERS
    value: "127.0.0.1:9125"
  - name: VGW_METRICS_SERVICE_NAME
    value: versitygw-hdd

extraContainers:
  - name: statsd-exporter
    image: quay.io/prometheus/statsd-exporter:v0.31.0@sha256:1d5d341c4eb7abdd3445a3f85c3d498402b676ad29b4cf0421f5d280943871ab
    args:
      - --statsd.listen-udp=127.0.0.1:9125
      - --statsd.listen-tcp=
      - --web.listen-address=:9102
    ports:
      - name: metrics
        containerPort: 9102
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 65534
      capabilities:
        drop: [ALL]
    # Initial size for a new sidecar with no history; re-measure after 14d.
    resources:
      requests:
        cpu: 5m
        memory: 16Mi
      limits:
        memory: 64Mi
