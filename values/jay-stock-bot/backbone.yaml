replicaCount: 0

resources:
  requests:
    cpu: 20m
    memory: 120Mi
  limits:
    memory: 160Mi

imagePullSecrets:
  - name: ghcr-creds

extraEnvFrom:
  - secretRef:
      name: stock-credentials

# xfs (pillar-csi) needs >= 300MiB; the chart default of 100Mi cannot be formatted.
persistence:
  storageClass: ssd-ha-retain
  size: 1Gi
