apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    name: backbone
    namespace: loki
  project: monitoring
  sources:
    - repoURL: https://github.com/isac322/homelab.git
      targetRevision: HEAD
      ref: homelab
    - chart: loki
      helm:
        releaseName: loki
        valueFiles:
          - values.yaml
          - $homelab/values/loki/backbone.yaml
      repoURL: https://grafana-community.github.io/helm-charts
      targetRevision: 18.13.2
  syncPolicy:
    # Auto-sync off while storage-loki-0 moves to pillar-csi. The chart always
    # renders one replica for a filesystem-backed single binary, so loki is
    # stopped by scaling the StatefulSet by hand, and any homelab push would
    # otherwise sync it back.
    automated: null
    retry:
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m0s
      limit: 100
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
