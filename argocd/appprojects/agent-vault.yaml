apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: agent-vault
spec:
  description: Credential broker for Hermes agents
  sourceRepos:
    - https://github.com/isac322/homelab.git
  destinations:
    - namespace: agent-vault
      name: backbone
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
