- hosts: ansible_managed
  name: Setup wireguard mesh
  any_errors_fatal: true
  gather_facts: false
  pre_tasks:
    - name: Reject legacy WireGuard after a partial Nix cutover
      ansible.builtin.assert:
        that:
          - (groups['nix_managed'] | default([]) | length) == 0
        fail_msg: >-
          Legacy Ansible WireGuard cannot safely combine Nix-managed encrypted
          identities with its host-generated keys. Use
          `nix run .#rollout-peers -- <host>` instead.
      run_once: true
  become: yes
  roles:
    - role: wireguard_mesh
      vars:
        cidr_block: "{{ wireguard_network }}"
        local_directory: _wireguard
        wireguard_port: 51902
        wireguard_ip_address: "{{ wireguard_ip }}"  # host specific
        wireguard_host: "{{ wireguard_external_host|default(inventory_hostname) }}"
        wireguard_internal_host: "{{ inventory_hostname }}"
        mesh_group_config:
          backbone:
            cidr: 10.222.0.0/26
            ansible_groups: ['homelab']
            gateway_host: 'rpi5'
        edges:
          bhyoo-phone:
            ip_address: 10.222.0.129
            allowed_groups:
              - backbone
          bhyoo-desktop:
            ip_address: 10.222.0.130
            allowed_groups:
              - backbone
          bhyoo-laptop:
            ip_address: 10.222.0.131
            allowed_groups:
              - backbone
          bhyoo-tablet:
            ip_address: 10.222.0.132
            allowed_groups:
              - backbone
          bhyoo-office:
            ip_address: 10.222.0.133
            allowed_groups:
              - backbone
          jay-phone:
            ip_address: 10.222.0.193
            allowed_groups:
              - backbone
          jay-tablet:
            ip_address: 10.222.0.194
            allowed_groups:
              - backbone
          jay-desktop:
            ip_address: 10.222.0.195
            allowed_groups:
              - backbone
          yjyoo-phone:
            ip_address: 10.222.0.225
            allowed_groups:
              - backbone
          gyhan-phone:
            ip_address: 10.222.0.226
            allowed_groups:
              - backbone
          gyhan-tablet:
            ip_address: 10.222.0.227
            allowed_groups:
              - backbone
          jsyoo-phone:
            ip_address: 10.222.0.228
            allowed_groups:
              - backbone
          shchoi-phone:
            ip_address: 10.222.0.229
            allowed_groups:
              - backbone
          jhjeong-phone:
            ip_address: 10.222.0.230
            allowed_groups:
              - backbone
