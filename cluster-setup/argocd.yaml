---
- name: Group by k8s_master [backbone]
  hosts: "ansible_managed:&backbone"
  tasks:
    - name: Group by k8s_master
      ansible.builtin.group_by:
        key: backbone_k8s_masters
      when:
        - is_k8s_master

- hosts: backbone_k8s_masters
  name: Install cluster secrets on backbone
  run_once: yes
  tasks:
    - name: Create shared secrets
      become: yes
      kubernetes.core.k8s:
        state: present
        wait: yes
        kubeconfig: /etc/rancher/k3s/k3s.yaml
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: external-secrets-cluster-store-aws
            namespace: kube-system
            annotations:
              managed-by-ansible: 'true'
          type: Opaque
          stringData: "{{ lookup('cloud.terraform.tf_output', 'external_secrets_access_key', project_path='../1-provision/env/backbone') | to_nice_yaml(indent=2) | from_yaml }}"
      no_log: '{{ ansible_verbosity < 3 }}'


- hosts: backbone_k8s_masters
  name: Install argocd
  run_once: yes
  tasks:
    - name: Create argocd namespace on backbone cluster
      become: yes
      kubernetes.core.k8s:
        state: present
        wait: yes
        kubeconfig: /etc/rancher/k3s/k3s.yaml
        name: argocd
        api_version: v1
        kind: Namespace



    - name: install Helm
      ansible.builtin.import_role:
        name: gantsign.helm
      vars:
        helm_architecture: 'arm64'

    - name: Copy value file
      ansible.builtin.copy:
        src: ../values/argo-cd/backbone.yaml
        dest: /tmp/argo-cd-values.yaml

    - name: Install argocd
      become: yes
      kubernetes.core.helm:
        atomic: yes
        chart_ref: argo-cd
        chart_repo_url: https://argoproj.github.io/argo-helm
        chart_version: 9.1.3
        create_namespace: yes
        kubeconfig: /etc/rancher/k3s/k3s.yaml
        release_name: argocd
        release_namespace: argocd
        values_files:
          - /tmp/argo-cd-values.yaml
        wait: yes

    - name: Copy value file
      ansible.builtin.copy:
        src: ../values/argocd-apps/backbone.yaml
        dest: /tmp/argocd-apps-values.yaml

    - name: Install argocd-apps
      become: yes
      kubernetes.core.helm:
        atomic: yes
        chart_ref: argocd-apps
        chart_repo_url: https://argoproj.github.io/argo-helm
        chart_version: 2.0.2
        create_namespace: yes
        kubeconfig: /etc/rancher/k3s/k3s.yaml
        release_name: argocd-apps
        release_namespace: argocd
        values_files:
          - /tmp/argocd-apps-values.yaml
        wait: yes
