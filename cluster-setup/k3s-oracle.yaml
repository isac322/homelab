---
# Manage oracle4's k3s control plane via Ansible/GitOps (xanmanning.k3s). Tracks
# the `stable` channel like the other homelab clusters (k3s.yaml). oracle4 was
# adopted from the original sh-install and brought current v1.28.5 -> v1.36.2
# stepwise. NOTE: a re-run installs whatever `stable` is at that moment, so run it
# regularly to stay within one minor — a long-neglected node would hit a risky
# multi-minor jump. k3s_server replicates the node-args; SQLite datastore + CA +
# token preserved (k3s_state: installed, no etcd). Targets oracle4 only; workers
# join as self-managed wg1 edges.
#
#   preview: ansible-playbook -i inventory-oracle k3s-oracle.yaml --check --diff
#   apply:   ansible-playbook -i inventory-oracle k3s-oracle.yaml
- hosts: oracle4
  tasks:
    - name: Manage k3s control plane (latest stable)
      block:
        - ansible.builtin.set_fact:
            k3s_release_version: stable              # track stable channel (matches homelab k3s.yaml)
            k3s_use_experimental: true              # allow prefer-bundled-bin (xanmanning marks it experimental)
            k3s_become: yes
            k3s_state: installed
            k3s_control_node: true
            k3s_install_hard_links: true
            k3s_server:
              flannel-backend: 'host-gw'
              disable-helm-controller: true
              prefer-bundled-bin: true
              node-external-ip:
                - "{{ main_public_ip }}"
              tls-san:
                - oracle4.bhyoo.com
        - ansible.builtin.import_role:
            name: xanmanning.k3s
