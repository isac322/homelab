# /etc/systemd/system/rtslib-fb-targetctl.service.d/50-homelab-zvol-wait.conf
# Restore LIO only after udev created every /dev/zvol link, and fail the unit
# when targetctl skipped a saved storage object or LUN. See README.md here.
[Unit]
Wants=zfs-volumes.target
After=zfs-volumes.target

[Service]
ExecStartPost=/usr/local/sbin/homelab-lio-restore-check
