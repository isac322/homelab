PACKAGE_NAME="nvme-tcp-host"
PACKAGE_VERSION="#MODULE_VERSION#"
AUTOINSTALL="yes"

source_tree="/usr/src/${PACKAGE_NAME}-${PACKAGE_VERSION}"
build_tree="${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build"

if [[ -n "${kernelver:-}" ]]; then
  missing=$("${source_tree}/select-modules.sh" "$kernelver" host)
else
  missing="nvme-fabrics nvme-tcp"
fi

if [[ -z "$missing" ]]; then
  BUILT_MODULE_NAME[0]="nvme-fabrics"
  BUILT_MODULE_LOCATION[0]="module/"
  DEST_MODULE_LOCATION[0]="/updates/dkms/"
  BUILT_MODULE_NAME[1]="nvme-tcp"
  BUILT_MODULE_LOCATION[1]="module/"
  DEST_MODULE_LOCATION[1]="/updates/dkms/"
  BUILD_EXCLUSIVE_KERNEL="a^"
else
  index=0
  for module in $missing; do
    BUILT_MODULE_NAME[$index]="$module"
    BUILT_MODULE_LOCATION[$index]="module/"
    DEST_MODULE_LOCATION[$index]="/updates/dkms/"
    index=$((index + 1))
  done
  module_arg=${missing// /,}
  PRE_BUILD="./prepare.sh ${kernelver} host ${module_arg} ${build_tree}/module"
  MAKE[0]="make -C /lib/modules/${kernelver}/build M=${build_tree}/module modules"
  CLEAN="make -C /lib/modules/${kernelver}/build M=${build_tree}/module clean"
fi
